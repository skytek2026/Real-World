Object.assign(window.sharedChrome, { _ok:true });

/* ── Live search ─────────────────────────────────────────────────────────────
   SEARCH_INDEX is a snapshot of names from the pages that own them (vessels:
   MarinePortfolioDetails, companies: Companies, portfolios: AllPortfolios,
   groups: Portfolio Groups, ports: PortDetails). Results open the same pages,
   with the same sessionStorage hand-off, as clicking the item on its own page. */
const SEARCH_INDEX = {"pages":[{"n":"Marine Dashboard","h":"MarineDashboard.html","a":"Marine"},{"n":"Property Dashboard","h":"PropertyDashboard.html","a":"Property"},{"n":"Aviation Dashboard","h":"AviationDashboard.html","a":"Aviation"},{"n":"Offshore/Energy Dashboard","h":"OffshoreDashboard.html","a":"Offshore/Energy"},{"n":"Cargo Voyage Analysis","h":"CargoDashboard.html","a":"Cargo"},{"n":"Regions","h":"Regions.html","a":"Regions"},{"n":"All Portfolios","h":"AllPortfolios.html","a":"Portfolios"},{"n":"Reports","h":"Reports.html","a":"Reports"},{"n":"Companies","h":"Companies.html","a":"Companies"},{"n":"Nat Cat Events","h":"NatCatEvents.html","a":"Nat Cat"},{"n":"Asset Search","h":"AssetsSearch.html","a":"Assets"},{"n":"Ports","h":"Ports.html","a":"Ports"},{"n":"Weather","h":"Weather.html","a":"Weather"},{"n":"News","h":"News.html","a":"News"},{"n":"Add Region","h":"CreateNewRegion.html","a":"Regions"},{"n":"Organisations","h":"Organisations.html","a":"Admin"},{"n":"Rule Sets","h":"RuleSets.html","a":"Admin"},{"n":"Administration","h":"Administration.html","a":"Admin"},{"n":"My Profile","h":"Profile.html","a":"Account"},{"n":"Contact Support","h":"ContactSupport.html","a":"Account"}],"vessels":["ARCTIC EXPLORER","ARDMORE ENCOUNTER","ARDMORE EXPORTER","ARDMORE SEALION","ARDMORE SEAVANGUARD","ATLANTIC PRIDE","BLUE HORIZON","CORAL SEA","Car Sun","EASTERN PROMISE","FRESH BREEZE","GOLDEN TRADER","GRAND VICTORIA","MEDITERRANEAN STAR","MORNING MIDAS","NEPTUNE PAROS","NORTHERN WAVE","OCEAN VOYAGER","PACIFIC DAWN","PACIFIC SPIRIT","SEA PHOENIX","SIEM CONFUCIUS","STAR NAVIGATOR","STIBING","Zenon Star"],"companies":[{"n":"Harbourline Property Holdings","t":"Property Company","c":"United Kingdom"},{"n":"Skyward Aviation Leasing Ltd","t":"Aviation Company","c":"Ireland"},{"n":"Ramous Maritime Company Ltd","t":"Shipping Company","c":"Cyprus"},{"n":"Turvalu Naviera S.A.","t":"Shipping Company","c":"Panama"},{"n":"Ship Owner Investment Co.","t":"Investment Company","c":"Marshal ":178,"ex":"$9.2B","id":"AVI0002"},{"n":"Regional Turboprop Fleet","cat":"Aviation","pol":94,"ex":"$680M","id":"AVI0003"},{"n":"Cargo Aircraft Portfolio","cat":"Aviation","pol":57,"ex":"$2.3B","id":"AVI0004"},{"n":"Manhattan Commercial","cat":"Property","pol":156,"ex":"$2.8B","id":"PRO0001"},{"n":"London Financial District","cat":"Property","pol":234,"ex":"$1.9B","id":"PRO0002"},{"n":"Tokyo Industrial Zone","cat":"Property","pol":145,"ex":"$3.2B","id":"PRO0003"},{"n":"Dubai Business Bay","cat":"Property","pol":67,"ex":"$1.2B","id":"PRO0004"},{"n":"Singapore CBD","cat":"Property","pol":98,"ex":"$1.7B","id":"PRO0005"}],"groups":["FIRST","MarineFleet2","Offshore Marine Group","Specialized Marine Vessels"],"ports":[{"n":"Bandar Imam Khomeini","c":"Iran"},{"n":"Jebel Ali","c":"UAE"},{"n":"Abu Dhabi","c":"UAE"},{"n":"Port Said","c":"Egypt"},{"n":"Long Beach","c":"USA"}]};
const SEARCH_TYPES = [
  { key:'pages',      label:'Pages',            one:'Page',            icon:'LayoutGrid' },
  { key:'vessels',    label:'Vessels',          one:'Vessel',          icon:'Ship' },
  { key:'companies',  label:'Companies',        one:'Company',         icon:'Building2' },
  { key:'portfolios', label:'Portfolios',       one:'Portfolio',       icon:'Briefcase' },
  { key:'groups',     label:'Portfolio groups', one:'Portfolio group', icon:'Folder' },
  { key:'ports',      label:'Ports',            one:'Port',            icon:'Anchor' },
];
const PF_DEST = {
  Marine:   { key:'selectedPortfolio',         url:'MarinePortfolioDetails.html' },
  Offshore: { key:'selectedOffshorePF',        url:'OffshorePortfolioDetails.html' },
  Aviation: { key:'selectedAviationPortfolio', url:'AviationPortfolioDetails.html' },
  Property: { key:'selectedPropertyPortfolio', url:'PropertyPortfolioDetails.html' },
};
const searchItems = (() => {
  const I = SEARCH_INDEX, out = [];
  I.pages.forEach(p => out.push({ type:'pages', name:p.n, sub:p.a, href:p.h }));
  I.vessels.forEach(v => out.push({ type:'vessels', name:v, sub:'Marine', href:'VesselDetails.html' }));
  I.companies.forEach(c => out.push({ type:'companies', name:c.n, sub:`${c.t} · ${c.c}`, href:'Companies.html?q=' + encodeURIComponent(c.n) }));
  I.portfolios.forEach(p => out.push({ type:'portfolios', name:p.n, sub:`${p.cat}${p.ex ? ' · ' + p.ex : ''}`, href:PF_DEST[p.cat].url,
    store:[PF_DEST[p.cat].key, { name:p.n, policies:p.pol, assets:p.pol, exposure:p.ex, activePolicies:p.pol, id:p.id }] }));
  I.groups.forEach(g => out.push({ type:'groups', name:g, sub:'Marine', href:'MarinePortfolioGroupOverview.html?group=' + encodeURIComponent(g),
    store:['selectedPortfolioGroup', { name:g }] }));
  I.ports.forEach(p => out.push({ type:'ports', name:p.n, sub:p.c, href:'PortDetails.html', store:['selectedPort', { name:p.n, country:p.c }] }));
  return out;
})();
let dashQuery = '', dashActive = -1, dashResults = [];

const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
function lucideIco(name, size) {
  const d = window.lucide && lucide.icons && lucide.icons[name]; if (!d) return '';
  const [tag, attrs, kids] = d, a = o => Object.entries(o).map(([k, v]) => `${k}="${v}"`).join(' ');
  return `<${tag} ${a({ ...attrs, width:size, height:size })} aria-hidden="true">${(kids || []).map(([t, ca]) => `<${t} ${a(ca)}/>`).join('')}</${tag}>`;
}
function searchRank(q) {
  if (!q) return [];
  const scored = [];
  searchItems.forEach(it => {
    const n = it.name.toLowerCase(), s = (it.sub || '').toLowerCase();
    // the sub-line only counts for companies and ports (type / country); elsewhere it's a generic area name
    const subOk = (it.type === 'companies' || it.type === 'ports') && q.length >= 2 && s.includes(q);
    let score = n.startsWith(q) ? 0 : n.split(/[\s/(\-]+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : subOk ? 3 : -1;
    if (score >= 0) scored.push({ ...it, score });
  });
  const out = [];
  SEARCH_TYPES.forEach(t => scored.filter(r => r.type === t.key)
    .sort((a, b) => a.score - b.score || a.name.localeCompare(b.name)).slice(0, 5).forEach(r => out.push(r)));
  return out;
}
function highlight(name, q) {
  const i = name.toLowerCase().indexOf(q);
  if (!q || i < 0) return escH(name);
  return escH(name.slice(0, i)) + '<mark>' + escH(name.slice(i, i + q.length)) + '</mark>' + escH(name.slice(i + q.length));
}
function SearchBox() {
  return `
      <div class="dash-search w-full max-w-[560px] mt-3 relative text-left">
        <div class="dash-search-field flex items-center gap-2 bg-white border border-ink-200 rounded-xl px-3.5 shadow-card">
          <span class="text-ink-400 inline-flex">${lucideIco('Search', 18)}</span>
          <input id="dash-search" type="search" autocomplete="off" spellcheck="false"
            role="combobox" aria-expanded="false" aria-controls="dash-search-list" aria-autocomplete="list"
            aria-label="Search vessels, companies, portfolios, ports or pages"
            placeholder="Search vessels, companies, portfolios, ports or pages…"
            value="${escH(dashQuery)}" />
          <kbd class="dash-kbd" aria-hidden="true">/</kbd>
        </div>
        <div id="dash-search-list" role="listbox" aria-label="Search results" class="dash-results bg-white border border-ink-200 rounded-xl" hidden></div>
      </div>`;
}
function renderSearchResults() {
  const input = document.getElementById('dash-search'), list = document.getElementById('dash-search-list');
  if (!input || !list) return;
  const q = dashQuery.trim().toLowerCase();
  dashResults = searchRank(q);
  if (!q) { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); return; }
  let html = '', n = 0;
  if (!dashResults.length) {
    html = `<div class="dash-empty">No matches for “${escH(dashQuery.trim())}”. Try a vessel, company, portfolio or port name.</div>`;
  } else {
    SEARCH_TYPES.forEach(t => {
      const rows = dashResults.filter(r => r.type === t.key);
      if (!rows.length) return;
      html += `<div class="dash-grp" role="presentation">${t.label}</div>`;
      rows.forEach(r => {
        const i = n++;
        html += `<a id="dash-opt-${i}" role="option" aria-selected="${i === dashActive}" class="dash-opt${i === dashActive ? ' is-active' : ''}" href="${escH(r.href)}" data-i="${i}" tabindex="-1">
          <span class="dash-opt-ico">${lucideIco(t.icon, 16)}</span>
          <span class="dash-opt-txt"><span class="dash-opt-name">${highlight(r.name, q)}</span>${r.sub ? `<span class="dash-opt-sub">${escH(r.sub)}</span>` : ''}</span>
          <span class="dash-opt-type">${t.one}</span>
        </a>`;
      });
    });
    html += `<div class="dash-hint" aria-hidden="true"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span></div>`;
  }
  list.innerHTML = html;
  list.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  if (dashActive >= 0) input.setAttribute('aria-activedescendant', 'dash-opt-' + dashActive); else input.removeAttribute('aria-activedescendant');
}
function openSearchResult(i) {
  const r = dashResults[i]; if (!r) return;
  if (r.store) { try { sessionStorage.setItem(r.store[0], JSON.stringify(r.store[1])); } catch (e) {} }
  location.href = r.href;
}
function wireSearch() {
  const input = document.getElementById('dash-search'), list = document.getElementById('dash-search-list');
  if (!input) return;
  const setActive = i => {
    dashActive = i;
    list.querySelectorAll('.dash-opt').forEach(o => { const on = +o.dataset.i === i; o.classList.toggle('is-active', on); o.setAttribute('aria-selected', on); });
    if (i >= 0) { input.setAttribute('aria-activedescendant', 'dash-opt-' + i); document.getElementById('dash-opt-' + i)?.scrollIntoView({ block:'nearest' }); }
  };
  input.addEventListener('input', () => { dashQuery = input.value; dashActive = dashResults.length ? -1 : -1; renderSearchResults(); });
  input.addEventListener('focus', () => { if (dashQuery.trim()) renderSearchResults(); });
  input.addEventListener('keydown', e => {
    const n = dashResults.length;
    if (e.key === 'ArrowDown') { e.preventDefault(); if (list.hidden) renderSearchResults(); if (n) setActive((dashActive + 1) % n); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (n) setActive(dashActive <= 0 ? n - 1 : dashActive - 1); }
    else if (e.key === 'Enter') { if (n) { e.preventDefault(); openSearchResult(dashActive >= 0 ? dashActive : 0); } }
    else if (e.key === 'Escape') { if (!list.hidden) { list.hidden = true; input.setAttribute('aria-expanded', 'false'); } else { input.value = dashQuery = ''; } dashActive = -1; }
  });
  list.addEventListener('mousedown', e => e.preventDefault());           // keep focus in the field
  list.addEventListener('mousemove', e => { const o = e.target.closest('.dash-opt'); if (o && +o.dataset.i !== dashActive) setActive(+o.dataset.i); });
  list.addEventListener('click', e => {
    const o = e.target.closest('.dash-opt'); if (!o) return;
    const r = dashResults[+o.dataset.i];
    if (r && r.store) { try { sessionStorage.setItem(r.store[0], JSON.stringify(r.store[1])); } catch (err) {} }
  });
  if (!window.__dashSearchDocWired) {
    window.__dashSearchDocWired = true;
    document.addEventListener('click', e => {
      if (e.target.closest('.dash-search')) return;
      const l = document.getElementById('dash-search-list'), i = document.getElementById('dash-search');
      if (l && !l.hidden) { l.hidden = true; i && i.setAttribute('aria-expanded', 'false'); }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target, typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
      if (typing) return;
      const i = document.getElementById('dash-search'); if (i) { e.preventDefault(); i.focus(); i.select(); }
    });
  }
}

function Content() {

        <div class="text-xs text-ink-500">${now.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'})} · <span id="clock">${now.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'})}</span> · Global ops normal</div>

    <section class="mb-6">

        const t = tone(k.tone);
        const deltaCls = k.dir==='up' ? (k.danger?'text-rose-600 bg-rose-50':'text-emerald-600 bg-emerald-50') : k.dir==='down' ? 'text-rose-600 bg-rose-50' : 'text-ink-500 bg-ink-100';
        const arrow = k.dir==='up' ? Ico.arrowUp : k.dir==='down' ? Ico.arrowDown : '';
        return `<div class="relative text-left p-4">
          <div class="flex items-start justify-between">
            <div class="h-9 w-9 rounded-lg ${t.bg} ${t.text} flex items-center justify-center ring-1 ${t.ring}">${Ico[k.icon]}</div>
            ${k.delta ? `<span class="inline-flex items-center gap-1 text-[11px] font-semibold rounded-full px-1.5 py-0.5 ${deltaCls}">${arrow}${k.delta}</span>` : ''}

      }).join('')}

    </section>

    <section class="grid grid-cols-2 lg:grid-cols-4 gap-density mb-6">
      ${CATEGORIES.map(c => {
        const tag = c.href ? 'a' : 'button';
        const hrefAttr = c.href ? `href="${c.href}"` : '';
        return `<${tag} ${hrefAttr} class="dashboard-tile group bg-white rounded-xl border border-ink-200 p-5 shadow-card hover:shadow-card-hover tile-hover ring-focus relative overflow-hidden block no-underline transition-colors">
          <div class="flex items-center justify-center text-brand-600 group-hover:text-white h-14 transition-colors">${Ico[c.icon]}</div>
          <div class="mt-2 text-center text-base font-semibold text-brand-600 group-hover:text-white transition-colors">${c.label}</div>

          <div class="mt-3 pt-3 border-t border-ink-100 group-hover:border-white/30 grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px] transition-colors">
            <div class="flex items-center justify-between gap-2"><span class="text-ink-500 group-hover:text-white/80 transition-colors">Assets</span><span class="inline-flex items-center gap-1 font-semibold text-ink-800 group-hover:text-white transition-colors"><span class="text-brand-500 group-hover:text-white inline-flex [&_svg]:!h-3.5 [&_svg]:!w-3.5 transition-colors">${Ico[c.icon]}</span><span class="tabular-nums">${c.assets}</span></span></div>

        <div class="text-brand-600 group-hover:text-white transition-colors">${Ico[q.icon]}</div>
        <div class="text-sm font-semibold text-brand-600 group-hover:text-white transition-colors">${q.label}</div>
        ${q.alert ? `<div class="w-full mt-2 pt-2 border-t border-ink-100 group-hover:border-white/30 flex justify-center transition-colors"><span class="inline-flex items-center gap-1.5 text-[11px] font-semibold text-rose-600 group-hover:text-white transition-colors"><span class="h-1.5 w-1.5 rounded-full bg-rose-500 dot-pulse"></span>${q.newCount} ${q.alertLabel}</span></div>` : ''}
        ${q.metrics ? `<div class="w-full mt-2 pt-2 border-t border-ink-100 group-hover:border-white/30 ${q.inline ? 'flex justify-center gap-5' : 'flex flex-col gap-1'} text-[11px] transition-colors">${q.metrics.map(([k,v]) => q.inline ? `<div class="flex items-center gap-1.5"><span class="text-ink-500 group-hover:text-white/80 transition-colors">${k}</span><span class="font-semibold tabular-nums text-ink-800 group-hover:text-white transition-colors">${v}</span></div>` : `<div class="flex items-center justify-between gap-2"><span class="text-ink-500 group-hover:text-white/80 transition-colors">${k}</span><span class="font-semibold tabular-nums text-ink-800 group-hover:text-white transition-colors">${v}</span></div>`).join('')}</div>` : ''}
      </a>`).join('')}
    </section>

    <section class="border-t border-ink-200 pt-4 pb-8 flex flex-wrap items-center justify-between gap-3 text-[11px] text-ink-500">
      <div class="flex items-center gap-4"><span class="inline-flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>All systems operational</span><span>Last sync just now</span></div>
      <div class="flex items-center gap-4"><span>v2.4.1</span><span>Region · Global</span></div>
    </section>
  </div>`;
}

window.render = function render() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col">
      ${SC.Topbar()}
      <main class="flex-1 overflow-y-auto scroll-thin">${Content()}</main>
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  wireSearch();
  const clock = document.getElementById('clock');
  if (clock) setInterval(() => {
    const el = document.getElementById('clock');
    if (el) el.textContent = new Date().toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
  }, 30000);
};
window.render();
</script>
