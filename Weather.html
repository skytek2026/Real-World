/* ── Lucide icon helper ──────────────────────────────────────────────────── */
function lico(name, size = 16, color = 'currentColor', sw = 2) {
  const data = window.lucide && lucide.icons && lucide.icons[name];
  if (!data) return '';
  const [tag, attrs, children] = data;
  const a = { ...attrs, width: size, height: size, stroke: color, 'stroke-width': sw,
               style: 'display:inline-block;vertical-align:middle;flex-shrink:0' };
  const attrStr = Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(' ');
  const inner = (children || []).map(([ct, ca]) =>
    `<${ct} ${Object.entries(ca).map(([k, v]) => `${k}="${v}"`).join(' ')}/>`
  ).join('');
  return `<${tag} ${attrStr}>${inner}</${tag}>`;
}

/* ── Tab pill positioning ────────────────────────────────────────────────── */
function positionTabPills() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      const targetW = aRect.width;
      const targetX = aRect.left - gRect.left;
      // Identify this group so we can recall its previous pill position after re-render.
      const key = group.id || group.dataset.tabGroup || '';
      const prev = key && window._weatherPillCache && window._weatherPillCache[key];
      if (prev) {
        pill.classList.add('is-init');
        pill.style.width = prev.w + 'px';
        pill.style.transform = `translateX(${prev.x}px)`;
        requestAnimationFrame(() => {
          pill.classList.remove('is-init');
          requestAnimationFrame(() => {
            pill.style.width = targetW + 'px';
            pill.style.transform = `translateX(${targetX}px)`;
          });
        });
      } else {
        pill.style.width = targetW + 'px';
        pill.style.transform = `translateX(${targetX}px)`;
        requestAnimationFrame(() => pill.classList.remove('is-init'));
      }
      window._weatherPillCache = window._weatherPillCache || {};
      if (key) window._weatherPillCache[key] = { w: targetW, x: targetX };
    });
  });
}

/* ── State ────────────────────────────────────────────────────────────────── */
let viewMode = 'Map';
let wxMap = null;
let wxTile = null;

const MAP_TILES = {
  street:    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  light:     'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',

function setMapType(type) {
  if (!wxMap) return;
  if (wxTile) wxMap.removeLayer(wxTile);
  wxTile = L.tileLayer(MAP_TILES[type], { attribution:'', maxZoom:19 }).addTo(wxMap);
  wxTile.bringToBack();
  document.querySelectorAll('.map-type-opt').forEach(b => {
    const isOn = b.dataset.mapType === type;
    const lbl   = b.querySelector('[data-label]');
    const check = b.querySelector('[data-check]');
    if (lbl)   { lbl.style.color = isOn ? '#2563eb' : '#374151'; lbl.style.fontWeight = isOn ? '600' : '500'; }
    if (check) { check.style.opacity = isOn ? '1' : '0'; }
  });
}

/* ── Storm popup HTML ─────────────────────────────────────────────────────── */

/* ── Init map ─────────────────────────────────────────────────────────────── */
function initMap() {
  const el = document.getElementById('weather-map');
  if (!el) return;
  if (wxMap) { wxMap.remove(); wxMap = null; wxTile = null; }

  wxMap = L.map(el, { center:[-16, 65], zoom:4, zoomControl:true, scrollWheelZoom:true });
  setMapType('satellite');

  const focusBounds = {}, focusCone = {};
  SYSTEMS.forEach(s => {
    // Track: past positions, forecast positions and forecast cone (shared/storm-track.js)
    const trackLayers = drawStormTrack(wxMap, s);
    const trackBounds = trackLayers.length ? L.featureGroup(trackLayers).getBounds().extend([s.lat, s.lng]) : null;
    if (trackBounds) { focusBounds[s.id] = trackBounds; focusCone[s.id] = trackLayers.find(l => l instanceof L.Polygon); }

    // Main marker (= current position)
    const r = Math.max(7, Math.round(s.radius * 0.6)), d = r * 2;   // ~60% of the old size; min 14px
    const icon = L.divIcon({
      className:'',
      html:`<div class="storm-dot" style="width:${d}px;height:${d}px;border-radius:50%;background:${s.color};border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 ${Math.round(r*.5)}px ${s.glow},0 3px 10px rgba(0,0,0,.25)"></div>`,
      iconSize:[d,d], iconAnchor:[r,r],
    });
    const marker = L.marker([s.lat, s.lng], { icon, autoPanOnFocus:false })
      .bindPopup(stormPopup(s), { className:'storm-popup', maxWidth:230, minWidth:230, closeButton:true })
      .addTo(wxMap);
    // Storms with a track: the first click zooms to the track and forecast cone (at the overview zoom the
    // whole track is only ~40px across); once zoomed in, a click opens the popup. Opening the popup straight
    // away would cover the cone, which usually lies above the storm.
    if (trackBounds) {
      marker.off('click', marker._openPopup, marker);
      marker.on('click', () => {
        const zoomedIn = wxMap.getZoom() >= 5 && wxMap.getBounds().contains(trackBounds);
        if (zoomedIn) { marker.openPopup(); return; }
        wxMap.closePopup();
        wxMap.flyToBounds(trackBounds, { padding:[60, 60], maxZoom:6, duration:0.7 });
      });
    }
  });


  // Frame all systems (now spanning Florida → Indian Ocean → Japan) so each is visible.
  try {
    // Open on Hurricane Milena: its track and forecast cone
    const focus = SYSTEMS.find(s => s.name === 'Hurricane Milena');
    if (focus && focusBounds[focus.id]) {
      // one level closer than the whole track, centred on the current position + forecast cone
      const fb = focusBounds[focus.id], z = wxMap.getBoundsZoom(fb, false, L.point(120, 120)) + 1;
      const cone = focusCone[focus.id];
      wxMap.setView(cone ? cone.getBounds().extend([focus.lat, focus.lng]).getCenter() : fb.getCenter(), z);
    }
    else wxMap.fitBounds(L.latLngBounds(SYSTEMS.map(s => [s.lat, s.lng])), { padding:[50,50], maxZoom:4 });
  } catch (e) {}

  // Custom zoom icons (match Marine Dashboard — Lucide Plus/Minus, centered)
  setTimeout(() => {
    const zin  = el.querySelector('.leaflet-control-zoom-in');
    const zout = el.querySelector('.leaflet-control-zoom-out');
    if (zin)  zin.innerHTML  = `<span class="inline-flex items-center justify-center h-full w-full">${SC.I.plus}</span>`;
    if (zout) zout.innerHTML = `<span class="inline-flex items-center justify-center h-full w-full">${SC.I.minus}</span>`;
  }, 100);

  // Wire fullscreen + layers menu via a single delegated handler (survives re-renders)
  wireMapControls();
}

/* Delegated map-control handler — attached once, works regardless of how many
   times the view re-renders and recreates the buttons. */
let wxControlsWired = false;
function wireMapControls() {
  if (wxControlsWired) return;
  wxControlsWired = true;
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('wx-layers-menu');
    const fsBtn = e.target.closest('#wx-fs-btn');
    if (fsBtn) {
      const w = document.getElementById('wx-map-wrap');
      if (w) {
        const isFs = w.classList.toggle('wx-is-fs');
        w.style.cssText = isFs ? 'position:fixed;inset:0;z-index:9999;' : '';
        fsBtn.innerHTML = isFs ? SC.I.minimize : SC.I.maximize;
        setTimeout(() => wxMap && wxMap.invalidateSize(), 200);
      }
      if (menu) menu.classList.add('hidden');
      return;
    }
    if (e.target.closest('#wx-layers-btn')) {
      if (menu) menu.classList.toggle('hidden');
      return;
    }
    const opt = e.target.closest('.map-type-opt');
    if (opt) {
      setMapType(opt.dataset.mapType);
      if (menu) menu.classList.add('hidden');
      return;
    }
    // Click anywhere else closes the menu
    if (menu) menu.classList.add('hidden');
  });
}

        ${[
          {id:'satellite',label:'Satellite'},
          {id:'street',label:'Street View'},
          {id:'dark',label:'Dark Mode'},
          {id:'light',label:'Light Mode'},
        ].map(o => `
          <button data-map-type="${o.id}" class="map-type-opt w-full flex items-center justify-between px-3 py-2 text-sm text-ink-700 hover:bg-ink-50 transition-colors">
            <span data-label>${o.label}</span>
            <span class="text-brand-700 opacity-0" data-check>${SC.I.check}</span>
          </button>`).join('')}
      </div>
    </div>

    <!-- Legend (rows from shared/storm-track.js, same as the Weather Event map) -->
    <div class="storm-legend" style="position:absolute;bottom:24px;left:12px;z-index:400;">${stormTrackLegendHTML(true)}</div>
  </div>`;
}

function ListView() {
  return `
  <div class="flex-1 overflow-y-auto scroll-thin">
    <table class="wx-tbl wx-tbl--wide">
      <thead>
        <tr>
          <th>System</th>
          <th>Type</th>
          <th>Category</th>
          <th>Max Winds</th>
          <th>Pressure</th>
          <th>Movement</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${SYSTEMS.map(s => `<tr>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;border-radius:50%;background:${s.color};flex-shrink:0;box-shadow:0 0 0 2px ${s.glow}"></span>
              <a href="WeatherEventDetails.html" class="wx-link" data-storm-id="${s.id}">${s.name}</a>
            </div>
          </td>
          <td>${s.type}</td>
          <td style="font-weight:600;color:${s.color}">${s.cat}</td>
          <td style="font-variant-numeric:tabular-nums;font-weight:500">${s.wind} km/h</td>
          <td style="font-variant-numeric:tabular-nums">${s.pressure} hPa</td>
          <td>${s.movement}</td>
          <td><span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#16a34a">Active</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <div class="wx-cards" role="list" aria-label="Weather systems">
      ${SYSTEMS.map(s => `
      <article class="wx-card" role="listitem">
        <dl class="wx-kv wx-kv--top">
          <div><dt>System</dt><dd>
            <span style="display:inline-flex;align-items:center;gap:8px">
              <span style="width:10px;height:10px;border-radius:50%;background:${s.color};flex-shrink:0;box-shadow:0 0 0 2px ${s.glow}"></span>
              <a href="WeatherEventDetails.html" class="wx-link" data-storm-id="${s.id}">${s.name}</a>
            </span>
          </dd></div>
          <div><dt>Status</dt><dd><span style="font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f0fdf4;color:#16a34a">Active</span></dd></div>
        </dl>
        <dl class="wx-kv">
          <div><dt>Type</dt><dd>${s.type}</dd></div>
          <div><dt>Category</dt><dd style="font-weight:600;color:${s.color}">${s.cat}</dd></div>
          <div><dt>Max Winds</dt><dd style="font-variant-numeric:tabular-nums;font-weight:500">${s.wind} km/h</dd></div>
          <div><dt>Pressure</dt><dd style="font-variant-numeric:tabular-nums">${s.pressure} hPa</dd></div>
          <div class="wx-kv-wide"><dt>Movement</dt><dd>${s.movement}</dd></div>
        </dl>
      </article>`).join('')}
    </div>
  </div>`;
}

document.addEventListener('click', e => {
  const a = e.target.closest('.wx-link'); if (!a || e.metaKey || e.ctrlKey) return;
  const storm = SYSTEMS.find(x => String(x.id) === a.dataset.stormId);
  if (storm) sessionStorage.setItem('selectedStorm', JSON.stringify(storm));
});

function Content() {
  return `
  <div class="flex-1 overflow-hidden px-4 py-4" style="display:flex;flex-direction:column">
    <div class="bg-white rounded-xl border border-gray-200 flex flex-col overflow-hidden flex-1" style="box-shadow:0 1px 2px rgba(15,23,42,.06)">
      <div class="shrink-0 px-4 py-3 flex items-center gap-3 border-b border-gray-100">
        <div class="ds-tabs" id="view-tabs">
          <span class="ds-tab-pill is-init" data-tab-pill></span>
          <button class="ds-tab" aria-selected="${viewMode==='Map'}" data-view="Map">
            <span class="ds-tab-label">${lico('Map', 13)} Map</span>
          </button>
          <button class="ds-tab" aria-selected="${viewMode==='List'}" data-view="List">
            <span class="ds-tab-label">${lico('List', 13)} List</span>
          </button>
        </div>
        <span style="margin-left:auto;background:#ea580c;color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap">${SYSTEMS.filter(s=>s.status==='Active').length} Active</span>
      </div>
      ${viewMode === 'Map' ? MapView() : ListView()}
    </div>
  </div>`;
}

/* ── Render ───────────────────────────────────────────────────────────────── */
window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  requestAnimationFrame(positionTabPills);
  setTimeout(positionTabPills, 150);
  window.addEventListener('resize', positionTabPills, { passive: true });

  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    viewMode = b.dataset.view;
    window.render();
    if (viewMode === 'Map') setTimeout(initMap, 50);
  }));

  if (viewMode === 'Map') setTimeout(initMap, 50);
};

window.render();
</script>
</body>
</html>
