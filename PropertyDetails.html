<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .text-ink-900{color:#111827}.text-ink-700{color:#374151}
  .text-ink-600{color:#4b5563}.text-ink-500{color:#6b7280}.text-ink-500{color:#6b7280}
  .bg-ink-100{background:#f3f4f6}.bg-ink-50{background:#f9fafb}
  .border-ink-100{border-color:#f3f4f6}.border-ink-200{border-color:#e5e7eb}
  .shadow-card{box-shadow:0 1px 2px rgba(15,23,42,.05),0 0 0 1px rgba(15,23,42,.02)}
  .text-brand-700{color:var(--brand-700,#0f6aa0)}
  .scroll-thin::-webkit-scrollbar{width:6px}.scroll-thin::-webkit-scrollbar-track{background:transparent}

  .tracking-micro{letter-spacing:0.04em}
  /* Property map popup */
  .prop-popup .leaflet-popup-content-wrapper { padding:0; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,.25); }
  .prop-popup .leaflet-popup-content { margin:0; width:280px !important; font-family:'Inter',sans-serif; }
  .prop-popup .leaflet-popup-tip { background:#fff; }
  .prop-popup .leaflet-popup-close-button { color:#fff !important; top:8px !important; right:10px !important; font-size:24px !important; font-weight:300 !important; width:24px !important; height:24px !important; opacity:.85; }
  .prop-popup .leaflet-popup-close-button:hover { background:rgba(255,255,255,.2) !important; color:#fff !important; opacity:1; }
  .pp { background:#fff; color:#111827; }
  .pp-header { background:var(--brand-600,#2563eb); color:#fff; padding:12px 16px 12px; }
  .pp-title { font-size:14px; font-weight:700; line-height:1.2; }
  .pp-cat { font-size:12px; font-weight:500; opacity:.75; margin-left:4px; }
  .pp-body { padding:4px 0 12px; }
  .pp-row { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; border-bottom:1px solid #f3f4f6; font-size:14px; }
  .pp-row:last-child { border-bottom:0; }
  .pp-k { color:#6b7280; font-weight:500; }
  .pp-v { font-weight:600; color:#111827; text-align:right; }
  .pi-wrap { container-type:inline-size; }
  .pi-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1px; background:#f3f4f6; }
  .pi-cell { padding:8px 16px; background:#fff; min-width:0; }
  .pi-cell.pi-full { grid-column:1/-1; }
  .pi-label { font-size:12px; color:#6b7280; font-weight:600; display:flex; align-items:center; gap:4px; margin-bottom:2px; white-space:nowrap; }
  .pi-value { font-size:14px; font-weight:700; color:#111827; overflow-wrap:break-word; }
  @container (max-width:340px) { .pi-grid { grid-template-columns:1fr; } }
  .pi-value.muted { color:#6b7280; font-weight:500; }
  /* Map */
  #prop-detail-map { position:absolute; inset:0; background:#111827; }
  #prop-detail-map .leaflet-top.leaflet-left { top:56px; left:2px; }
  #prop-detail-map .leaflet-top.leaflet-left .leaflet-bar { margin-left:8px !important; }
  .leaflet-control-zoom,.leaflet-bar { border:1px solid #e5e7eb !important; box-shadow:0 1px 2px rgba(15,23,42,.05) !important; border-radius:8px !important; overflow:hidden; }
  .leaflet-bar a { background:#fff !important; color:#374151 !important; line-height:30px !important; }
  .leaflet-bar a:hover { background:#f3f4f6 !important; }
  .leaflet-top.leaflet-left { top:48px !important; }
  .map-btn { width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid #e5e7eb; border-radius:8px; color:#374151; box-shadow:0 1px 2px rgba(15,23,42,.05); cursor:pointer; flex-shrink:0; }
  .map-btn:hover { background:#f3f4f6; }
  /* Layers menu */
  .map-type-option:hover { background:#f9fafb; }

  .flag-badge { white-space:nowrap; display:inline-flex; align-items:center; gap:4px; background:var(--brand-50,#eff8fd); border:1px solid var(--brand-200,#b8ddf5); border-radius:999px; padding:2px 8px 2px 4px; }
  html[data-theme="dark"] .flag-badge { background:rgba(67,168,223,.14) !important; border-color:rgba(67,168,223,.35) !important; }

  /* Page grid — stack on mobile, side-by-side on desktop */
  .pd-grid { display:grid; grid-template-columns:1fr; align-items:start; }
  .pd-map-col { height:60vh; min-height:360px; }
  @media (min-width: 1024px) {
    .pd-grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
    .pd-map-col { height: calc(100vh - 112px); }
  }
  @media (max-width: 1023px) {
  }
  html { scrollbar-width:thin; scrollbar-color:#1a92d1 #f3f4f6; }
  /* Property map marker: same as the Property Dashboard */
  .marker-icon { position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:1px solid #fff; border-radius:50%; box-shadow:0 2px 6px rgba(0,0,0,.28); color:#fff; }
  .marker-icon .marker-pulse{
    position:absolute; top:-1px; right:-1px;   /* on the circle's edge at the top-right (45deg) */
    width:11px; height:11px; border-radius:50%;
    background:#dc2626; border:2px solid #fff;
    box-shadow:0 0 0 0 rgba(220,38,38,.7);
    animation: marker-pulse 1.6s cubic-bezier(.66,0,0,1) infinite;
  }
  @keyframes marker-pulse{
    0%   { box-shadow:0 0 0 0    rgba(220,38,38,.55); }
    70%  { box-shadow:0 0 0 11px rgba(220,38,38,0);   }
    100% { box-shadow:0 0 0 0    rgba(220,38,38,0);   }
  /* property markers: hover / selected ring (same as the Marine vessels and Aviation markers), just outside the 34px circle */
  .marker-icon { cursor:pointer; }
  .marker-icon::after {
    content:''; position:absolute; left:50%; top:50%;
    width:44px; height:44px; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 5px rgba(0,0,0,.45);
    opacity:0; transition:opacity .14s ease;
    pointer-events:none;
  }
  .leaflet-marker-icon:hover .marker-icon::after, .leaflet-marker-icon.is-selected .marker-icon::after { opacity:1; }
  .leaflet-marker-icon:hover:has(.marker-icon), .leaflet-marker-icon.is-selected:has(.marker-icon) { z-index:1000 !important; }
  @media (prefers-reduced-motion: reduce) { .marker-icon::after { transition:none; } }

/* Property categories and alert list: same as the Property Dashboard (its map markers) */
const PROPERTY_CATEGORIES = [

    ico:`<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 22v-6.57"/><path d="M12 11h.01"/><path d="M12 7h.01"/><path d="M14 15.43V22"/><path d="M15 16a5 5 0 0 0-6 0"/><path d="M16 11h.01"/><path d="M16 7h.01"/><path d="M8 11h.01"/><path d="M8 7h.01"/><rect x="4" y="2" width="16" height="20" rx="2"/></svg>` },

const ALERT_PROPERTIES = new Set(['Southeast Financial Ctr', '1670 Broadway']);

const PROP = (() => {
  try { const r = sessionStorage.getItem('selectedProperty'); return r ? { ...DEFAULT_PROP, ...JSON.parse(r) } : DEFAULT_PROP; }
  catch { return DEFAULT_PROP; }

/* ---- Country code helper ---- */
const COUNTRY_MAP = {
  'USA':'US','UK':'GB','Japan':'JP','UAE':'AE','Singapore':'SG',
  'Hong Kong':'HK','Germany':'DE','Australia':'AU','France':'FR',
  'South Africa':'ZA',
};
function countryCode(loc) {
  for (const [k,v] of Object.entries(COUNTRY_MAP)) {
    if (loc && loc.includes(k)) return v;
  }
  return null;
}
function cityFromLoc(loc) {
  return loc ? loc.split(',')[0].trim() : 'N/A';
}
function countryFromLoc(loc) {
  if (!loc) return 'N/A';
  const parts = loc.split(',');
  return parts.length > 1 ? parts[parts.length - 1].trim() : loc;
}

/* ---- SVG icons (inline, small) ---- */
const icoVal   = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`;
const icoDesc  = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>`;

const icoMapPin= `<svg style="color:var(--brand-700,#0f6aa0)" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>`;

/* ---- Derived fields ---- */
const cc   = countryCode(PROP.location);
const city = cityFromLoc(PROP.location);
const ctry = countryFromLoc(PROP.location);
const desc = `${PROP.cat} property in ${city}`;
const latFmt = PROP.lat ? PROP.lat.toFixed(4) + '°' : 'N/A';
const lngFmt = PROP.lng ? PROP.lng.toFixed(4) + '°' : 'N/A';

/* ---- Current Weather (Open-Meteo, keyless) ---- */
const WX_CODES = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
function windDir(deg) {
  const pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return pts[Math.round(deg / 22.5) % 16];
}
function wxIcon(code, isDay, size) {
  const S = size || 18, st = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const open = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 24 24" ' + st + '>';
  const sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
  const moon = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9"/>';
  const cloud = '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>';
  const cloudSun = isDay ? '<path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6"/>' : '<path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/><path d="M10.1 8a6 6 0 0 1 8.9-3 4 4 0 0 0-.6 7.9"/>';
  const rain = '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/>';
  const snow = '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/>';
  const fog = '<path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 17H7"/><path d="M17 21H9"/>';
  const storm = '<path d="M6 16.326A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.973"/><path d="m13 12-3 5h4l-3 5"/>';
  const g = (code === 0 || code === 1) ? (isDay ? sun : moon)
    : code === 2 ? cloudSun
    : code === 3 ? cloud
    : (code === 45 || code === 48) ? fog
    : (code >= 95) ? storm
    : ((code >= 71 && code <= 77) || code === 85 || code === 86) ? snow
    : rain;
  return open + g + '</svg>';
}
function CardCurrentWeather() {
  return '<div class="bg-white rounded-xl border border-ink-200 shadow-card overflow-hidden">'
    + '<div class="px-4 py-3 border-b border-ink-100 flex items-center gap-2">' + icoCloud
    + '<span class="text-sm font-semibold text-ink-900">Current Weather</span></div>'
    + '<div id="pd-weather" style="padding:16px;"><div class="text-xs text-ink-500">Loading current conditions&hellip;</div></div>'
    + '</div>';
}
async function loadWeather() {
  const el = document.getElementById('pd-weather');
  if (!el) return;
  const lat = PROP.lat, lng = PROP.lng;
  if (lat == null || lng == null) { el.innerHTML = '<div class="text-xs text-ink-500">Location unavailable for this property.</div>'; return; }
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility,precipitation,is_day'
      + '&hourly=temperature_2m,weather_code,is_day&forecast_hours=7&timezone=auto&wind_speed_unit=kn';
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const c = j.current || {}, hr = j.hourly || {};
    const day = c.is_day !== 0;
    const temp = c.temperature_2m != null ? Math.round(c.temperature_2m) : null;
    const spd = c.wind_speed_10m != null ? Math.round(c.wind_speed_10m) : null;
    const gust = c.wind_gusts_10m != null ? Math.round(c.wind_gusts_10m) : null;
    const vis = c.visibility != null ? (c.visibility >= 1000 ? Math.round(c.visibility / 1000) + ' km' : Math.round(c.visibility) + ' m') : '-';

    /* Wind advisory for the building envelope */
    let adv = '';
    if (gust != null) {
      const tone = gust >= 45 ? { bg:'#fee2e2', fg:'#b91c1c', dot:'#dc2626', txt:'Damaging gusts' }
        : gust >= 30 ? { bg:'#fef3c7', fg:'#b45309', dot:'#d97706', txt:'Elevated gusts' }
        : { bg:'#dcfce7', fg:'#15803d', dot:'#16a34a', txt:'Benign wind' };
      adv = '<div style="display:flex;align-items:center;gap:8px;background:' + tone.bg + ';border-radius:8px;padding:8px 12px;margin-top:12px;">'
        + '<span style="width:6px;height:6px;border-radius:999px;background:' + tone.dot + ';flex-shrink:0;"></span>'
        + '<span style="font-size:12px;font-weight:700;color:' + tone.fg + ';">' + tone.txt + '</span>'
        + '<span style="font-size:12px;color:' + tone.fg + ';opacity:.85;margin-left:auto;white-space:nowrap;">Gusting ' + gust + ' kt</span></div>';
    }

    /* Next 6 hours */
    const times = hr.time || [];
    let strip = '';
    if (times.length > 2) {
      const n = Math.min(7, times.length);
      const temps = hr.temperature_2m.slice(1, n).map(t => Math.round(t));
      const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps), span = (hi - lo) || 1;
      const pts = temps.map((t, i) => (i / ((temps.length - 1) || 1) * 100).toFixed(1) + ',' + (22 - (t - lo) / span * 18).toFixed(1)).join(' ');
      strip = '<div style="margin-top:12px;padding-top:12px;border-top:1px solid ' + (day ? '#dbeafe' : '#dde3ec') + ';">'
        + '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;margin-bottom:4px;">Next 6 hours</div>'
        + '<svg viewBox="0 0 100 26" preserveAspectRatio="none" style="width:100%;height:24px;display:block;color:var(--brand-700,#0f6aa0);overflow:visible;"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'
        + '<div style="display:flex;justify-content:space-between;gap:4px;margin-top:4px;">'
        + temps.map((t, i) => {
            const hh = String(times[i + 1]).slice(11, 13);
            return '<div style="flex:1;text-align:center;min-width:0;">'
              + '<div style="color:#6b7280;font-size:12px;line-height:1.3;">' + hh + '</div>'
              + '<div style="color:#6b7280;display:flex;justify-content:center;">' + wxIcon(hr.weather_code[i + 1], hr.is_day[i + 1] !== 0, 15) + '</div>'
              + '<div style="font-size:12px;font-weight:700;color:#111827;font-variant-numeric:tabular-nums;line-height:1.3;">' + t + '&deg;</div></div>';
          }).join('')
        + '</div></div>';
    }

    const stat = (l, v) => '<div style="min-width:0;"><div style="font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;line-height:1.3;">' + l + '</div>'
      + '<div style="font-size:14px;font-weight:600;color:#111827;line-height:1.35;text-wrap:pretty;">' + v + '</div></div>';

    el.style.background = day ? 'linear-gradient(180deg,#f0f7ff,#ffffff)' : 'linear-gradient(180deg,#eef1f6,#ffffff)';
    el.innerHTML = '<div style="display:flex;align-items:center;gap:12px;">'
      + '<div style="color:' + (day ? '#1485c5' : '#4b5563') + ';flex-shrink:0;">' + wxIcon(c.weather_code, day, 42) + '</div>'
      + '<div style="min-width:0;">'
      + '<div style="font-size:30px;font-weight:700;color:#111827;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;">' + (temp != null ? temp + '&deg;C' : '-') + '</div>'
      + '<div style="font-size:12px;color:#4b5563;line-height:1.4;margin-top:4px;text-wrap:pretty;">' + (WX_CODES[c.weather_code] || '-')
      + (c.apparent_temperature != null ? ' &middot; feels ' + Math.round(c.apparent_temperature) + '&deg;' : '') + '</div></div></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px;">'
      + stat('Wind', spd != null ? spd + ' kt ' + windDir(c.wind_direction_10m || 0) : '-')
      + stat('Visibility', vis)
      + stat('Humidity', c.relative_humidity_2m != null ? c.relative_humidity_2m + '%' : '-')
      + stat('Precipitation', c.precipitation != null ? c.precipitation + ' mm' : '-')
      + '</div>' + adv + strip;
  } catch (e) {
    el.innerHTML = '<div class="text-xs text-ink-500">Current conditions unavailable.</div>';
  }
}

/* ---- Map ---- */
let propMap = null;
let propTile = null;

const TILES = {
  satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  street:    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  dark:      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  light:     'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
};

function setMapType(type) {
  if (!propMap) return;
  if (propTile) propMap.removeLayer(propTile);
  propTile = L.tileLayer(TILES[type], { attribution:'', maxZoom:19 }).addTo(propMap);
  propTile.bringToBack();
  document.querySelectorAll('[data-map-type]').forEach(el => {
    el.style.background = el.dataset.mapType === type ? '#f3f4f6' : '';
  });
}

function initMap() {
  const el = document.getElementById('prop-detail-map');
  if (!el) return;
  if (propMap) { propMap.remove(); propMap = null; propTile = null; }

  propMap = L.map(el, {
    center: [PROP.lat || 40.758, PROP.lng || -73.985],
    zoom: 16,
    zoomControl: true,
    scrollWheelZoom: true,
  });
  setMapType('satellite');

  /* Property marker: same as the Property Dashboard (round, category colour + icon, alert dot) */
  const pcat = PROPERTY_CAT_BY_KEY[PROP.cat] || PROPERTY_CATEGORIES[0];
  const pulse = ALERT_PROPERTIES.has(PROP.name) ? `<span class="marker-pulse" title="Active risk alert"></span>` : '';
  const icon = L.divIcon({
    className:'',
    html:`<div class="marker-icon" style="background:${pcat.color}">${pcat.ico}${pulse}</div>`,
    iconSize:[34,34], iconAnchor:[17,17],
  });
  /* Building marker popup */
  const popupHTML = `
  <div class="pp">
    <div class="pp-header">
      <span class="pp-title">${PROP.name}</span>
      <span class="pp-cat">· ${PROP.cat}</span>
    </div>
    <div class="pp-body">
      <div class="pp-row"><span class="pp-k">Location</span><span class="pp-v">${PROP.location}</span></div>
      <div class="pp-row"><span class="pp-k">Value</span><span class="pp-v">${PROP.value}</span></div>
      <div class="pp-row"><span class="pp-k">Occupancy</span><span class="pp-v">${PROP.occupancy}</span></div>
      <div class="pp-row"><span class="pp-k">Size</span><span class="pp-v">${PROP.size}</span></div>
      <div class="pp-row"><span class="pp-k">Risk Rating</span><span class="pp-v" style="color:${PROP.riskColor}">${PROP.risk}</span></div>
      <div class="pp-row"><span class="pp-k">Status</span><span class="pp-v" style="color:${PROP.statusColor}">${PROP.status}</span></div>
      <div class="pp-row"><span class="pp-k">Last Inspection</span><span class="pp-v">${PROP.inspection}</span></div>
    </div>
  </div>`;

  const propMarker = L.marker([PROP.lat || 40.758, PROP.lng || -73.985], { icon, autoPanOnFocus:false })
    .bindPopup(popupHTML, { className:'prop-popup', maxWidth:280, minWidth:280, closeButton:true, autoPanPadding:[30,30] })
    .on('popupopen', () => propMarker._icon && propMarker._icon.classList.add('is-selected'))     // ring stays while the popup is open
    .on('popupclose', () => propMarker._icon && propMarker._icon.classList.remove('is-selected'))
    .addTo(propMap);

  /* Fullscreen toggle — matching Marine Dashboard */
  const pdFsBtn     = document.getElementById('pd-fs-btn');
  const pdContainer = document.getElementById('prop-map-container');
  if (pdFsBtn && pdContainer) {
    pdFsBtn.onclick = () => {
      const isFs = pdContainer.classList.toggle('is-fullscreen');
      if (isFs) { pdContainer.style.cssText = 'position:fixed;inset:0;z-index:9999;border-radius:0'; document.body.style.overflow = 'hidden'; }
      else       { pdContainer.style.cssText = ''; document.body.style.overflow = ''; }
      pdFsBtn.innerHTML = isFs ? Ico.minimize : Ico.maximize;
      pdFsBtn.title = isFs ? 'Exit fullscreen' : 'Toggle fullscreen';
      setTimeout(() => propMap && propMap.invalidateSize(), 200);
    };
  }

  /* Layers toggle — matching Marine Dashboard */
  const btn  = document.getElementById('map-layers-btn');
  const menu = document.getElementById('map-layers-menu');
  if (btn && menu) {
    btn.addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('hidden'); });
    document.addEventListener('click', () => menu.classList.add('hidden'));
    menu.addEventListener('click', e => e.stopPropagation());
    menu.querySelectorAll('[data-map-type]').forEach(opt => {
      opt.addEventListener('click', () => {
        setMapType(opt.dataset.mapType);
        menu.classList.add('hidden');
        menu.querySelectorAll('[data-check]').forEach(c => c.style.opacity = '0');
        const chk = opt.querySelector('[data-check]');
        if (chk) chk.style.opacity = '1';
      });
    });
    const initChk = menu.querySelector('[data-map-type="satellite"] [data-check]');
    if (initChk) initChk.style.opacity = '1';
  }

  /* Zoom icons */
  const zin  = el.querySelector('.leaflet-control-zoom-in');
  const zout = el.querySelector('.leaflet-control-zoom-out');
  if (zin)  zin.innerHTML  = `<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>`;
  if (zout) zout.innerHTML = `<span style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg></span>`;
}

/* ---- Render ---- */
window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  setTimeout(initMap, 50);
  loadWeather();
};
window.render();
</script>
</body>
</html>
