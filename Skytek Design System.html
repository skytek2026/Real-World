  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script type="text/babel">
    const Section = ({ id, eyebrow, title, lead, children }) => (
      <section id={id} className="section" data-screen-label={`${eyebrow}: ${title}`}>
        <div className="section-eyebrow">{eyebrow}</div>
        <h2 className="t-display section-title">{title}</h2>
        {lead && <p className="section-lead">{lead}</p>}
        {children}
      </section>
    );

    const Nav = () => {
      const groups = [
        { label: "Overview", items: [
          ["overview", "Introduction"],
          ["principles", "Design principles"],
        ]},
        { label: "Foundations", items: [
          ["color", "Color"],
          ["typography", "Typography"],
          ["spacing", "Spacing"],
          ["radius-shadow", "Radius & shadow"],
          ["elevation", "Elevation & shadows"],
          ["iconography", "Iconography"],
          ["density", "Density"],
          ["motion", "Motion"],
          ["token-index", "Token index"],
        ]},
        { label: "Components", items: [
          ["c-buttons", "Buttons"],
          ["c-buttons-deep", "Buttons (full spec)"],
          ["c-forms", "Inputs & forms"],
          ["c-forms-deep", "Forms (full spec)"],
          ["c-datetime", "Date & time pickers"],
          ["c-badges", "Badges & status"],
          ["c-alerts", "Alerts"],
          ["c-cards", "Cards"],
          ["c-metrics", "Metric cards"],
          ["c-tiles", "Domain & feature tiles"],
          ["c-facts", "Fact list"],
          ["c-score-ring", "Score ring"],
          ["c-route", "Route card"],
          ["c-tables", "Tables"],
          ["c-tabs", "Tabs & header"],
          ["c-overlays", "Overlays"],
          ["c-modal", "Modal (full spec)"],
          ["c-toast", "Toast & snackbar"],
          ["c-tooltip", "Tooltips"],
          ["c-popover", "Popovers"],
          ["c-filter-drawer", "Filter drawer"],
          ["c-loading", "Loading"],
          ["c-pagination", "Pagination"],
          ["c-dropzone", "Upload drop zone"],
          ["c-article", "Article card"],
          ["c-map-legend", "Map legend"],
        ]},
        { label: "Patterns", items: [
          ["layout", "Layout"],
          ["interaction", "Interaction"],
          ["states", "Empty, error & loading"],
          ["a11y", "Accessibility"],
          ["data-primitives", "Filters, search & bulk"],
          ["event-log", "Event log & timeline"],
          ["voice", "Voice & terminology"],
        ]},
        { label: "Apply", items: [
          ["apply", "Product surfaces"],
        ]},
        { label: "Domain primitives", items: [
          ["dataviz", "Data visualization"],
          ["charts", "Charts (composite)"],
          ["maps", "Maps & geospatial"],
          ["asset-identity", "Asset identity & status"],
          ["formatting", "Time, number & units"],
        ]},
        { label: "Handoff", items: [
          ["handoff", "Engineering handoff"],
          ["export", "Export & reports"],
        ]},
        { label: "Developer", items: [
          ["code", "Code view"],
        ]},
      ];
      const [active, setActive] = React.useState("overview");
      const [open, setOpen] = React.useState(false);
      const latestEntry = (typeof window !== "undefined" && window.CHANGELOG_ENTRIES && window.CHANGELOG_ENTRIES[0]) || null;
      const [changelogSeen, setChangelogSeen] = React.useState(true);
      React.useEffect(() => {
        if (!latestEntry) return;
        try {
          setChangelogSeen(localStorage.getItem("skytek-changelog-seen") === latestEntry.version);
        } catch (e) { setChangelogSeen(true); }
      }, [latestEntry && latestEntry.version]);
      React.useEffect(() => {
        const ids = groups.flatMap(g => g.items.map(([id]) => id));
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
        }, { rootMargin: "-20% 0px -70% 0px", threshold: 0 });
        ids.forEach(id => { const el = document.getElementById(id); if (el) observer.observe(el); });
        return () => observer.disconnect();
      }, []);
      React.useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);
      React.useEffect(() => {
        document.body.style.overflow = open ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [open]);
      return (
        <>
          <button
            className="app-nav-trigger"
            aria-label={open ? "Close navigation" : "Open navigation"}
            aria-expanded={open}
            aria-controls="app-nav-drawer"
            onClick={() => setOpen(o => !o)}
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
              {open ? <><path d="M6 6l12 12"/><path d="M18 6L6 18"/></> : <><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></>}
            </svg>
            <span className="app-nav-trigger-label">Menu</span>
          </button>
          <div className={`app-nav-scrim ${open ? "is-open" : ""}`} onClick={() => setOpen(false)} aria-hidden="true" />
          <nav
            id="app-nav-drawer"
            className={`app-nav ${open ? "is-open" : ""}`}
            aria-label="Spec navigation"
            aria-hidden={typeof window !== "undefined" && window.innerWidth < 960 ? !open : false}
          >
            <div className="app-nav-brand">
              <div className="app-nav-brand-logo-row">
                <img className="app-nav-logo app-nav-logo--light" src="assets/skytek-logo.png" alt="Skytek — Space to Innovate" />
                <img className="app-nav-logo app-nav-logo--dark" src="assets/skytek-logo-dark.png" alt="Skytek — Space to Innovate" />
                <button
                  className="app-nav-close"
                  aria-label="Close navigation"
                  onClick={() => setOpen(false)}
                  style={{ marginLeft: "auto", flexShrink: 0 }}
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
                </button>
              </div>
              <div className="app-nav-brand-meta">
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>Design System</div>
                  <div className="t-caption" style={{ fontSize: 11 }}>{latestEntry ? latestEntry.version : "v1.0"}</div>
                </div>
              </div>
            </div>
            {latestEntry && (
              <a
                href="Changelog.html"
                className={`app-nav-changelog ${changelogSeen ? "" : "has-unseen"}`}
                onClick={() => setOpen(false)}
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                  <path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/>
                </svg>
                <span style={{ flex: 1 }}>Changelog</span>
                {!changelogSeen && (
                  <span className="cl-pulse" role="status" aria-label={`New updates: ${latestEntry.version}`}>
                    <span className="cl-pulse-ring" />
                    <span className="cl-pulse-dot" />
                  </span>
                )}
              </a>
            )}
            {groups.map(g => (
              <div key={g.label}>
                <div className="app-nav-section">{g.label}</div>
                {g.items.map(([id, label]) => {
                  const isExt = id.indexOf(".html") !== -1;
                  return (
                    <a key={id} href={isExt ? id : `#${id}`} className={!isExt && active===id?"is-active":""} onClick={() => setOpen(false)}>{label}</a>
                  );
                })}
              </div>
            ))}
          </nav>
        </>
      );
    };

    const App = () => (
      <div className="app">
        <Nav />
        <main className="app-main">
          <Section id="overview" eyebrow="Skytek · Design System" title="A system for monitoring software."
            lead="Skytek operators run risk monitoring across maritime, aviation, offshore and portfolio domains. This system standardizes the existing UI without redesigning the product; it preserves every flow, screen and pattern, but raises consistency, density and clarity to a level that an engineering team can ship daily.">
            <AuditSummary/>
            <div className="callout">
              <strong>What this is:</strong> the canonical reference for everything visual and interactive in the Skytek React app, tokens, components, layouts, and the rules that bind them.
              <br/><br/>
              <strong>What this is not:</strong> a redesign. The product's information architecture, navigation hierarchy and feature set are unchanged. The system replaces inconsistency with predictability.
            </div>
          </Section>

          <Section id="principles" eyebrow="01 · Foundations" title="Design principles"
            lead="Seven non-negotiables. When two patterns conflict, the one that better serves these principles wins.">
            <Principles/>
          </Section>

          <Section id="color" eyebrow="02 · Foundations" title="Color"
            lead="A restrained palette: one brand ramp (azure, 050–800), one neutral, four status families and the locked A–E rating scale, plus the unverifiable family, event-type tokens, chart palettes, map tokens and the map glyph palette. No raw hex anywhere in module code.">
            <ColorSection/>
          </Section>

          <Section id="typography" eyebrow="03 · Foundations" title="Typography"
            lead="Exo for display & headings, Inter for body & UI, JetBrains Mono for codes. Five heading roles, three body roles, two utility roles. Replaces the legacy Lato + Open Sans pairing.">
            <TypeSection/>
          </Section>

          <Section id="spacing" eyebrow="04 · Foundations" title="Spacing"
            lead="A 4-pt grid. Twelve steps cover everything from icon padding to full-page empty states.">
            <SpacingSection/>
          </Section>

          <Section id="radius-shadow" eyebrow="05 · Foundations" title="Radius & shadow"
            lead="A small set of border radii for predictability. Shadows inherit from our elevation system, no arbitrary dropshadow values.">
            <RadiusShadowSection/>
          </Section>

          <Section id="elevation" eyebrow="06 · Foundations" title="Elevation & shadows"
            lead="Six semantic elevation levels that signal depth and interaction. Shadows respond to user interaction and provide visual feedback across all components.">
            <ElevationScale/>
            <ElevationUsage/>
          </Section>

          <Section id="iconography" eyebrow="06a · Foundations" title="Iconography"
            lead="Lucide is the canonical icon library. A small alias map, seven discrete sizes, 2-px strokes, currentColor, and one inventory shared across every module.">
            <IconographySection/>
          </Section>

          <Section id="density" eyebrow="06b · Foundations" title="Density"
            lead="One attribute on the body element switches the whole app between comfortable and compact. Dashboards default to comfortable; data-heavy lists default to compact.">
            <DensitySection/>
          </Section>

          <Section id="motion" eyebrow="06c · Foundations" title="Motion"
            lead="Four duration tokens, three easing curves, four named system animations. Motion confirms interaction; it never decorates.">
            <MotionSection/>
          </Section>

          <Section id="token-index" eyebrow="06d · Foundations" title="Token index"
            lead="Every CSS variable in the system, searchable. Filter by category or search by name, value, or use-case, the fastest answer to ‘what’s the token for X?’.">
            <TokenIndexSection/>
          </Section>

          <Section id="components" eyebrow="07 · Components" title="Component system"
            lead="Each component is defined in the context of this product, what it does, when to use it, the variants it ships with, and the rules engineers must follow. Listed in the order they're encountered on a typical page.">
            <ComponentsSection/>
          </Section>

          <Section id="c-buttons-deep" eyebrow="07a · Components" title="Buttons: full specification"
            lead="The complete buttons reference: every variant, size, state, anatomy, token mapping, naming matrix, usage rules, and the suggested engineering API. The short overview is Buttons in 07 · Components.">
            <ButtonsDeep/>
          </Section>

          <Section id="c-forms-deep" eyebrow="07b · Components" title="Forms: full specification"
            lead="Field anatomy, eight input states, validation timing, label layouts, grouping, multi-step, form-layout matrix, rules of engagement, and the React API. The short overview is Inputs in 07 · Components.">
            <FormsDeepSection/>
          </Section>

          <Section id="c-datetime" eyebrow="07c · Components" title="Date & time pickers"
            lead="Single date, date range with presets, and a segmented time picker. UTC by default, eight canonical presets, one keyboard model.">
            <DateTimeSection/>
          </Section>

          <Section id="c-modal" eyebrow="07d · Components" title="Modal: full specification"
            lead="The standardized dialog primitive, refactored from AddPortModal: five composable slots, five sizes, a tokenized theme, and built-in accessibility, focus trapping, ESC, return-focus and scroll-lock. Every dialog on the platform builds on this one shell.">
            <ModalSpec/>
          </Section>

          <Section id="c-toast" eyebrow="07e · Components" title="Toast & snackbar"
            lead="Transient feedback that confirms an action just happened. The canonical name is Toast (‘snackbar’ is its alias): a self-dismissing, non-blocking message in one fixed bottom-right region, distinct from the persistent Alert and the blocking Modal. Live demos are the real component.">
            <ToastSpec/>
          </Section>

          <Section id="c-tooltip" eyebrow="07f · Components" title="Tooltips"
            lead="The label-only overlay: names an icon button, expands a truncated cell, explains a disabled control. Non-interactive by construction and never the only home for information a user needs. Full developer contract: placement, delay grouping, API, markup, and the WCAG 2.2 hover/focus requirements.">
            <TooltipSpec/>
          </Section>

          <Section id="c-popover" eyebrow="07g · Components" title="Popovers"
            lead="The interactive, non-modal overlay: filters, row-action menus, methodology notes, low-stakes confirmations. Opened by click, anchored to its trigger, dismissible without blocking the page. Full developer contract: variants, placement, the focus and dismissal model, API, markup and edge cases.">
            <PopoverSpec/>
          </Section>

          <Section id="c-filter-drawer" eyebrow="07h · Components" title="Filter drawer"
            lead="The full filter set for a data view in one right-edge sheet, single-open accordion sections, list, range and category filters, and live apply with no Apply button. Documented from the shipped Assets Search implementation.">
            <FilterDrawerSpec/>
          </Section>

          <Section id="layout" eyebrow="08 · Patterns" title="Layout system"
            lead="One app shell. One page header. One responsive ladder. Layouts compose from primitives: engineers don't invent new shells per module.">
            <LayoutSection/>
          </Section>

          <Section id="interaction" eyebrow="09 · Patterns" title="Interaction"
            lead="Subtle, fast, consistent. Motion supports comprehension; it never delays it.">
            <InteractionSection/>
          </Section>

          <Section id="states" eyebrow="09a · Patterns" title="Empty, error & loading"
            lead="The states that show up at first use, during outages, and at the edges of the data. One gallery, canonical copy from the Voice chapter, and a decision flow for picking the right one.">
            <StatesSection/>
          </Section>

          <Section id="a11y" eyebrow="10 · Patterns" title="Accessibility"
            lead="WCAG 2.2 AA is the floor. Every rule below is enforceable in code review or via lint.">
            <A11ySection/>
          </Section>

          <Section id="data-primitives" eyebrow="10a · Patterns" title="Filters, search & bulk actions"
            lead="The loop on every list page: search, filter, select, act. Chips in the URL, facets with counts, saved views as named links, and a sticky bulk-action bar with undo.">
            <DataPrimitivesSection/>
          </Section>

          <Section id="event-log" eyebrow="10b · Patterns" title="Event log & timeline"
            lead="One event row across the product: glyph + actor + verb + object + time. Five event classes, day grouping, and one Event shape that drives vessel history, audit logs, and live NatCat feeds.">
            <EventLogSection/>
          </Section>

          <Section id="voice" eyebrow="10c · Patterns" title="Voice & terminology"
            lead="Words are tokens too. Twelve button verbs, the terminology glossary, the three-question error template, and the rules that keep the product sounding like one voice.">
            <VoiceSection/>
          </Section>

          <Section id="apply" eyebrow="11 · Apply" title="System applied to product surfaces"
            lead="Four representative screens, refreshed using only the design system primitives. Workflows are unchanged: every action and field maps to the existing codebase.">
            <ApplySection/>
          </Section>

          <Section id="dataviz" eyebrow="12 · Domain primitives" title="Data visualization"
            lead="Charts are how a monitoring product shows its work. A locked palette, sequential and divergent ramps, and rules for axes, legends, and thresholds, wired into the Highcharts theme so every chart in the product reads the same.">
            <DomainSection/>
            <DataVizSection/>
          </Section>

          <Section id="charts" eyebrow="12a · Domain primitives" title="Charts: composite components"
            lead="The composite chart layer: Bar, Line and Donut assembled from the domain primitives (Canvas, Scale, Axis, GridLines, Marks, Tooltip). Token-driven, responsive, and accessible by default, with the API, primitive-assembly blueprints, state architecture and a11y for each. Live demos are the real components.">
            <ChartsSpec/>
          </Section>

          <Section id="maps" eyebrow="13 · Domain primitives" title="Maps & geospatial"
            lead="Skytek lives on maps. Leaflet is the canonical library, four tile providers are the contract, and one teardrop divIcon, type-colored, heading-rotated, is the vessel marker across every surface.">
            <MapsSection/>
          </Section>

          <Section id="asset-identity" eyebrow="13a · Domain primitives" title="Asset identity &amp; status"
            lead="How every asset: vessel, offshore installation, aircraft, property, is identified and status-coded consistently across lists, tables, detail headers, popups, alerts and reports. The Maps chapter governs the asset on a map; this chapter governs it everywhere else: the flag chip, the identity block, the three status dimensions, the event-type palette, and the sanction matrix.">
            <AssetIdentitySection/>
          </Section>

          <Section id="formatting" eyebrow="14 · Domain primitives" title="Time, number & units"
            lead="Formatting is where consistency leaks fastest. One helper module, UTC by default, tabular numerals everywhere, and a unit glossary so kn, nm, FL and bbl mean the same thing in every module.">
            <FormattingSection/>
          </Section>

          <Section id="handoff" eyebrow="15 · Handoff" title="Engineering handoff"
            lead="Tokens, naming, Tailwind mapping, and a 13-week migration plan. Designed so two front-end engineers can adopt it incrementally without freezing feature work.">
            <HandoffSection/>
          </Section>

          <Section id="export" eyebrow="16 · Handoff" title="Export & reports"
            lead="Print is a first-class output. A4 page rules, point-sized typography, four classification levels, watermarks, and a single print stylesheet that turns any app surface into a paginated PDF.">
            <ExportSection/>
          </Section>

          <Section id="code" eyebrow="17 · Developer" title="Code view"
            lead="The source behind this page, for developers. Browse every stylesheet, component and section file, copy any of it, or grab the design tokens as ready-to-paste CSS. Everything is read live from the page's own files, so it always matches what you see above.">
            <CodeViewSection/>
          </Section>

          <div className="section" style={{ borderBottom: 0, paddingTop: 32, paddingBottom: 64 }}>
            <div className="t-caption">End of specification{(window.CHANGELOG_ENTRIES && window.CHANGELOG_ENTRIES[0]) ? ` · ${window.CHANGELOG_ENTRIES[0].version} · ${window.CHANGELOG_ENTRIES[0].date}` : ""}</div>
          </div>
        </main>
      </div>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
