<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>System map — Real World</title>
<!-- Generated by tools/build_system_map.py from tools/system_map.template.html. Edit the template, not this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --line:#e2e8f0; --line-soft:#f1f5f9;
  --text:#0f172a; --text-2:#334155; --muted:#64748b; --faint:#94a3b8;
  --brand:#2563eb; --brand-strong:#1d4ed8; --brand-soft:#eff6ff; --brand-line:#bfdbfe;
  --warn-bg:#fffbeb; --warn-line:#fde68a; --warn-text:#92400e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1220; --surface:#121a28; --surface-2:#172133; --line:#243046; --line-soft:#1b2639;
    --text:#e7ecf4; --text-2:#c0c9d8; --muted:#93a0b4; --faint:#6b7a91;
    --brand:#60a5fa; --brand-strong:#93c5fd; --brand-soft:rgba(96,165,250,.12); --brand-line:rgba(96,165,250,.35);
    --warn-bg:rgba(245,158,11,.1); --warn-line:rgba(245,158,11,.35); --warn-text:#fcd34d;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-width:thin}
body{background:var(--bg);color:var(--text);font:14px/1.5 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* Header */
.hero{padding-top:40px;padding-bottom:22px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted)}
h1{font:700 30px/1.15 'Exo',sans-serif;letter-spacing:-.01em;margin-top:4px}
.lede{margin-top:8px;color:var(--text-2);max-width:68ch;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--muted)}
.meta strong{color:var(--text-2);font-weight:600}

/* Drift banner */
.drift{margin-top:16px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);border-radius:10px;padding:12px 14px;font-size:13px}
.drift strong{font-weight:700}
.drift ul{margin:6px 0 0 18px}
.drift code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace}

/* Toolbar */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.bar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:0 12px 0 34px;font:inherit}
.jump{height:38px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:0 10px;font:inherit;max-width:100%}
.count{font-size:12.5px;color:var(--muted);white-space:nowrap}

/* Sections */
.part{margin-top:28px}
.part > h2{font:700 13px/1 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden;scroll-margin-top:74px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.group-h h3{font:700 16px/1.25 'Exo',sans-serif}
.group-h .n{font:600 12px 'Inter',sans-serif;color:var(--muted);margin-left:6px}
.group-h .home{font-size:12.5px;color:var(--muted);white-space:nowrap}
details.group > summary{list-style:none;cursor:pointer}
details.group > summary::-webkit-details-marker{display:none}
details.group > summary .chev{display:inline-block;margin-right:6px;transition:transform .15s;color:var(--faint)}
details.group[open] > summary .chev{transform:rotate(90deg)}
details.group:not([open]) > summary{border-bottom:0}

/* Rows */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:8px 16px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 16px;border-top:1px solid var(--line-soft);vertical-align:top;font-size:13.5px;color:var(--text-2)}
tr:hover td{background:var(--surface-2)}
.name{font-weight:600;color:var(--text)}
.shown{font-size:12px;color:var(--muted);margin-top:2px}
.path{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.path code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2);overflow-wrap:anywhere}
.copy{flex-shrink:0;border:0;background:transparent;color:var(--faint);cursor:pointer;padding:3px;border-radius:5px;display:inline-grid;place-items:center}
.copy:hover{color:var(--brand);background:var(--brand-soft)}
.copy svg{width:14px;height:14px}
.copied{color:var(--brand)!important}
.date{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.links{white-space:nowrap;display:flex;gap:14px}
.links a{font-weight:600;font-size:13px}
.used summary{cursor:pointer;color:var(--text-2);font-size:13px;list-style:none}
.used summary::-webkit-details-marker{display:none}
.used summary::after{content:' ▸';color:var(--faint)}
.used[open] summary::after{content:' ▾'}
.used ul{list-style:none;margin-top:6px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.unused{color:var(--faint);font-size:12.5px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.hide{display:none!important}
footer{padding:32px 0 48px;font-size:12.5px;color:var(--muted)}

@media (max-width:760px){
  .hero{padding-top:28px} h1{font-size:25px}
  thead,colgroup{display:none}
  table{table-layout:auto}
  table,tbody,tr,td{display:block;width:100%}
  tr{padding:10px 16px;border-top:1px solid var(--line-soft)}
  td{border:0;padding:3px 0}
  td[data-k]::before{content:attr(data-k);display:block;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);margin-top:6px}
  td.first::before{display:none}
  .links{margin-top:8px}
  .group-h{flex-direction:column;gap:2px}
}
</style>
</head>
<body>
<header class="wrap hero">
  <div class="eyebrow">Real World prototype</div>
  <h1>System map</h1>
  <p class="lede" id="lede"></p>
  <div class="meta" id="meta"></div>
  <div class="drift hide" id="drift" role="status"></div>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search pages and files, e.g. vessel, cargo, chrome.js" aria-label="Search pages and files" autocomplete="off" />
    </label>
    <select id="jump" class="jump" aria-label="Jump to section"></select>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
</div>

<main class="wrap" id="main"></main>
<footer class="wrap" id="foot"></footer>

<script>
const DATA = /*__SYSTEM_MAP_DATA__*/null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const codeUrl = p => `https://github.com/${DATA.repo}/blob/${DATA.branch}/${enc(p)}`;
const treeUrl = p => `https://github.com/${DATA.repo}/tree/${DATA.branch}/${enc(p)}`;
const fmtDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', timeZone:'UTC' }) : '—';
const fmtSize = n => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB` : `${(n / 1048576).toFixed(1)} MB`;
const slug = s => 'g-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const pageName = {}; DATA.areas.forEach(a => a.items.forEach(p => { pageName[p.path] = p.name; }));

const otherCount = DATA.total - DATA.pageCount;
document.getElementById('lede').textContent =
  `Every file in the prototype: ${DATA.pageCount} pages in ${DATA.areas.length} areas, and ${otherCount} supporting files. Search for what you see on screen, then send the file name or a link to its code with the change you want.`;
document.getElementById('meta').innerHTML = `
  <span>Built <strong>${esc(fmtDate(DATA.generated.slice(0, 10)))}</strong></span>
  <span>${DATA.total} files</span>
  <a href="${esc(DATA.live)}" target="_blank" rel="noopener">Live site ↗</a>
  <a href="https://github.com/${esc(DATA.repo)}" target="_blank" rel="noopener">Repository on GitHub ↗</a>`;

function pathCell(p) {
  return `<span class="path"><code>${esc(p)}</code><button type="button" class="copy" data-copy="${esc(p)}" aria-label="Copy file path ${esc(p)}" title="Copy file path">${COPY}</button></span>`;
}
function usedCell(f) {
  if (!f.usedBy) return '';
  if (!f.usedBy.length) return '<span class="unused">Not used by any page</span>';
  const label = f.usedBy.length === 1 ? '1 page' : `${f.usedBy.length} pages`;
  return `<details class="used"><summary>${label}</summary><ul>${f.usedBy.map(p => `<li><a href="${enc(p)}">${esc(pageName[p] || p)}</a></li>`).join('')}</ul></details>`;
}

function render() {
  const pagesHTML = DATA.areas.map(a => `
    <section class="group" id="${slug(a.title)}" data-group>
      <div class="group-h">
        <h3>${esc(a.title)}<span class="n">${a.items.length}</span></h3>
        ${a.home ? `<span class="home">Sidebar link: <a href="${enc(a.home)}">${esc(pageName[a.home] || a.home)}</a></span>` : ''}
      </div>
      <table>
        <colgroup><col style="width:40%"><col style="width:34%"><col style="width:13%"><col style="width:13%"></colgroup>
        <thead><tr><th>Page</th><th>File</th><th>Last changed</th><th><span class="sr-only">Links</span></th></tr></thead>
        <tbody>${a.items.map(p => `
          <tr data-row data-text="${esc((p.name + ' ' + p.path + ' ' + (p.shown || '') + ' ' + a.title).toLowerCase())}">
            <td class="first"><div class="name">${esc(p.name)}</div>${p.shown ? `<div class="shown">On screen: ${esc(p.shown)}</div>` : ''}</td>
            <td data-k="File">${pathCell(p.path)}</td>
            <td data-k="Last changed" class="date">${esc(fmtDate(p.changed))}</td>
            <td class="links"><a href="${enc(p.path)}">Open</a><a href="${codeUrl(p.path)}" target="_blank" rel="noopener">Code ↗</a></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </section>`).join('');

  const filesHTML = DATA.groups.map(g => {
    const folder = (() => { const tops = new Set(g.items.map(f => f.path.includes('/') ? f.path.split('/')[0] : '')); return tops.size === 1 && [...tops][0] ? [...tops][0] : null; })();
    const showUsage = g.items.some(f => f.usedBy);
    return `
    <details class="group" id="${slug(g.title)}" data-group ${g.collapsed ? '' : 'open'}>
      <summary class="group-h">
        <h3><span class="chev" aria-hidden="true">▸</span>${esc(g.title)}<span class="n">${g.items.length}</span></h3>
        ${folder ? `<span class="home">Folder: <a href="${treeUrl(folder)}" target="_blank" rel="noopener">${esc(folder)}/ ↗</a></span>` : ''}
      </summary>
      <table>
        <colgroup>${showUsage ? '<col style="width:40%"><col style="width:24%">' : '<col style="width:64%">'}<col style="width:10%"><col style="width:13%"><col style="width:13%"></colgroup>
        <thead><tr><th>File</th>${showUsage ? '<th>Used by</th>' : ''}<th>Size</th><th>Last changed</th><th><span class="sr-only">Links</span></th></tr></thead>
        <tbody>${g.items.map(f => `
          <tr data-row data-text="${esc((f.path + ' ' + g.title + ' ' + (f.usedBy || []).map(p => pageName[p] || p).join(' ')).toLowerCase())}">
            <td class="first">${pathCell(f.path)}</td>
            ${showUsage ? `<td data-k="Used by">${usedCell(f)}</td>` : ''}
            <td data-k="Size" class="date">${esc(fmtSize(f.size))}</td>
            <td data-k="Last changed" class="date">${esc(fmtDate(f.changed))}</td>
            <td class="links"><a href="${codeUrl(f.path)}" target="_blank" rel="noopener">Code ↗</a></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </details>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="part"><h2>Pages</h2>${pagesHTML}</div>
    <div class="part"><h2>Supporting files</h2>${filesHTML}</div>
    <div class="empty hide" id="none">Nothing matches that search.</div>`;
  document.getElementById('jump').innerHTML =
    `<option value="">Jump to…</option><optgroup label="Pages">${DATA.areas.map(a => `<option value="${slug(a.title)}">${esc(a.title)}</option>`).join('')}</optgroup>` +
    `<optgroup label="Supporting files">${DATA.groups.map(g => `<option value="${slug(g.title)}">${esc(g.title)}</option>`).join('')}</optgroup>`;
  document.getElementById('foot').innerHTML =
    `This page is generated from the repository by <code>tools/build_system_map.py</code>. It checks GitHub each time it opens and warns at the top if files have been added or removed since it was built.`;
  filter('');
}

function filter(q) {
  q = q.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  let shown = 0;
  document.querySelectorAll('[data-group]').forEach(g => {
    let any = 0;
    g.querySelectorAll('[data-row]').forEach(r => {
      const ok = terms.every(t => r.dataset.text.includes(t));
      r.classList.toggle('hide', !ok); if (ok) any++;
    });
    g.classList.toggle('hide', !any);
    if (g.tagName === 'DETAILS') {
      if (terms.length && any) { if (!g.open) { g.open = true; g.dataset.autoOpened = '1'; } }
      else if (!terms.length && g.dataset.autoOpened) { g.open = false; delete g.dataset.autoOpened; }
    }
    shown += any;
  });
  document.getElementById('none').classList.toggle('hide', shown > 0);
  document.getElementById('count').textContent = terms.length ? `${shown} of ${DATA.total} files` : `${DATA.total} files`;
}

render();
document.getElementById('q').addEventListener('input', e => filter(e.target.value));
document.getElementById('jump').addEventListener('change', e => {
  const el = e.target.value && document.getElementById(e.target.value);
  if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  e.target.value = '';
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const done = ok => { b.classList.toggle('copied', ok); b.title = ok ? 'Copied' : 'Copy failed'; setTimeout(() => { b.classList.remove('copied'); b.title = 'Copy file path'; }, 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.copy).then(() => done(true), () => done(false)); else done(false);
});

/* Freshness check: compare with the files on GitHub right now. Silent if GitHub can't be reached. */
(async () => {
  try {
    const r = await fetch(`https://api.github.com/repos/${DATA.repo}/git/trees/${DATA.branch}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json(); if (j.truncated) return;
    const live = new Set(j.tree.filter(t => t.type === 'blob').map(t => t.path));
    const known = new Set(DATA.allPaths);
    const added = [...live].filter(p => !known.has(p)).sort();
    const removed = [...known].filter(p => !live.has(p)).sort();
    if (!added.length && !removed.length) return;
    const list = (arr) => `<ul>${arr.slice(0, 12).map(p => `<li><code>${esc(p)}</code></li>`).join('')}${arr.length > 12 ? `<li>and ${arr.length - 12} more</li>` : ''}</ul>`;
    const box = document.getElementById('drift');
    box.innerHTML = `<strong>This map is out of date.</strong> Files have changed on GitHub since it was built on ${esc(fmtDate(DATA.generated.slice(0, 10)))}.` +
      (added.length ? `<div style="margin-top:8px">Added (${added.length}):</div>${list(added)}` : '') +
      (removed.length ? `<div style="margin-top:8px">Removed (${removed.length}):</div>${list(removed)}` : '') +
      `<div style="margin-top:8px">Rebuild it with <code>python3 tools/build_system_map.py</code>.</div>`;
    box.classList.remove('hide');
  } catch (e) { /* offline or blocked: nothing to report */ }
})();
</script>
<style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
