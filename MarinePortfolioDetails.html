/* ── Donut chart SVG ── */
// Banded gradient gauge — matches the Risk Score gauge on the Vessel Details page.
let __mpGaugeId = 0;
function DonutSVG(score = 100) {
  const rsScore = Math.min(100, Math.max(0, score));
  const risk = rsScore <= 10
    ? { label:'GOOD', c:'#16a34a', glow:'#86efac' }
    : rsScore <= 25
    ? { label:'AVERAGE RISK', c:'#f97316', glow:'#fed7aa' }
    : { label:'BELOW AVERAGE', c:'#ef4444', glow:'#fca5a5' };
  // Gauge geometry: 270° arc, start=135°, sweep clockwise
  const CX = 100, CY = 108, R = 80, RO = 95, SW = 11;
  const toRad = d => d * Math.PI / 180;
  const pt = (a, rr) => [+(CX + rr * Math.cos(toRad(a))).toFixed(2), +(CY + rr * Math.sin(toRad(a))).toFixed(2)];
  const [sox, soy] = pt(135, RO);
  const [eox, eoy] = pt(45, RO);
  const GAUGE_MAX = 100, GAUGE_START = 135, GAUGE_SWEEP_DEG = 270;
  const gAngle = s => GAUGE_START + (Math.min(s, GAUGE_MAX) / GAUGE_MAX) * GAUGE_SWEEP_DEG;
  const arcD = (a1, a2, rr) => {
    const [x1, y1] = pt(a1, rr), [x2, y2] = pt(a2, rr);
    const sw = ((a2 - a1) % 360 + 360) % 360;
    return `M ${x1},${y1} A ${rr},${rr} 0 ${sw > 180 ? 1 : 0},1 ${x2},${y2}`;
  };
  // Banded segment color: green ≤10, orange ≤25, red >25
  const gaugeColor = s => (s <= 10 ? '#22c55e' : s <= 25 ? '#f97316' : '#ef4444');
  const N = 26, SEG_GAP = 0.9;
  const whiteCasing = `<path d="${arcD(gAngle(0), gAngle(GAUGE_MAX), R)}" fill="none" stroke="#ffffff" stroke-width="${SW}" stroke-linecap="butt"/>`;
  const segPaths = Array.from({ length: N }, (_, i) => {
    const a1 = gAngle(i * GAUGE_MAX / N) + SEG_GAP;
    const a2 = gAngle((i + 1) * GAUGE_MAX / N) - SEG_GAP;
    const midScore = (i + 0.5) * GAUGE_MAX / N;
    const filled = midScore <= rsScore;
    return `<path d="${arcD(a1, a2, R)}" fill="none" stroke="${filled ? gaugeColor(midScore) : '#e2e8f0'}" stroke-width="${SW}" stroke-linecap="butt"/>`;
  }).join('');
  const glowColor = rsScore <= 10 ? '#86efac' : rsScore <= 25 ? '#fcd34d' : '#fca5a5';
  const fillTipA = gAngle(Math.min(rsScore, GAUGE_MAX));
  const fillTipB = gAngle(Math.max(0, Math.min(rsScore, GAUGE_MAX) - GAUGE_MAX * 0.08));
  const glowPath = rsScore > 0 ? `<path d="${arcD(fillTipB, fillTipA, R)}" fill="none" stroke="${glowColor}" stroke-width="${SW + 8}" stroke-linecap="round" opacity="0.3"/>` : '';
  const gid = `mpGaugeGlow${__mpGaugeId++}`;
  return `
    <div style="position:relative;width:100%;max-width:175px;">
      <svg viewBox="0 0 200 200" style="width:100%;height:auto;overflow:visible;" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="${gid}" cx="50%" cy="55%" r="42%">
            <stop offset="0%" stop-color="${risk.glow}" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="${risk.glow}" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="100" cy="108" rx="70" ry="60" fill="url(#${gid})"/>
        <path d="M ${sox},${soy} A ${RO},${RO} 0 1,1 ${eox},${eoy}"
          fill="none" stroke="#dde4ef" stroke-width="1.5" stroke-dasharray="3 8.2" stroke-linecap="round"/>
        ${glowPath}
        ${whiteCasing}
        ${segPaths}
        <text x="100" y="122" text-anchor="middle" font-size="52" font-weight="800" fill="#0f172a" font-family="Exo,Open Sans,sans-serif">${rsScore}</text>
      </svg>
    </div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:-10px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${risk.c}" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.8" fill="${risk.c}"/></svg>
      <span style="font-size:10px;font-weight:700;color:${risk.c};letter-spacing:0.06em;">${risk.label}</span>
    </div>`;
}

/* ── Tab pill positioning ── */
function positionTabPills() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
      requestAnimationFrame(() => pill.classList.remove('is-init'));
    });
  });
}

/* ── Render ── */
window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main id="main-content" class="flex-1 min-w-0 overflow-y-auto scroll-thin bg-ink-100 px-4 lg:px-6 py-5">
        <!-- Top panels -->
        <div class="top-panels-grid" style="display:grid;gap:12px;margin-bottom:12px;align-items:stretch;">
          ${PanelPortfolioDetails()}
          ${PanelPortfolioActivity()}
          ${PanelRiskBreakdown()}
        </div>
        <!-- Analysis section -->
        <div class="bg-white rounded-xl border border-ink-200 shadow-card overflow-hidden mb-3">
          ${AnalysisTabBar()}
          <div class="p-3" id="analysis-content">
            ${analysisContentFor(analysisTab)}
          </div>
        </div>
        <!-- Policy list -->
        ${PolicySection()}
      </main>
    </div>
    ${SC.TweaksPanel()}
  `;

  SC.wireChrome();
  requestAnimationFrame(positionTabPills);
  window.addEventListener('resize', positionTabPills, { passive:true });

  /* Portfolio Activity / Port Calls tabs */
  document.querySelectorAll('[data-acttab]').forEach(btn => {
    btn.onclick = () => {
      activityTab = btn.dataset.acttab;
      const group = btn.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === btn)));
        positionTabPills();
      }
      const ctrls = group && group.parentElement.querySelector('.shrink-0');
      if (ctrls) ctrls.style.display = activityTab === 'Port Calls' ? 'none' : '';
      const ac = document.getElementById('act-content');
      if (ac) ac.innerHTML = activityTab === 'Port Calls' ? PortCallsContent() : ActivityGrid();
    };
  });

  /* Analysis tabs */
  document.querySelectorAll('[data-atab]').forEach(btn => {
    btn.onclick = () => {
      analysisTab = btn.dataset.atab;
      const group = btn.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === btn)));
        positionTabPills();
      }
      const sel = document.getElementById('analysis-tab-mobile-sel');
      if (sel && sel.value !== analysisTab) sel.value = analysisTab;
      const ac = document.getElementById('analysis-content');
      if (ac) ac.innerHTML = analysisContentFor(analysisTab);
    };
  });

  /* Analysis tab — mobile dropdown */
  const aSel = document.getElementById('analysis-tab-mobile-sel');
  if (aSel) {
    aSel.onchange = () => {
      analysisTab = aSel.value;
      document.querySelectorAll('[data-atab]').forEach(t => {
        t.setAttribute('aria-selected', String(t.dataset.atab === analysisTab));
      });
      positionTabPills();
      const ac = document.getElementById('analysis-content');
      if (ac) ac.innerHTML = analysisContentFor(analysisTab);
    };
  }

  /* Risk Score — sanctions toggle */
  document.querySelectorAll('[data-mp-sanctions]').forEach(b => b.onclick = () => { mpWithSanctions = !mpWithSanctions; window.render(); });

  /* Policy view switcher */
  document.querySelectorAll('[data-pvw]').forEach(btn => {
    btn.onclick = () => {
      policyView = btn.dataset.pvw;
      const group = btn.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === btn)));
        positionTabPills();
        setTimeout(() => window.render(), 220);
      } else { window.render(); }
    };
  });

  /* Policy pagination (DS-compliant) */
  if (!window.__pcardWired) {
    window.__pcardWired = true;
    document.addEventListener('click', (e) => {
      const t = e.target.closest('.pcard-toggle');
      if (!t) return;
      const card = t.closest('.pcard');
      const open = card.classList.toggle('open');
      t.setAttribute('aria-expanded', String(open));
      t.querySelector('.pcard-toggle-txt').textContent = open ? 'Show less' : 'Show more';
    });
  }
  dsWirePagination(document.querySelector('.ds-pagination-wrap'), {
    onPage: (p) => { policyPage = p; window.render(); },
  });
};

window.render();
</script>
