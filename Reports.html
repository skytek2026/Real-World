</style>

function luci(name, size=16, color='currentColor', sw=2) {
  const d = window.lucide && window.lucide.icons && window.lucide.icons[name];
  if (!d) return '';
  const children = d[2] || [];
  const inner = children.map(([t,a]) => `<${t} ${Object.entries(a).map(([k,v])=>`${k}="${v}"`).join(' ')}/>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
}

function portfolioIcon(icon, color) {
  const map = { ship:'Ship', plane:'Plane', building:'Building2', bolt:'Zap' };
  return luci(map[icon] || 'Ship', 14, color, 2);

function today() {

function monthAgo() {

}
function detectAreas(q) {
  const ql = q.toLowerCase();

    .replace(/^### (.+)$/gm, '<strong style="font-size:14px">$1</strong>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, s => `<ul>${s}</ul>`)
    .split('\n\n').map(p => p.trim() ? (p.startsWith('<') ? p : `<p>${p}</p>`) : '').join('');
}

/* ── Core actions ─────────────────────────────────────────────────────────── */
function sendMessage(content) {
  if (!content.trim() || isLoading) return;
  messages.push({ role:'user', content, id:++msgCounter });

  // Push form message — user fills it out before AI responds
  formState = {
    selectedPortfolios: [],
    selectedAreas: detectAreas(content),
    portfolioSearch: '', areaSearch: '',
    dateFrom: monthAgo(), dateTo: today(),
    assetType: 'all',
  };
  messages.push({ role:'form', id:++msgCounter, question:content });
  rerenderChat();
}

async function generateReport() {
  const formMsg = messages.find(m => m.role === 'form');
  if (!formMsg || isLoading) return;

  // Collect live form values
  const df = document.getElementById('date-from');
  const dt = document.getElementById('date-to');
  const at = document.getElementById('asset-type');
  if (df) formState.dateFrom = df.value;
  if (dt) formState.dateTo   = dt.value;
  if (at) formState.assetType = at.value;

  const fs = formState;
  const selPF   = PORTFOLIOS.filter(p => fs.selectedPortfolios.includes(p.id)).map(p => p.name);
  const selArea = AREAS.filter(a => fs.selectedAreas.includes(a.id)).map(a => a.name);

  // Remove form, add confirmation, start generating
  messages = messages.filter(m => m.role !== 'form');
  formState = null;
  messages.push({
    role:'confirm', id:++msgCounter,
    portfolios: selPF.length, areas: selArea.length,
    dateFrom: fs.dateFrom, dateTo: fs.dateTo, assetType: fs.assetType,
  });
  isLoading = true;
  rerenderChat();

  const prompt = `You are an AI assistant for Real World, a maritime risk and insurance analytics platform.
Generate a detailed, professional report for the following query:
Question: "${formMsg.question}"
Selected Portfolios: ${selPF.length ? selPF.join(', ') : 'All portfolios'}
High-Risk Areas: ${selArea.length ? selArea.join(', ') : 'All areas'}
Date Range: ${fs.dateFrom} to ${fs.dateTo}
Asset Type Filter: ${fs.assetType === 'all' ? 'All asset types' : fs.assetType}

Provide a concise, structured report with key metrics, risk findings, and recommendations. Use markdown formatting.`;

  try {
    const response = await window.claude.complete({ messages:[{role:'user',content:prompt}] });
    messages.push({ role:'assistant', content:response, id:++msgCounter });
  } catch(e) {
    messages.push({ role:'assistant', content:'I encountered an error generating your report. Please try again.', id:++msgCounter });
  }
  isLoading = false;
  rerenderChat();
}

/* ── Render & wire ────────────────────────────────────────────────────────── */
function rerenderChat() {
  const area = document.getElementById('chat-area');
  if (!area) return;
  area.innerHTML = messages.length === 0 ? welcomeHTML() : chatHTML();
  const msgs = document.getElementById('msg-scroll');
  if (msgs && !formState) msgs.scrollTop = msgs.scrollHeight;
  wireChat();
}

function wireChat() {
  /* Input & send */
  const input   = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  if (input) {
    input.focus();
    input.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(input.value); input.value=''; } });
  }
  if (sendBtn) sendBtn.addEventListener('click', () => { if(input){ sendMessage(input.value); input.value=''; } });

  /* Suggested chips */
  document.querySelectorAll('[data-q]').forEach(chip => chip.addEventListener('click', () => sendMessage(chip.dataset.q)));

  /* Portfolio checkboxes */
  document.querySelectorAll('[data-pf]').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.pf;
      if (!formState) return;
      if (formState.selectedPortfolios.includes(id)) formState.selectedPortfolios = formState.selectedPortfolios.filter(x=>x!==id);
      else formState.selectedPortfolios.push(id);
      rerenderChat();
    });
  });

  /* Portfolio search */
  const pfSearch = document.getElementById('pf-search');
  if (pfSearch) pfSearch.addEventListener('input', e => {
    if (formState) formState.portfolioSearch = e.target.value;
    rerenderChat();
  });

  /* Area checkboxes */
  document.querySelectorAll('[data-area]').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.area;
      if (!formState) return;
      if (formState.selectedAreas.includes(id)) formState.selectedAreas = formState.selectedAreas.filter(x=>x!==id);
      else formState.selectedAreas.push(id);
      rerenderChat();
    });
  });

  /* Area search */
  const aSearch = document.getElementById('area-search');
  if (aSearch) aSearch.addEventListener('input', e => {
    if (formState) formState.areaSearch = e.target.value;
    rerenderChat();
  });

  /* Generate */
  const genBtn = document.getElementById('gen-report-btn');
  if (genBtn) genBtn.addEventListener('click', generateReport);
}

function wireFleetTab() {
  const search = document.getElementById('fleet-search');
  if (search) {
    search.oninput = (e) => {
      fleetQuery = e.target.value;
      fleetPage = 1;
      const contentEl = document.getElementById('reports-content');
      if (contentEl) {
        contentEl.innerHTML = tabContent();
        wireFleetTab();
        const s2 = document.getElementById('fleet-search');
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      }
    };
    search.onfocus = () => { search.style.borderColor = 'var(--brand-300,#93c5fd)'; search.style.boxShadow = '0 0 0 3px rgba(37,99,235,.12)'; search.style.background = '#fff'; };
    search.onblur  = () => { search.style.borderColor = '#e2e8f0'; search.style.boxShadow = ''; search.style.background = '#f8fafc'; };
  }
  const pp = document.getElementById('fleet-per-page');
  if (pp) pp.onchange = () => { fleetPerPage = parseInt(pp.value); fleetPage = 1; document.getElementById('reports-content').innerHTML = tabContent(); wireFleetTab(); };
  /* Pagination (DS-compliant) */
  dsWirePagination(document.querySelector('.ds-pagination-wrap'), {
    onPage:    (p) => { fleetPage = p; document.getElementById('reports-content').innerHTML = tabContent(); wireFleetTab(); },
    onPerPage: (n) => { fleetPerPage = n; fleetPage = 1; document.getElementById('reports-content').innerHTML = tabContent(); wireFleetTab(); },
  });
  const prev = document.getElementById('fleet-prev');
  const next = document.getElementById('fleet-next');
  if (prev) prev.onclick = () => { if (fleetPage > 1) { fleetPage--; document.getElementById('reports-content').innerHTML = tabContent(); wireFleetTab(); } };
  if (next) next.onclick = () => { const tp = Math.max(1, Math.ceil(FLEET_REPORTS.length / fleetPerPage)); if (fleetPage < tp) { fleetPage++; document.getElementById('reports-content').innerHTML = tabContent(); wireFleetTab(); } };
  document.querySelectorAll('.fleet-act-btn').forEach(b => {
    b.onmouseenter = () => { b.style.background = '#f8fafc'; b.style.borderColor = '#cbd5e1'; };
    b.onmouseleave = () => { b.style.background = '#fff'; b.style.borderColor = '#e2e8f0'; };
    b.onclick = () => {
      const act = b.dataset.act;
      if (act === 'view') {
        // Persist which report row was clicked so the report page can show
        // the correct date / vessels (page currently ships canonical Jan 8 data).
        const wrap = b.closest('[data-report-idx]');
        const idx  = wrap ? parseInt(wrap.dataset.reportIdx, 10) : 0;
        const r    = FLEET_REPORTS[idx] || FLEET_REPORTS[0];
        try { sessionStorage.setItem('selectedFleetReport', JSON.stringify({ idx, ...r })); } catch {}
        window.location.href = 'reports/WeeklyFleetReport.html';
      }
    };
  });
}

function riskColor(r) { return r <= 25 ? '#16a34a' : r <= 50 ? '#f59e0b' : '#dc2626'; }
// Banded gradient gauge — matches the Risk Score gauge on the Vessel Details page.
let __caGaugeId = 0;
function riskDonut(r) {
  const rsScore = Math.min(100, Math.max(0, r));
  const risk = rsScore <= 25
    ? { label:'GOOD', c:'#16a34a', glow:'#16a34a' }
    : rsScore <= 50
    ? { label:'AVERAGE RISK', c:'#d97706', glow:'#fef3c7' }
    : { label:'BELOW AVERAGE', c:'#dc2626', glow:'#fee2e2' };
  // Gauge geometry: 270° arc, start=135°, sweep clockwise
  const CX = 100, CY = 108, R = 80, RO = 95, SW = 11;
  const toRad = d => d * Math.PI / 180;
  const pt = (a, rr) => [+(CX + rr * Math.cos(toRad(a))).toFixed(2), +(CY + rr * Math.sin(toRad(a))).toFixed(2)];
  const [sox, soy] = pt(135, RO);
  const [eox, eoy] = pt(45, RO);
  const GAUGE_MAX = 100, GAUGE_START = 135, GAUGE_SWEEP_DEG = 270;
  const gAngle = s => GAUGE_START + (Math.min(s, GAUGE_MAX) / GAUGE_MAX) * GAUGE_SWEEP_DEG;
  const arcD = (a1, a2, rr) => {
    const [x1, y1] = pt(a1, rr), [x2, y2] = pt(a2, rr);
    const sw = ((a2 - a1) % 360 + 360) % 360;
    return `M ${x1},${y1} A ${rr},${rr} 0 ${sw > 180 ? 1 : 0},1 ${x2},${y2}`;
  };
  const whiteCasing = `<path d="${arcD(gAngle(0), gAngle(GAUGE_MAX), R)}" fill="none" stroke="#ffffff" stroke-width="${SW}" stroke-linecap="butt"/>`;
  const BANDS = [[0,25,'#16a34a'],[25,50,'#d97706'],[50,100,'#dc2626']];
  const BAND_GAP = 1.4;
  const segPaths = BANDS.map(([bs, be, col], bi) => {
    const aStart = gAngle(bs) + (bi > 0 ? BAND_GAP / 2 : 0);
    const aEnd   = gAngle(be) - (bi < BANDS.length - 1 ? BAND_GAP / 2 : 0);
    const fillEnd = Math.max(bs, Math.min(rsScore, be));
    const aFill = gAngle(fillEnd);
    let out = '';
    if (fillEnd > bs) out += `<path d="${arcD(aStart, Math.min(aFill, aEnd), R)}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-linecap="butt"/>`;
    if (fillEnd < be) out += `<path d="${arcD(Math.max(aFill, aStart), aEnd, R)}" fill="none" stroke="#e5e7eb" stroke-width="${SW}" stroke-linecap="butt"/>`;
    return out;
  }).join('');
  const glowColor = rsScore <= 25 ? '#16a34a' : rsScore <= 50 ? '#d97706' : '#fee2e2';
  const fillTipA = gAngle(Math.min(rsScore, GAUGE_MAX));
  const fillTipB = gAngle(Math.max(0, Math.min(rsScore, GAUGE_MAX) - GAUGE_MAX * 0.08));
  const glowPath = rsScore > 0 ? `<path d="${arcD(fillTipB, fillTipA, R)}" fill="none" stroke="${glowColor}" stroke-width="${SW + 8}" stroke-linecap="round" opacity="0.3"/>` : '';
  const gid = `caGaugeGlow${__caGaugeId++}`;
  return `
    <div style="position:relative;width:100%;max-width:185px;">
      <svg viewBox="0 0 200 200" style="width:100%;height:auto;overflow:visible;" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="${gid}" cx="50%" cy="55%" r="42%">
            <stop offset="0%" stop-color="${risk.glow}" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="${risk.glow}" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="100" cy="108" rx="70" ry="60" fill="url(#${gid})"/>
        ${glowPath}
        ${whiteCasing}
        ${segPaths}
        <text x="100" y="122" text-anchor="middle" font-size="52" font-weight="800" fill="#0f172a" font-family="Inter,sans-serif">${r}</text>
      </svg>
    </div>
    <div style="display:flex;align-items:center;gap:4px;margin-top:-10px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${risk.c}" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.8" fill="${risk.c}"/></svg>
      <span style="font-size:10px;font-weight:700;color:${risk.c};letter-spacing:0.06em;">${risk.label}</span>
    </div>`;
}

        </div>` : ''}
      </div>
      ${comparingText}
    </div>

    <!-- Cards or empty state -->
    ${hasSelection ? `
    <div style="flex:1;overflow-y:auto;padding:20px 24px;" class="scroll-thin">
      <div style="display:grid;grid-template-columns:repeat(auto-fill, 320px);gap:16px;justify-content:start;max-width:1376px;margin:0 auto;">
        ${compSelected.map(name => {
          const c = COMPETITOR_COMPANIES.find(x => x.name === name);
          return c ? competitorCard(c) : '';
        }).join('')}
      </div>
    </div>
    ` : `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;">
      <div style="color:#94a3b8;margin-bottom:14px;">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <h3 style="font-size:18px;font-weight:700;color:#0f172a;margin-bottom:6px;text-align:center;">No Companies Selected for Comparison</h3>
      <p style="font-size:13.5px;color:#64748b;line-height:1.6;max-width:340px;text-align:center;">Use the search field above to find and add companies to compare.</p>
    </div>
    `}
  </div>`;
}

function wireCompetitorTab() {
  const search = document.getElementById('comp-search');
  if (search) {
    search.oninput = (e) => {
      compQuery = e.target.value;
      compDropdownOpen = !!compQuery;
      rerenderCompTab(true);
    };
    search.onfocus = () => {
      search.style.borderColor = 'var(--brand-300,#93c5fd)';
      search.style.boxShadow = '0 0 0 3px rgba(37,99,235,.12)';
      search.style.background = '#fff';
      if (compQuery) { compDropdownOpen = true; rerenderCompTab(true); }
    };
    search.onblur = () => {
      search.style.borderColor = '#e2e8f0';
      search.style.boxShadow = '';
      search.style.background = '#f8fafc';
      // Defer hide so click on dropdown registers — but skip the close if focus is still
      // on the (re-rendered) search input or a dropdown item.
      setTimeout(() => {
        const ae = document.activeElement;
        const stillInSearch = ae && (ae.id === 'comp-search' || (ae.closest && ae.closest('#comp-dropdown')));
        if (stillInSearch) return;
        compDropdownOpen = false;
        rerenderCompTab(false);
      }, 150);
    };
  }
  document.querySelectorAll('.comp-dd-item').forEach(b => {
    b.onmouseenter = () => { b.style.background = '#f1f5f9'; };
    b.onmouseleave = () => { b.style.background = 'transparent'; };
    b.onmousedown = (e) => { e.preventDefault(); }; // prevent blur
    b.onclick = () => {
      const name = b.dataset.cname;
      if (name && !compSelected.includes(name)) compSelected.push(name);
      compQuery = '';
      compDropdownOpen = false;
      rerenderCompTab(false);
    };
  });
}

function rerenderCompTab(restoreFocus) {
  const contentEl = document.getElementById('reports-content');
  if (!contentEl) return;
  contentEl.innerHTML = tabContent();
  wireCompetitorTab();
  if (restoreFocus) {
    const s = document.getElementById('comp-search');
    if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
  }
}

// Expose remove/clear handlers globally so inline onclick can reach them
window.__compRemove  = (name) => { compSelected = compSelected.filter(n => n !== name); rerenderCompTab(false); };
window.__compClearAll = () => { compSelected = []; rerenderCompTab(false); };

function tabContent() {
  if (activeTab === 'builder') return `<div id="chat-area" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;background:#f8fafc"></div>`;
  if (activeTab === 'builder1') return window.reportBuilder.content();
  if (activeTab === 'fleet')   return fleetTabContent();
  if (activeTab === 'comp')    return competitorTabContent();
  const icon  = CHT_ICO.replace('width="14"','width="24"').replace('height="14"','height="24"');
  const title = 'Competitor Analysis';
  const desc  = 'Benchmarking and competitive fleet analytics will appear here once configured.';
  return `<div style="flex:1;display:flex;align-items:center;justify-content:center;background:#f8fafc"><div style="text-align:center;max-width:360px">
    <div style="width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 1px 3px rgba(15,23,42,.06)">${icon}</div>
    <h3 style="font-size:16px;font-weight:700;color:#0f172a;margin-bottom:8px">${title}</h3>
    <p style="font-size:13px;color:#64748b;line-height:1.6">${desc}</p>
  </div></div>`;
}

/* ── Main render ──────────────────────────────────────────────────────────── */
window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main class="flex-1 overflow-hidden flex flex-col" style="min-height:0;background:#f1f5f9;padding:12px">
        <div style="flex:1;min-height:0;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.06);display:flex;flex-direction:column;overflow:hidden">
          <!-- DS pill tabs — matching rest of system -->
          <div style="padding:10px 16px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:4px;flex-shrink:0">
            <div class="ds-tabs" id="reports-tabs">
              <span class="ds-tab-pill is-init" id="reports-pill"></span>
              <button class="ds-tab" aria-selected="${activeTab==='builder1'}" data-tab="builder1">
                <span class="ds-tab-label">${STR_ICO} Report Builder</span>
              </button>
              <button class="ds-tab" aria-selected="${activeTab==='builder'}" data-tab="builder">
                <span class="ds-tab-label">${STR_ICO} Report Builder V2</span>
              </button>
              <button class="ds-tab" aria-selected="${activeTab==='fleet'}" data-tab="fleet">
                <span class="ds-tab-label">${DOC_ICO} Weekly Fleet Reports</span>
              </button>
              <button class="ds-tab" aria-selected="${activeTab==='comp'}" data-tab="comp">
                <span class="ds-tab-label">${CHT_ICO} Competitor Analysis</span>
              </button>
            </div>
            <select id="reports-tabs-dd" class="reports-tabs-dd" aria-label="Section">
              <option value="builder1" ${activeTab==='builder1'?'selected':''}>Report Builder</option>
              <option value="builder" ${activeTab==='builder'?'selected':''}>Report Builder V2</option>
              <option value="fleet"   ${activeTab==='fleet'  ?'selected':''}>Weekly Fleet Reports</option>
              <option value="comp"    ${activeTab==='comp'   ?'selected':''}>Competitor Analysis</option>
            </select>
          </div>
          <div id="reports-content" style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">
            ${tabContent()}
          </div>
        </div>
      </main>
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();

  /* Position sliding pill */
  requestAnimationFrame(() => {
    const group  = document.getElementById('reports-tabs');
    const pill   = document.getElementById('reports-pill');
    const active = group && group.querySelector('.ds-tab[aria-selected="true"]');
    if (!pill || !active) return;
    const gRect = group.getBoundingClientRect();
    const aRect = active.getBoundingClientRect();
    pill.style.width     = aRect.width + 'px';
    pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
    requestAnimationFrame(() => pill.classList.remove('is-init'));
  });

  // Mobile dropdown — mirrors tab state
  const tabDD = document.getElementById('reports-tabs-dd');
  function switchTab(next){
    activeTab = next;
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === next)));
    if (tabDD && tabDD.value !== next) tabDD.value = next;
    const grp = document.getElementById('reports-tabs');
    const pl  = document.getElementById('reports-pill');
    const act = grp && grp.querySelector('.ds-tab[aria-selected="true"]');
    if (grp && pl && act && grp.offsetParent !== null) {
      const gR = grp.getBoundingClientRect();
      const aR = act.getBoundingClientRect();
      pl.style.width = aR.width + 'px';
      pl.style.transform = `translateX(${aR.left - gR.left}px)`;
    }
    const contentEl = document.getElementById('reports-content');
    if (contentEl) {
      contentEl.innerHTML = tabContent();
      if (activeTab === 'builder') rerenderChat();
      if (activeTab === 'builder1') window.reportBuilder.wire();
      if (activeTab === 'fleet')   wireFleetTab();
      if (activeTab === 'comp')    wireCompetitorTab();
    }
  }
  if (tabDD) tabDD.addEventListener('change', () => switchTab(tabDD.value));
  document.querySelectorAll('[data-tab]').forEach(btn => btn.addEventListener('click', () => {
    // legacy click handler kept for the pill animation below; route through switchTab for content
    activeTab = btn.dataset.tab;
    if (tabDD) tabDD.value = activeTab;
    // Update aria-selected without re-rendering the tab bar (preserves pill animation)
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
    // Animate pill to new position
    const group = document.getElementById('reports-tabs');
    const pill  = document.getElementById('reports-pill');
    if (group && pill) {
      const gRect = group.getBoundingClientRect();
      const aRect = btn.getBoundingClientRect();
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
    }
    // Swap only the content area
    const contentEl = document.getElementById('reports-content');
    if (contentEl) {
      contentEl.innerHTML = tabContent();
      if (activeTab === 'builder') rerenderChat();
      if (activeTab === 'builder1') window.reportBuilder.wire();
      if (activeTab === 'fleet')   wireFleetTab();
      if (activeTab === 'comp')    wireCompetitorTab();
    }
  }));
  if (activeTab === 'builder') rerenderChat();
  if (activeTab === 'builder1') window.reportBuilder.wire();
  if (activeTab === 'fleet')   wireFleetTab();
  if (activeTab === 'comp')    wireCompetitorTab();
};

window.render();
</script>
</body>
</html>
