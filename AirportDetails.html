function statusBadge(s) {

/* Slide an existing (persistent) pill to its active tab, letting the CSS
   transition animate from its current position (no rebuild snap). */
function slidePill(groupId) {
  const group  = document.getElementById(groupId);
  if (!group) return;
  const pill   = group.querySelector('[data-tab-pill]');
  const active = group.querySelector('.ds-tab[aria-selected="true"]');
  if (!pill || !active) return;
  pill.classList.remove('is-init');
  const g = group.getBoundingClientRect(), a = active.getBoundingClientRect();
  if (!a.width) return;
  pill.style.width     = a.width + 'px';
  pill.style.transform = `translateX(${a.left - g.left}px)`;
}
function refreshTableCard() {
  const body = document.getElementById('ad-table-body');
  if (!body) return;
  body.innerHTML = tableBody();
  wireTablePagination();
  wireTableSort();
}
function wireTableSort() {
  document.querySelectorAll('#ad-table-body [data-sort-key]').forEach(h => h.onclick = () => {
    const k = h.getAttribute('data-sort-key');
    if (tableSort.key === k) tableSort.dir *= -1; else { tableSort.key = k; tableSort.dir = 1; }
    tablePage = 1;
    refreshTableCard();
  });
}
function wireGroundSort() {
  document.querySelectorAll('#ad-ground-body [data-sort-key]').forEach(h => h.onclick = () => {
    const k = h.getAttribute('data-sort-key');
    if (groundSort.key === k) groundSort.dir *= -1; else { groundSort.key = k; groundSort.dir = 1; }
    const body = document.getElementById('ad-ground-body');
    if (body) { body.innerHTML = groundBody(); wireGroundSort(); }
  });
}
function wireTablePagination() {
  dsWirePagination(document.querySelector('#ad-table-body .ds-pagination-wrap'), {
    onPage: (p) => { tablePage = p; refreshTableCard(); },
  });
}
function positionTabPills() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
      requestAnimationFrame(() => pill.classList.remove('is-init'));
    });
  });
}

function sortVal(v) {
  if (typeof v === 'string' && v.charAt(0) === '$') {
    let n = parseFloat(v.replace(/[$,]/g, ''));
    if (/b/i.test(v)) n *= 1000;
    return n;
  }
  return typeof v === 'string' ? v.toLowerCase() : v;
}
function sortRows(arr, state) {
  state = state || tableSort;
  if (!state.key) return arr;
  const k = state.key, d = state.dir;
  return [...arr].sort((a, b) => {
    const x = sortVal(a[k]), y = sortVal(b[k]);
    if (x < y) return -d;
    if (x > y) return d;
    return 0;
  });
}
function sortTh(label, key, right, state) {
  state = state || tableSort;
  const active = state.key === key;
  let ico;
  if (active) {
    const dir = state.dir === 1 ? '<path d="m18 15-6-6-6 6"/>' : '<path d="m6 9 6 6 6-6"/>';
    ico = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--brand-600,#2563eb)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">${dir}</svg>`;
  } else {
    ico = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4;flex-shrink:0"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>`;
  }
  return `<th${right?' class="text-right"':''}><span data-sort-key="${key}" class="inline-flex items-center gap-1${right?' justify-end w-full':''}" style="cursor:pointer;user-select:none">${label} ${ico}</span></th>`;
}

      const w = document.getElementById('airport-map-wrap');

    }
    if (e.target.closest('#ad-layers-btn')) {
      if (menu) menu.classList.toggle('hidden');
      return;
    }
    const opt = e.target.closest('#ad-layers-menu .map-type-opt');

      setAirportMapType(opt.dataset.mapType);
      if (menu) menu.classList.add('hidden');

const WX_CODES = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',95:'Thunderstorm',96:'Thunderstorm, hail',99:'Thunderstorm, hail'};
/* Primary runway magnetic heading per airport, for crosswind calculation */
const RUNWAY_HDG = { LHR:270, JFK:40, DXB:300, SIN:20, ORD:280, VIE:290, FRA:250, AMS:180, HND:340, IKA:290, SZX:150, PEK:180, PVG:160, RGN:30, FIH:60, PAP:90, CPT:10, SYD:160, MEL:160, BKK:190, MEX:50, CDG:260, LAX:250 };
function windDir(deg) {
  const pts = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
  return pts[Math.round(deg / 22.5) % 16];
}
/* Weather glyphs, sized by the size argument */
function wxIcon(code, isDay, size) {
  const S = size || 18, st = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const open = '<svg width="' + S + '" height="' + S + '" viewBox="0 0 24 24" ' + st + '>';
  const sun = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/>';
  const moon = '<path d="M20 14.5A8 8 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>';
  const cloud = '<path d="M6.5 18h11a3.5 3.5 0 0 0 .3-7 5.5 5.5 0 0 0-10.6-1.2A3.6 3.6 0 0 0 6.5 18z"/>';
  const cloudSun = (isDay ? '<circle cx="8" cy="7.5" r="2.6"/><path d="M8 2.8v1.4M3.3 7.5H4.7M4.5 4l1 1"/>' : '<path d="M10.6 8.2A4.6 4.6 0 0 1 6.2 3a4.9 4.9 0 1 0 5.9 6"/>') + '<path d="M9 19h8.5a3.2 3.2 0 0 0 .2-6.4A5 5 0 0 0 8.4 11.6 3.4 3.4 0 0 0 9 19z"/>';
  const rain = cloud + '<path d="M9 20.5l-.8 2M13 20.5l-.8 2M17 20.5l-.8 2"/>';
  const snow = cloud + '<path d="M9 21h.01M13 21.6h.01M17 21h.01"/>';
  const fog = '<path d="M5 9h14M4 13h16M6 17h12M8 21h9"/>';
  const storm = cloud + '<path d="M12.5 20l-2.5 4h3l-1 3 3.5-4.6h-2.6l1.4-2.4z"/>';
  const g = (code === 0 || code === 1) ? (isDay ? sun : moon)
    : code === 2 ? cloudSun
    : code === 3 ? cloud
    : (code === 45 || code === 48) ? fog
    : (code >= 95) ? storm
    : ((code >= 71 && code <= 77) || code === 85 || code === 86) ? snow
    : rain;
  return open + g + '</svg>';
}
async function loadWeather() {
  const el = document.getElementById('ad-weather');
  if (!el) return;
  const D = AIRPORT_DETAILS[AIRPORT.code] || {};
  const lat = D.lat ?? AIRPORT.lat, lng = D.lng ?? AIRPORT.lng;
  if (lat == null || lng == null) { el.innerHTML = '<div class="text-[11px] text-ink-500" style="padding:10px 12px;">Location unavailable for this airport.</div>'; return; }
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng
      + '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,visibility,is_day'
      + '&hourly=temperature_2m,weather_code,is_day&forecast_hours=7&timezone=auto&wind_speed_unit=kn';
    const r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const c = j.current || {}, hr = j.hourly || {};
    const day = c.is_day !== 0;
    const temp = c.temperature_2m != null ? Math.round(c.temperature_2m) : null;
    const spd = c.wind_speed_10m != null ? Math.round(c.wind_speed_10m) : null;
    const dir = c.wind_direction_10m;
    const vis = c.visibility != null ? (c.visibility >= 1000 ? Math.round(c.visibility / 1000) + ' km' : Math.round(c.visibility) + ' m') : '-';

    /* Crosswind against the primary runway */
    const rwy = RUNWAY_HDG[AIRPORT.code];
    let xw = '';
    if (rwy != null && spd != null && dir != null) {
      const rad = (dir - rwy) * Math.PI / 180;
      const cross = Math.abs(spd * Math.sin(rad)), head = spd * Math.cos(rad);
      const tone = cross >= 25 ? { bg:'#fee2e2', fg:'#b91c1c', dot:'#dc2626' }
        : cross >= 15 ? { bg:'#fef3c7', fg:'#b45309', dot:'#d97706' }
        : { bg:'#dcfce7', fg:'#15803d', dot:'#16a34a' };
      const rl = String(Math.round(rwy / 10)).padStart(2, '0');
      xw = '<div style="display:flex;align-items:center;gap:7px;background:' + tone.bg + ';border-radius:6px;padding:6px 9px;margin-top:9px;">'
        + '<span style="width:6px;height:6px;border-radius:999px;background:' + tone.dot + ';flex-shrink:0;"></span>'
        + '<span style="font-size:10.5px;font-weight:700;color:' + tone.fg + ';">' + Math.round(cross) + ' kt crosswind</span>'
        + '<span style="font-size:10px;color:' + tone.fg + ';opacity:.85;margin-left:auto;white-space:nowrap;">RWY ' + rl + ' &middot; ' + (head >= 0 ? 'head' : 'tail') + ' ' + Math.abs(Math.round(head)) + ' kt</span></div>';
    }

    /* Next 6 hours */
    const times = hr.time || [];
    let strip = '';
    if (times.length > 2) {
      const n = Math.min(7, times.length);
      const temps = hr.temperature_2m.slice(1, n).map(t => Math.round(t));
      const lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps), span = (hi - lo) || 1;
      const pts = temps.map((t, i) => (i / ((temps.length - 1) || 1) * 100).toFixed(1) + ',' + (22 - (t - lo) / span * 18).toFixed(1)).join(' ');
      strip = '<div style="margin-top:10px;padding-top:9px;border-top:1px solid ' + (day ? '#dbeafe' : '#dde3ec') + ';">'
        + '<div class="text-[10px] font-semibold uppercase tracking-micro" style="color:#64748b;margin-bottom:5px;">Next 6 hours</div>'
        + '<svg viewBox="0 0 100 26" preserveAspectRatio="none" style="width:100%;height:20px;display:block;color:var(--brand-600,#2563eb);overflow:visible;"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>'
        + '<div style="display:flex;justify-content:space-between;gap:2px;margin-top:3px;">'
        + temps.map((t, i) => {
            const hh = String(times[i + 1]).slice(11, 13);
            return '<div style="flex:1;text-align:center;min-width:0;">'
              + '<div style="color:#94a3b8;font-size:9.5px;line-height:1.3;">' + hh + '</div>'
              + '<div style="color:#64748b;display:flex;justify-content:center;">' + wxIcon(hr.weather_code[i + 1], hr.is_day[i + 1] !== 0, 13) + '</div>'
              + '<div style="font-size:10px;font-weight:700;color:#0f172a;font-variant-numeric:tabular-nums;line-height:1.3;">' + t + '&deg;</div></div>';
          }).join('')
        + '</div></div>';
    }

    const stat = (l, v) => '<div style="min-width:0;"><div class="text-[10px] font-medium uppercase tracking-micro" style="color:#94a3b8;line-height:1.3;">' + l + '</div>'
      + '<div class="text-[11.5px] font-semibold text-ink-900" style="line-height:1.35;text-wrap:pretty;">' + v + '</div></div>';

    el.style.background = day ? 'linear-gradient(180deg,#f0f7ff,#f8fafc)' : 'linear-gradient(180deg,#eef1f6,#f8fafc)';
    el.style.border = '1px solid ' + (day ? '#dbeafe' : '#dde3ec');
    el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;">'
      + '<div style="color:' + (day ? '#2d7ffb' : '#475569') + ';flex-shrink:0;">' + wxIcon(c.weather_code, day, 36) + '</div>'
      + '<div style="min-width:0;">'
      + '<div style="font-size:26px;font-weight:700;color:#0f172a;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;">' + (temp != null ? temp + '&deg;C' : '-') + '</div>'
      + '<div style="font-size:11px;color:#475569;line-height:1.4;margin-top:3px;text-wrap:pretty;">' + (WX_CODES[c.weather_code] || '-')
      + (c.apparent_temperature != null ? ' &middot; feels ' + Math.round(c.apparent_temperature) + '&deg;' : '') + '</div></div></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-top:10px;">'
      + stat('Wind', spd != null ? spd + ' kt ' + windDir(dir || 0) : '-')
      + stat('Visibility', vis)
      + stat('Humidity', c.relative_humidity_2m != null ? c.relative_humidity_2m + '%' : '-')
      + stat('Local time', c.time ? String(c.time).slice(11, 16) : '-')
      + '</div>' + xw + strip;
  } catch (e) {
    el.innerHTML = '<div class="text-[11px] text-ink-500" style="padding:10px 12px;">Current conditions unavailable.</div>';
  }
}

window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="page-col flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  wireInteractions();
  setTimeout(initMap, 50);
  loadWeather();
};
window.render();
</script>
</body>
</html>
