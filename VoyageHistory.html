  minimize:'<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>',
  sort:'<path d="M8 9l4-4 4 4M8 15l4 4 4-4"/>',

};
function svg(path, size = 16, sw = 1.9) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}
function flag(cc) {

}
/* Sortable table helpers (Port Calls / Region tabs) */
function parseDur(s) {
  let m = 0; const d = /(\d+)d/.exec(s), h = /(\d+)h/.exec(s), mm = /(\d+)m\b/.exec(s);
  if (d) m += +d[1] * 1440; if (h) m += +h[1] * 60; if (mm) m += +mm[1];
  return m;
}
function sortHead(label, key, grp, opts = {}) {
  const s = state.sort[grp], active = s.key === key;
  const upPath = '<path d="M8 14l4-4 4 4"/>', downPath = '<path d="M8 10l4 4 4-4"/>';
  const ico = active ? svg(s.dir > 0 ? upPath : downPath, 13, 2.4) : svg(IC.sort, 13, 2);
  return `<th><button class="th-in" data-sort-grp="${grp}" data-sort-key="${key}" style="background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:0;text-transform:uppercase;letter-spacing:.04em;font-size:11px;font-weight:600;color:${active ? '#374151' : '#6b7280'};">${label} <span class="sort-ico inline-flex items-center" style="opacity:${active ? '1' : '.7'}">${ico}</span></button></th>`;
}
function vhSort(rows, grp, numKeys = [], durKeys = []) {
  const s = state.sort[grp];
  if (!s.key) return rows;
  return [...rows].sort((a, b) => {
    let x = a[s.key], y = b[s.key];
    if (numKeys.includes(s.key)) { x = parseFloat(x) || 0; y = parseFloat(y) || 0; }
    else if (durKeys.includes(s.key)) { x = parseDur(x); y = parseDur(y); }
    const c = (typeof x === 'number') ? x - y : String(x).localeCompare(String(y));
    return c * s.dir;
  });
}

/* ===================== DONUT ===================== */
function donut(d) {
  const total = d.segs.reduce((s, x) => s + x.v, 0);
  const size = 160, cx = 80, cy = 80, rO = 74, rI = 49, gap = 2.2;
  const polar = (r, deg) => [cx + r * Math.sin(deg * Math.PI / 180), cy - r * Math.cos(deg * Math.PI / 180)];
  let acc = 0;
  const segs = d.segs.map((s) => {
    const a0 = acc / total * 360, a1 = (acc + s.v) / total * 360;
    acc += s.v;
    const pct = Math.round(s.v / total * 100);
    const s0 = a0 + gap, s1 = a1 - gap;
    const [ox0, oy0] = polar(rO, s0), [ox1, oy1] = polar(rO, s1);
    const [ix1, iy1] = polar(rI, s1), [ix0, iy0] = polar(rI, s0);
    const large = (s1 - s0) > 180 ? 1 : 0;
    const path = `M ${ox0.toFixed(2)} ${oy0.toFixed(2)} A ${rO} ${rO} 0 ${large} 1 ${ox1.toFixed(2)} ${oy1.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${rI} ${rI} 0 ${large} 0 ${ix0.toFixed(2)} ${iy0.toFixed(2)} Z`;
    const [lx, ly] = polar((rO + rI) / 2, (a0 + a1) / 2);
    const label = pct >= 6 ? `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="10" font-weight="700" style="pointer-events:none;font-family:Inter,sans-serif;">${pct}%</text>` : '';
    const tip = `voySeg(event,'${s.l}',${pct},'${s.c}')`;
    return `<path class="voy-seg" d="${path}" fill="${s.c}" onmouseenter="${tip}" onmousemove="voyMove(event)" onmouseleave="voyHide()"></path>${label}`;
  }).join('');
  return `
  <div class="flex flex-col items-center gap-1">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${d.year} activity breakdown">
      ${segs}
      <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" class="font-display" style="font-size:22px;font-weight:700;fill:#111827;">${d.year}</text>
    </svg>
  </div>`;
}
/* Donut segment tooltip */
function voyTipEl() {
  let t = document.getElementById('voy-tip');
  if (!t) { t = document.createElement('div'); t.id = 'voy-tip'; t.className = 'voy-tip'; document.body.appendChild(t); }
  return t;
}
function voySeg(e, label, pct, color) {
  const t = voyTipEl();
  t.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${color};margin-right:7px;vertical-align:middle;"></span><span style="vertical-align:middle;">${label} · <strong>${pct}%</strong></span>`;
  t.style.opacity = '1';
  voyMove(e);
}
function voyMove(e) { const t = voyTipEl(); t.style.left = e.clientX + 'px'; t.style.top = (e.clientY - 14) + 'px'; }
function voyHide() { const t = document.getElementById('voy-tip'); if (t) t.style.opacity = '0'; }
window.voySeg = voySeg; window.voyMove = voyMove; window.voyHide = voyHide;
function legend() {
  const item = (label, color) => `
    <div class="flex items-center gap-2">
      <span style="width:11px;height:11px;border-radius:3px;background:${color};display:inline-block;"></span>
      <span class="text-xs font-medium text-ink-700">${label}</span>
    </div>`;
  return `<div class="flex items-center justify-center gap-7 mt-4">
    ${item('Port Visit', CAT.portVisit)}${item('Loitering', CAT.loitering)}${item('Traveling', CAT.traveling)}
  </div>`;
}
/* Grouped vertical bars — one group per year, a bar per category side by side */
function bar(d) {
  const total = d.segs.reduce((s, x) => s + x.v, 0);
  const H = 180;
  const bars = d.segs.map((s) => {
    const pct = Math.round(s.v / total * 100);
    const hh = Math.max(4, s.v / total * H);
    return `
      <div class="flex flex-col items-center justify-end" style="height:${H}px;">
        <span style="font-size:10px;font-weight:700;color:#374151;margin-bottom:3px;">${pct}%</span>
        <div class="voy-seg" style="width:22px;height:${hh.toFixed(1)}px;background:${s.c};border-radius:4px 4px 0 0;"
          onmouseenter="voySeg(event,'${s.l}',${pct},'${s.c}')" onmousemove="voyMove(event)" onmouseleave="voyHide()"></div>
      </div>`;
  }).join('');
  return `
  <div class="flex flex-col items-center gap-2">
    <div class="flex items-end gap-3" style="height:${H}px;">${bars}</div>
    <span class="font-display" style="font-size:16px;font-weight:700;color:#111827;">${d.year}</span>
  </div>`;
}

/* ===================== MAP ===================== */
let map = null, tileLayer = null;
const MAP_TYPES = {
  street:    { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', sub:'abcd' },
  satellite: { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', sub:'abc' },
  light:     { url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', sub:'abcd' },
  dark:      { url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', sub:'abcd' },
};
let currentMapType = 'satellite';
function setMapType(type) {
  if (!map || !MAP_TYPES[type]) return;
  currentMapType = type;
  if (tileLayer) map.removeLayer(tileLayer);
  const t = MAP_TYPES[type];
  tileLayer = L.tileLayer(t.url, { maxZoom:19, subdomains:t.sub, attribution:'' }).addTo(map);
  document.querySelectorAll('[data-map-type]').forEach(b => {
    const chk = b.querySelector('[data-check]'); if (chk) chk.style.opacity = b.dataset.mapType === type ? '1' : '0';
  });
}
function initMap() {
  const c = document.getElementById('voyage-map');
  if (!c) return;
  if (map) {
    if (!document.body.contains(map.getContainer())) { map.remove(); map = null; }
    else { map.invalidateSize(); return; }
  }
  const current = [8.5667, 76.8833];   // current position (off SW India)
  map = L.map(c, { center: current, zoom: 4, zoomControl:true, scrollWheelZoom:true, attributionControl:false });
  setMapType('satellite');
  const singapore = [1.29, 103.85], rotterdam = [51.95, 4.14];
  // Travelled (solid) Singapore → current
  L.polyline([singapore, [6.0, 95.0], [7.0, 82.0], current], { color:'#2d7ffb', weight:3, opacity:0.9 }).addTo(map);
  // Remaining (dashed) current → Rotterdam
  L.polyline([current, [12.0, 60.0], [12.5, 43.0], [30.0, 32.5], [37.0, 11.0], rotterdam], { color:'#2d7ffb', weight:2.5, opacity:0.7, dashArray:'7 6' }).addTo(map);
  const pin = (color) => L.divIcon({ className:'', html:`<div style="width:11px;height:11px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`, iconSize:[11,11], iconAnchor:[5,5] });
  L.marker(singapore, { icon:pin('#475569') }).addTo(map).bindPopup('Singapore (departure)');
  L.marker(rotterdam, { icon:pin('#111827') }).addTo(map).bindPopup('Rotterdam (destination)');
  const vesselIcon = L.divIcon({ className:'', html:`<div style="width:15px;height:15px;background:var(--brand-600,#2d7ffb);border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(45,127,251,.6)"></div>`, iconSize:[15,15], iconAnchor:[7,7] });
  const popHtml = `
    <div class="vp">
      <div class="vp-header">
        <div class="vp-header-main">
          <div class="vp-title">${flag('es')} FRESH BREEZE</div>
          <div class="vp-subtitle">Crude Oil Tanker · En Route</div>
        </div>
      </div>
      <div class="vp-grid">
        <div class="vp-span"><div class="vp-k">Completed:</div><div class="vp-v vp-strong">2,847 nm (35%)</div></div>
        <div><div class="vp-k">Avg Speed:</div><div class="vp-v"><span class="vp-strong">14.2</span> Knots</div></div>
        <div><div class="vp-k">Current Speed:</div><div class="vp-v"><span class="vp-strong">15.1</span> Knots</div></div>
        <div><div class="vp-k">Latitude:</div><div class="vp-v vp-strong">8.5667°N</div></div>
        <div><div class="vp-k">Longitude:</div><div class="vp-v vp-strong">76.8833°E</div></div>
      </div>
    </div>`;
  const vesselMarker = L.marker(current, { icon:vesselIcon })
    .addTo(map)
    .bindPopup(popHtml, { autoClose:false, closeOnClick:false, offset:[0,-4], className:'vessel-popup', maxWidth:320, minWidth:290 });
  map.fitBounds([singapore, rotterdam], { paddingTopLeft:[60,70], paddingBottomRight:[60,150] });
  // Open the vessel popup by default once the map has settled
  setTimeout(() => { if (map && document.body.contains(map.getContainer())) vesselMarker.openPopup(); }, 250);
  // Layers menu
  const lb = document.getElementById('map-layers-btn'), lm = document.getElementById('map-layers-menu');
  if (lb && lm) {
    lb.onclick = (e) => { e.stopPropagation(); lm.classList.toggle('hidden'); };
    lm.querySelectorAll('[data-map-type]').forEach(b => b.onclick = (e) => { e.stopPropagation(); setMapType(b.dataset.mapType); lm.classList.add('hidden'); });
    document.addEventListener('click', () => lm.classList.add('hidden'));
  }

  // Fullscreen toggle — expand the map column to fill the viewport
  const fsBtn = document.getElementById('map-fullscreen');
  const mapCol = c.closest('.vh-map-col');
  if (fsBtn && mapCol) {
    fsBtn.onclick = (e) => {
      e.stopPropagation();
      const isFs = mapCol.classList.toggle('is-fullscreen');
      fsBtn.innerHTML = isFs ? svg(IC.minimize,17) : svg(IC.maximize,17);
      fsBtn.title = isFs ? 'Exit fullscreen' : 'Toggle fullscreen';
      document.body.style.overflow = isFs ? 'hidden' : '';
      setTimeout(() => map && map.invalidateSize(), 260);
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mapCol.classList.contains('is-fullscreen')) fsBtn.onclick(e);
    });
  }
}

const HIST_PER = 3;

function histVisible() {
  const on = window.__vesselEventFilter;
  return EVENTS.map((e, i) => ({ e, i })).filter(x => !on || on.includes(x.e.type));

function HistListHtml() {
  const vis = histVisible(), total = vis.length;
  const pages = Math.max(1, Math.ceil(total / HIST_PER));
  const pg = state.histPage = Math.min(Math.max(1, state.histPage || 1), pages);
  const from = (pg - 1) * HIST_PER, slice = vis.slice(from, from + HIST_PER);
  if (!total) return `<div class="flex-1 min-h-0 flex flex-col items-center justify-center text-center px-6 py-10" id="hist-list"><div class="text-sm font-semibold text-ink-900 mb-1">No events to show</div><div class="text-xs text-ink-500">All event types are filtered out. Choose at least one type with the filter button.</div></div>`;
  return `<div class="flex-1 min-h-0 overflow-y-auto scroll-thin" id="hist-list">
      ${slice.map(({ e, i }) => { return `
        <div class="hist-ev p-3 border-b border-ink-100 ${state.histSel === i ? 'is-sel' : ''}" data-hist-idx="${i}" role="button" tabindex="0" aria-pressed="${state.histSel === i}" aria-label="Show ${e.title} on map, ${e.ts}">
          <div class="flex items-start gap-2 mb-1">
            ${(() => { const t = MAP_EVENT_TYPES.find(x => x.id === e.type) || MAP_EVENT_TYPES.find(x => x.id === 'ais'); return `<span class="ev-ic" style="background:${t.bg};color:${t.fg};" title="${t.label}" aria-label="${t.label}" role="img">${t.icon}</span>`; })()}
            <div class="flex-1 min-w-0">
              <div class="text-xs text-ink-500 mb-1">${e.ts}</div>
              <div class="text-xs font-semibold text-ink-900 mb-1">${e.title}</div>
              <div class="text-xs text-ink-700 leading-relaxed"><span class="font-semibold">Details:</span> ${e.detail}</div>
            </div>
          </div>
        </div>
      `; }).join('')}
    </div>
    <div class="hist-pager" id="hist-pager">
      <span class="hist-pager-sum">${from + 1}–${from + slice.length} of ${total} events</span>
      ${window.dsPagination ? window.dsPagination({ page: pg, totalPages: pages, compact: true, inWrap: false }) : ''}
    </div>`;
}

function wireHistList() {
  document.querySelectorAll('.hist-ev').forEach(el => {
    const go = () => selectHistEvent(+el.dataset.histIdx, 'list');
    el.onclick = go;
    el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } };
  });
  const pg = document.getElementById('hist-pager');
  if (pg && window.dsWirePagination) dsWirePagination(pg, { onPage: p => { state.histPage = p; drawHistList(); document.querySelector('#hist-pager .ds-page-btn:not([disabled])')?.focus(); } });
}

function drawHistList() {
  const w = document.getElementById('hist-list-wrap'); if (!w) return;
  w.innerHTML = HistListHtml(); wireHistList();
  if (state.histSel != null) markHistSel(state.histSel);
}

function histFmt(isoStr) { return new Date(isoStr + 'T00:00:00Z').toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', timeZone:'UTC' }); }

function histRangeLabel() { const p = (typeof TR_PRESETS !== 'undefined') && TR_PRESETS.find(x => x[0] === state.trackRange.preset); return p ? p[1] : 'Custom Range'; }

function histRangeDays() { const n = Math.round((new Date(state.trackRange.end) - new Date(state.trackRange.start)) / 864e5) + 1; return n + (n === 1 ? ' day' : ' days') + (state.trackRange.detailed ? ' · Detailed track' : ''); }

function closeMapMenus(except) {
  MAP_MENUS.forEach(k => { if (k === except) return; document.getElementById('map-' + k + '-menu')?.classList.add('hidden'); const b = document.getElementById('map-' + k + '-btn'); if (b) { b.classList.remove('is-on'); b.setAttribute('aria-expanded', 'false'); } });
}

function updateMapReset() {
  const b = document.getElementById('map-reset-btn'); if (!b) return;
  const off = [...document.querySelectorAll('#map-regions-menu [data-rg-child]')].some(c => c.checked);
  const wx = [...document.querySelectorAll('#map-weather-menu [data-wx]')].some(c => c.checked);
  b.disabled = !(off || wx);
}

function resetMapFilters() {
  const rg = document.querySelector('#map-regions-menu [data-rg-all]');
  if (rg) { rg.checked = false; rg.dispatchEvent(new Event('change')); }
  const wx = [...document.querySelectorAll('#map-weather-menu [data-wx]')];
  wx.forEach(c => c.checked = false); wx[0]?.dispatchEvent(new Event('change'));
  closeMapMenus();
  updateMapReset();
}

function initMapWeather() {
  const btn = document.getElementById('map-weather-btn'), menu = document.getElementById('map-weather-menu');
  if (!btn || !menu) return;
  const cbs = [...menu.querySelectorAll('[data-wx]')];
  const sync = () => {
    const on = cbs.filter(c => c.checked);
    document.getElementById('map-weather-count').textContent = on.length ? on.length + ' on' : '';
    btn.classList.toggle('has-active', on.length > 0);
    window.__vesselWeatherLayers = on.map(c => c.dataset.wx);

function buildRegionLayers() {
  if (!map) return;
  window._regionLayers = Object.entries(REGION_SHAPES).map(([key, s]) => {
    const [grp, item] = key.split('|'), c = REGION_COLORS[grp] || '#64748b';
    const st = { color:c, weight:1.5, opacity:0.9, fillColor:c, fillOpacity:0.14, dashArray:s.dash || null };
    const layer = s.circle ? L.circle(s.circle, { ...st, radius:s.r }) : L.polygon(s.poly, st);
    layer.bindTooltip(`<b>${item}</b><br><span style="color:#6b7280">${grp}</span>`, { sticky:true, direction:'top' });
    layer.on('mouseover', () => layer.setStyle({ fillOpacity:0.28, weight:2 }));
    layer.on('mouseout',  () => layer.setStyle({ fillOpacity:0.14, weight:1.5 }));
    layer._rgKey = key;
    return layer;
  });
  applyRegionFilter();
}

function applyRegionFilter() {
  if (!map || !window._regionLayers) return;
  const on = new Set();
  document.querySelectorAll('#map-regions-menu [data-rg-child]').forEach(c => {
    if (!c.checked) return;
    const g = MAP_REGION_GROUPS[+c.dataset.rgChild]; if (g) on.add(g.label + '|' + c.parentElement.textContent.trim());
  });
  const menuReady = !!document.querySelector('#map-regions-menu [data-rg-child]');
  window._regionLayers.forEach(l => { const show = !menuReady || on.has(l._rgKey); if (show && !map.hasLayer(l)) l.addTo(map); if (!show && map.hasLayer(l)) map.removeLayer(l); });
}

function initMapRegions() {
  const btn = document.getElementById('map-regions-btn'), menu = document.getElementById('map-regions-menu');

  const kids = gi => [...menu.querySelectorAll(`[data-rg-child="${gi}"]`)];
  const allKids = [...menu.querySelectorAll('[data-rg-child]')];
  const sync = () => {
    parents.forEach(p => { const k = kids(p.dataset.rgParent), n = k.filter(c => c.checked).length; p.checked = n === k.length; p.indeterminate = n > 0 && n < k.length; });
    const n = allKids.filter(c => c.checked).length;
    all.checked = n === allKids.length; all.indeterminate = n > 0 && n < allKids.length;
    const groupsOn = parents.filter(p => p.checked || p.indeterminate).length;

  };
  all.onchange = () => { allKids.forEach(c => c.checked = all.checked); sync(); };
  parents.forEach(p => p.onchange = () => { kids(p.dataset.rgParent).forEach(c => c.checked = p.checked); sync(); });
  allKids.forEach(c => c.onchange = sync);

function buildTrackPoints(route) {
  if (!map) return;
  (window._trackPts || []).forEach(m => map.removeLayer(m));
  if (!map.getPane('trackPts')) { const p = map.createPane('trackPts'); p.style.zIndex = 650; }
  const N = 18, t0 = new Date(state.trackRange.start + 'T00:00:00Z').getTime(), t1 = new Date(state.trackRange.end + 'T23:59:59Z').getTime();
  const at = t => { const p = t * (route.length - 1), i = Math.min(Math.floor(p), route.length - 2), f = p - i, a = route[i], b = route[i + 1]; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])]; };
  const dests = ['EG, Port Said', 'GR, Piraeus', 'DE, Hamburg'];
  const statuses = ['Under way using engine', 'Under way using engine', 'Under way using engine', 'Restricted manoeuvrability'];
  const fmt = (v, pos, neg) => Math.abs(v).toFixed(2) + (v >= 0 ? pos : neg);
  const pinSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>';
  const xSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  window._trackPts = Array.from({ length: N }, (_, k) => {
    const t = k / (N - 1), [lat, lng, ang] = at(t);
    const cog = Math.round(((90 - ang * 180 / Math.PI) + 360) % 360);
    const d = { lat, lng, dest: dests[Math.min(2, Math.floor(t * 3))], status: statuses[k % 4], cog, hdg: (cog + 4 + (k % 3) * 2) % 360,
      draught: (10.1 - (k % 4) * 0.05).toFixed(2), speed: (9.2 + ((k * 37) % 17) / 10).toFixed(2), freeboard: (3.5 + (k % 3) * 0.05).toFixed(2),
      ts: new Date(t0 + t * (t1 - t0)).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' };
    const m = L.circleMarker([lat, lng], { radius:4, color:'#fff', weight:1.5, fillColor:'#2d7ffb', fillOpacity:1, bubblingMouseEvents:false, pane:'trackPts' }).addTo(map);
    m.on('mouseover', () => m.setStyle({ radius:6 })); m.on('mouseout', () => m.setStyle({ radius:4 }));
    const row = (k2, v) => `<div class="trk-r"><span>${k2}</span><span>${v}</span></div>`;
    const html = `<div class="trk-pop" role="dialog" aria-label="${VESSEL.name} track point">
      <div class="trk-h">
        <div class="trk-ht"><div class="trk-n">${flag(VESSEL.flag.cc)} ${VESSEL.name}</div><div class="trk-t">${VESSEL.type} · ${d.ts}</div></div>
        <div class="trk-acts"><button type="button" class="trk-ib" data-trk-pin aria-pressed="false" title="Pin popup" aria-label="Pin popup">${pinSvg}</button><button type="button" class="trk-ib" data-trk-close title="Close" aria-label="Close">${xSvg}</button></div>
      </div>
      <div class="trk-b">
        ${row('Lat/Lng', fmt(d.lat,'N','S') + '/' + fmt(d.lng,'E','W'))}
        ${row('Destination', d.dest)}
        ${row('Navigation status', d.status)}
        ${row('Course over ground', d.cog + '°')}
        ${row('Heading', d.hdg + '°')}
        ${row('Draught (m)', d.draught)}
        ${row('Speed (knots)', d.speed)}
        ${row('Freeboard (m)', d.freeboard)}
      </div>
      <div class="trk-f"><button type="button" class="trk-cta">Create Analysis<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
    </div>`;
    m.bindPopup(html, { className:'trk-leaflet', closeButton:false, minWidth:280, maxWidth:280, autoPan:true, autoPanPaddingTopLeft:[20,20], autoPanPaddingBottomRight:[60,24] });
    m.on('popupopen', ev => {

      el.querySelector('[data-trk-close]').onclick = () => { pop.options.autoClose = true; pop.options.closeOnClick = true; map.closePopup(pop); m.closePopup(); };
      const pin = el.querySelector('[data-trk-pin]');
      const pinned = pop.options.autoClose === false;
      pin.setAttribute('aria-pressed', pinned); pin.title = pinned ? 'Unpin popup' : 'Pin popup';
      pin.onclick = () => {
        const on = pin.getAttribute('aria-pressed') !== 'true';
        pin.setAttribute('aria-pressed', on); pin.title = on ? 'Unpin popup' : 'Pin popup'; pin.setAttribute('aria-label', pin.title);
        pop.options.autoClose = !on; pop.options.closeOnClick = !on;
        // Leaflet registers the map 'preclick' close handler when the popup opens; toggle it directly
        const fn = pop.close || pop._close;
        map.off('preclick', fn, pop);
        if (!on) map.on('preclick', fn, pop);
        if (on && map._popup === pop) map._popup = null; // so the next popup doesn't replace this one
      };
      L.DomEvent.disableClickPropagation(el);
      document.querySelector('.timeline-overlay')?.classList.add('is-dimmed');

    m.on('popupclose', () => { if (!(window._trackPts || []).some(p => p !== m && p.isPopupOpen())) document.querySelector('.timeline-overlay')?.classList.remove('is-dimmed'); });
    return m;
  });
}

function markHistSel(i) {
  state.histSel = i;
  document.querySelectorAll('.hist-ev').forEach(el => { const on = +el.dataset.histIdx === i; el.classList.toggle('is-sel', on); el.setAttribute('aria-pressed', on); });
  document.querySelectorAll('.ev-marker').forEach(el => el.classList.toggle('is-sel', +el.dataset.evMk === i));
}

const EV_ZOOM = 6;

function zoomToEvent(ll, after) {
  if (!map) return;
  const z = Math.max(map.getZoom(), EV_ZOOM);
  const pt = map.project(ll, z).subtract([0, 110]);
  const target = map.unproject(pt, z);
  if (after) map.once('moveend', after);
  map.flyTo(target, z, { duration:0.8 });
}

function selectHistEvent(i, from) {
  markHistSel(i);
  if (from === 'map') {
    const mk = window._eventMarkers && window._eventMarkers[i];
    if (mk) zoomToEvent(mk.getLatLng(), () => { if (state.histSel === i && !mk.isPopupOpen()) mk.openPopup(); });
    const pos = histVisible().findIndex(x => x.i === i), want = Math.floor(Math.max(0, pos) / HIST_PER) + 1;
    if (want !== state.histPage) { state.histPage = want; drawHistList(); }
    const el = document.querySelector(`.hist-ev[data-hist-idx="${i}"]`), list = el && el.parentElement;
    if (el && list) {
      const top = el.offsetTop - list.offsetTop, bottom = top + el.offsetHeight;
      if (top < list.scrollTop || bottom > list.scrollTop + list.clientHeight) list.scrollTo({ top: Math.max(0, top - 8), behavior:'smooth' });
    }
    return;
  }
  if (!map || !window._eventMarkers) return;
  const m = window._eventMarkers[i], p = EVENTS[i], t = MAP_EVENT_TYPES.find(x => x.id === p.type);
  if (map.hasLayer(m)) {
    map.closePopup();
    zoomToEvent(m.getLatLng(), () => { m.openPopup(); markHistSel(i); });
    markHistSel(i);
  } else {
    map.closePopup();
    zoomToEvent(p.ll, () => {
      L.popup(EV_POPUP_OPTS).setLatLng(p.ll).setContent(eventPopupHtml(p, t, 'This event type is hidden by the Events filter.')).openOn(map)
        .on('remove', () => { if (state.histSel === i) markHistSel(null); });
      markHistSel(i);
    });
  }
}

const NC_WIND = (() => { const out = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) out.push([50.655 + r * 0.022 - c * 0.004, -0.36 + c * 0.04 + r * 0.01]); return out; })();

function makeSeamarkLayer() {

  const icon = (k, s = 22) => L.divIcon({ className:'nc-mk', html:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${NC_SVG[k]}</svg>`, iconSize:[s, s], iconAnchor:[s / 2, k === 'light' || k === 'anch' ? s / 2 : s - 2] });
  const tip = (k, n) => `<b>${NC_NAME[k]}</b>${n ? '<br><span style="color:#64748b">' + n + '</span>' : ''}`;
  NC_CABLES.forEach(line => L.polyline(line, { color:'#c084fc', weight:4, opacity:.9, dashArray:'2 4', lineCap:'round', interactive:true }).bindTooltip('<b>Submarine cable</b><br><span style="color:#64748b">No anchoring or trawling</span>', { sticky:true }).addTo(g));
  L.polygon(NC_RESTRICT, { color:'#111827', weight:1.4, dashArray:'6 4', fill:true, fillOpacity:0, interactive:true }).bindTooltip('<b>Restricted area</b><br><span style="color:#64748b">Military practice area — no entry when active</span>', { sticky:true }).addTo(g);

function setMapOverlay(kind, on) {

function initMap() {
  const c = document.getElementById('vessel-map');

  if (map) {
    if (!document.body.contains(map.getContainer())) {

      map = null;
    } else {
      map.invalidateSize();
      wireMapControls();
      return;
    }
  }

  map = L.map(c, {
    center: [35, 25],
    zoom: 5,
    zoomControl: true,

  setMapType(currentMapType);
  (function initNauticalBadge() {
    const NC_MIN_ZOOM = 8, badge = document.getElementById('nc-badge'), cb = document.getElementById('nc-cb'), hint = document.getElementById('nc-hint');

  new Coords().addTo(map);

  // Route polyline: Red Sea → Suez → Mediterranean → Gibraltar → around Iberia → English Channel → UK
  const route = [
    [21.40, 38.90], // Jeddah approaches (Red Sea)
    [24.50, 36.60],
    [27.30, 34.00],
    [28.60, 33.10], // Gulf of Suez
    [29.90, 32.55], // Suez
    [31.30, 32.35], // Port Said
    [31.90, 29.80],
    [32.60, 28.60],
    [34.00, 26.30], // south of Crete
    [34.60, 25.00],
    [35.40, 23.20],
    [36.20, 21.40], // off the Peloponnese
    [36.50, 18.00],
    [36.20, 13.60], // between Sicily and Malta
    [37.40, 11.60], // Strait of Sicily
    [37.70,  8.00], // south of Sardinia
    [37.20,  3.00],
    [36.30, -1.50],
    [35.95, -5.40], // Strait of Gibraltar
    [36.40, -8.00],
    [36.90, -9.60], // Cape St Vincent
    [38.70, -9.90], // off Lisbon
    [41.50, -9.40],
    [43.40, -9.70], // Cape Finisterre
    [45.50, -7.00], // Bay of Biscay
    [48.30, -5.80], // off Ushant
    [49.70, -3.00], // English Channel — current position
    [50.55, -1.20],
    [50.88, -1.40], // Southampton
  ];
  // Speed-coloured track: green = normal/optimal, red = low speed (straits, port approaches)
  const TRACK_GREEN = '#16a34a', TRACK_RED = '#dc2626';
  const near = (p, lat, lng) => Math.abs(p[0] - lat) < 0.01 && Math.abs(p[1] - lng) < 0.01;
  const idx = (lat, lng) => route.findIndex(p => near(p, lat, lng));
  const lowRanges = [[idx(36.50, 18.00), idx(37.40, 11.60)], [idx(36.30, -1.50), idx(36.40, -8.00)], [idx(49.70, -3.00), route.length - 1]].filter(([a, b]) => a > -1 && b > a);
  const isLow = i => lowRanges.some(([a, b]) => i >= a && i < b);
  // Gradient between speeds: each leg (route[i] -> route[i+1]) is 1 when low speed, 0 otherwise.
  // Each point takes the average of the legs it joins, so the colour ramps across the legs either
  // side of a change (long low-speed runs stay solid red). Legs are drawn as short pieces coloured
  // along green -> amber -> red, which reads as one continuous gradient.
  const TRACK_AMBER = '#d97706';
  const legLow = route.slice(0, -1).map((_, i) => isLow(i) ? 1 : 0);
  const ptLow = route.map((_, i) => i === 0 ? legLow[0] : i === route.length - 1 ? legLow[legLow.length - 1] : (legLow[i - 1] + legLow[i]) / 2);
  const hex = c => [1, 3, 5].map(k => parseInt(c.slice(k, k + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return '#' + A.map((v, k) => Math.round(v + (B[k] - v) * t).toString(16).padStart(2, '0')).join(''); };
  const trackColour = t => t <= 0.5 ? mix(TRACK_GREEN, TRACK_AMBER, t * 2) : mix(TRACK_AMBER, TRACK_RED, (t - 0.5) * 2);
  const PIECES = 14;
  // AIS gap: no position reports between these points, drawn as a dashed neutral line (no speed data).
  const TRACK_NOAIS = '#64748b';
  const noAisRanges = [[idx(37.70, 8.00), idx(37.20, 3.00)]].filter(([a, b]) => a > -1 && b > a);
  const isNoAis = i => noAisRanges.some(([a, b]) => i >= a && i < b);
  window._trackSegments = [];
  for (let i = 0; i < route.length - 1; i++) {
    if (isNoAis(i)) {
      window._trackSegments.push(L.polyline([route[i], route[i + 1]], { color: TRACK_NOAIS, weight:3, opacity:1, dashArray:'2 9', lineCap:'round', interactive:false }).addTo(map));
      continue;
    }
    const [a, b] = [route[i], route[i + 1]], [ta, tb] = [ptLow[i], ptLow[i + 1]];
    const n = ta === tb ? 1 : PIECES;                       // solid legs stay one line
    for (let k = 0; k < n; k++) {
      const f0 = k / n, f1 = (k + 1) / n;
      const p0 = [a[0] + (b[0] - a[0]) * f0, a[1] + (b[1] - a[1]) * f0];
      const p1 = [a[0] + (b[0] - a[0]) * f1, a[1] + (b[1] - a[1]) * f1];
      const t = ta + (tb - ta) * ((f0 + f1) / 2);
      window._trackSegments.push(L.polyline([p0, p1], { color: trackColour(t), weight:3, opacity:1, lineJoin:'round', lineCap:'round', interactive:false }).addTo(map));
    }
  }
  const TrackLegend = L.Control.extend({ options:{ position:'bottomleft' }, onAdd() {
    const el = L.DomUtil.create('div', 'track-legend');
    el.setAttribute('role', 'group'); el.setAttribute('aria-label', 'Track legend');
    el.innerHTML = `<span class="track-legend-i"><span class="track-legend-sw" style="background:${TRACK_GREEN}"></span>Normal/Optimal Speed</span><span class="track-legend-i"><span class="track-legend-sw" style="width:28px;background:linear-gradient(90deg,${TRACK_GREEN},${TRACK_AMBER},${TRACK_RED})"></span>Slowing</span><span class="track-legend-i"><span class="track-legend-sw" style="background:${TRACK_RED}"></span>Low Speed</span><span class="track-legend-i"><span class="track-legend-sw" style="background:repeating-linear-gradient(90deg,${TRACK_NOAIS} 0 4px,transparent 4px 8px)"></span>No AIS</span>`;
    L.DomEvent.disableClickPropagation(el);
    return el;
  } });
  new TrackLegend().addTo(map);

  // Vessel marker — stored globally so wireTimeline can move it
  const vesselIcon = L.divIcon({
    className: '',
    html: `<div class="vd-vessel" style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));transform-origin:center;"><svg viewBox="0 0 24 24" width="20" height="20" style="color:#dc2626;" fill="currentColor" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2 L19 20 L12 16 L5 20 Z"/></svg></div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10],
  });
  window._vesselMarker = L.marker([50.55, -1.2], { icon: vesselIcon, zIndexOffset:1000 })
    .addTo(map)
    .bindPopup('<b>FRESH BREEZE</b><br>Lat 50.6° N &nbsp;Lon 1.2° W<br>Speed: 8.2 kts');
  window._vesselRoute = route;
  buildTrackPoints(route);
  // Fit the whole route (no animation, so the zoom below isn't overwritten when an animation lands),
  // then open two levels closer.
  map.fitBounds(L.latLngBounds(route), { paddingTopLeft:[48,48], paddingBottomRight:[64,160], maxZoom:6, animate:false });
  map.setView(L.latLngBounds(route).getCenter(), map.getZoom() + 2, { animate:false });   // centred on the route
  map.panBy([0, 60], { animate:false });   // lift it clear of the timeline and legend along the bottom

  // Origin / destination pins
  const pinIcon = (color) => L.divIcon({
    className: '',
    html: `<div style="width:10px;height:10px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
    iconSize: [10, 10], iconAnchor: [5, 5],
  });
  L.marker([21.40, 38.90], { icon: pinIcon('#9ca3af') }).addTo(map).bindPopup('Jeddah (Red Sea)');
  L.marker([50.88, -1.40], { icon: pinIcon('#2e7d4f') }).addTo(map).bindPopup('Southampton, UK');

  buildRegionLayers();

  // Event markers
  map.on('popupopen', ev => {
    const el = ev.popup.getElement(), x = el && el.querySelector('[data-ev-close]');
    if (!x) return;
    const pop = ev.popup, pin = el.querySelector('[data-ev-pin]');
    x.onclick = () => { pop.options.autoClose = true; pop.options.closeOnClick = true; map.closePopup(pop); };
    if (pin) {
      const pinned = pop.options.autoClose === false;
      pin.setAttribute('aria-pressed', pinned); pin.title = pinned ? 'Unpin popup' : 'Pin popup'; pin.setAttribute('aria-label', pin.title);
      pin.onclick = () => {
        const on = pin.getAttribute('aria-pressed') !== 'true';
        pin.setAttribute('aria-pressed', on); pin.title = on ? 'Unpin popup' : 'Pin popup'; pin.setAttribute('aria-label', pin.title);
        pop.options.autoClose = !on; pop.options.closeOnClick = !on;

    L.DomEvent.disableClickPropagation(el);
  });
  window._eventMarkers = EVENTS.map((p, i) => {
    const t = MAP_EVENT_TYPES.find(x => x.id === p.type);
    const icon = L.divIcon({ className:'', iconSize:[26,26], iconAnchor:[13,13],
      html:`<div class="ev-marker" data-ev-mk="${i}" style="background:${t.bg};color:${t.fg};">${t.icon}</div>` });
    const m = L.marker(p.ll, { icon, zIndexOffset:500, keyboard:true, alt:t.label }).bindPopup(eventPopupHtml(p, t), EV_POPUP_OPTS)
      .bindTooltip(`<b>${t.label}</b>`, { direction:'top', offset:[0,-15], className:'ev-tip' });
    m.on('popupopen', () => { m.closeTooltip(); m.getTooltip().options.opacity = 0; });
    m.on('popupclose', () => { m.getTooltip().options.opacity = 0.9; });
    m._evType = p.type; m._evIdx = i;
    m.on('click', () => selectHistEvent(i, 'map'));

    return m;
  });
  applyEventFilter();

  // Force a size recalculation once layout is stable
  setTimeout(() => map && map.invalidateSize(), 200);

  wireMapControls();
}

function wireMapControls() {
  const fsBtnEl = document.getElementById('vt-map-fullscreen');
  const cardEl  = document.getElementById('vessel-tracking-card');
  const expandIcon   = document.getElementById('fs-expand-icon');
  const collapseIcon = document.getElementById('fs-collapse-icon');

  const layersMenu = document.getElementById('vt-map-layers-menu');

  if (fsBtnEl && cardEl) {
    fsBtnEl.onclick = () => {
      const isFs = cardEl.classList.toggle('is-fullscreen');
      if (expandIcon)   expandIcon.style.display   = isFs ? 'none' : '';
      if (collapseIcon) collapseIcon.style.display = isFs ? ''     : 'none';
      setTimeout(() => map && map.invalidateSize(), 80);
    };
  }

  if (layersBtn && layersMenu) {
    layersBtn.onclick = (e) => { e.stopPropagation(); closeMapMenus('layers'); const v = layersMenu.classList.toggle('hidden') === false; layersBtn.classList.toggle('is-on', v); layersBtn.setAttribute('aria-expanded', v); };
    layersMenu.onclick = e => e.stopPropagation();
    layersMenu.querySelectorAll('[data-vessel-map-type]').forEach(r => { r.onchange = () => setMapType(r.dataset.vesselMapType); });
    layersMenu.querySelectorAll('[data-map-overlay]').forEach(c => { c.checked = !!_mapOverlays[c.dataset.mapOverlay]; c.onchange = () => setMapOverlay(c.dataset.mapOverlay, c.checked); });
    document.addEventListener('click', () => { layersMenu.classList.add('hidden'); layersBtn.classList.remove('is-on'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { layersMenu.classList.add('hidden'); layersBtn.classList.remove('is-on'); } });
  }

  // Sync check marks
  setMapType(currentMapType);
  initMapEvents();
  initMapRegions();
  initMapWeather();
  const rb = document.getElementById('map-reset-btn');
  if (rb) { rb.onclick = e => { e.stopPropagation(); resetMapFilters(); }; document.querySelectorAll('#map-regions-menu input, #map-weather-menu input').forEach(i => i.addEventListener('change', updateMapReset)); updateMapReset(); }
}

const TODAY_ISO = '2026-09-29';

const iso = d => d.toISOString().slice(0, 10);

const fromIso = s => new Date(s + 'T00:00:00Z');

const addDays = (s, n) => { const d = fromIso(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };

const addMonths = (s, n) => { const d = fromIso(s); d.setUTCMonth(d.getUTCMonth() + n); return iso(d); };

const TR_PRESETS = [
  ['today', 'Today', () => [TODAY_ISO, TODAY_ISO]],
  ['7d', 'Last 7 Days', () => [addDays(TODAY_ISO, -6), TODAY_ISO]],
  ['14d', 'Last 14 Days', () => [addDays(TODAY_ISO, -13), TODAY_ISO]],
  ['30d', 'Last 30 Days', () => [addDays(TODAY_ISO, -29), TODAY_ISO]],
  ['custom', 'Custom Range', null],
];

const TR_MIN_ISO = addDays(TODAY_ISO, -29);

let _trp = null;

function openTrackCalendar(anchor) {
  closeTrackCalendar();
  const r = state.trackRange;
  const s = fromIso(r.start);
  _trp = { start:r.start, end:r.end, preset:r.preset || '7d', detailed:!!r.detailed, pending:false, hover:null,
           view: iso(new Date(Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), 1))), anchor };
  const el = document.createElement('div');
  el.id = 'trp'; el.className = 'trp'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Track date range');
  document.body.appendChild(el);
  el.addEventListener('click', e => e.stopPropagation());
  el.addEventListener('mouseover', e => { const c = e.target.closest('[data-day]'); if (_trp.pending && c && c.dataset.day !== _trp.hover) { _trp.hover = c.dataset.day; drawTrackCalendar(); } });
  setTimeout(() => document.addEventListener('click', closeTrackCalendar, { once:true }), 0);
  document.addEventListener('keydown', _trpKey);
  window.addEventListener('resize', placeTrackCalendar);
  drawTrackCalendar();
  anchor.setAttribute('aria-expanded', 'true');
  el.querySelector('.trp-preset.is-active, .trp-preset')?.focus();
}

function _trpKey(e) { if (e.key === 'Escape') { closeTrackCalendar(); document.getElementById('hist-cal-btn')?.focus(); } }

function closeTrackCalendar() {
  document.getElementById('trp')?.remove();
  document.getElementById('hist-cal-btn')?.setAttribute('aria-expanded', 'false');
  document.removeEventListener('keydown', _trpKey);
  window.removeEventListener('resize', placeTrackCalendar);
  _trp = null;
}

function placeTrackCalendar() {
  const el = document.getElementById('trp'); if (!el || !_trp) return;
  const b = _trp.anchor.getBoundingClientRect(), w = el.offsetWidth, hgt = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  let left, top;
  if (_trp.anchor.id === 'hist-cal-btn') {
    left = Math.min(Math.max(8, b.left), vw - w - 8); top = b.bottom + 6;
    if (top + hgt > vh - 8) top = Math.max(8, b.top - hgt - 6);
  } else {
    left = Math.min(Math.max(8, b.right - w), vw - w - 8); top = b.top - hgt - 8;
    if (top < 8) top = Math.min(b.bottom + 8, vh - hgt - 8);
  }
  el.style.left = Math.max(8, left) + 'px'; el.style.top = Math.max(8, top) + 'px';
}

function trpMonth(firstIso, showPrev, showNext) {
  const f = fromIso(firstIso), y = f.getUTCFullYear(), m = f.getUTCMonth();
  const title = f.toLocaleString('en-GB', { month:'long', year:'numeric', timeZone:'UTC' });
  const lead = f.getUTCDay(), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const t = _trp, lo = t.pending ? [t.start, t.hover || t.start].sort()[0] : t.start, hi = t.pending ? [t.start, t.hover || t.start].sort()[1] : t.end;
  const nav = (dir, show) => show ? `<button type="button" class="trp-nav" data-trp-nav="${dir}" aria-label="${dir < 0 ? 'Previous' : 'Next'} month"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${dir < 0 ? 'm15 18-6-6 6-6' : 'm9 18 6-6-6-6'}"/></svg></button>` : '<span class="trp-nav-sp"></span>';
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const ds = iso(new Date(Date.UTC(y, m, d))), future = ds > TODAY_ISO || ds < TR_MIN_ISO;
    const cls = [ds === lo && 'is-start', ds === hi && 'is-end', ds > lo && ds < hi && 'is-in', ds === TODAY_ISO && 'is-today', lo === hi && ds === lo && 'is-single'].filter(Boolean).join(' ');
    cells += `<button type="button" class="trp-day ${cls}" data-day="${ds}" ${future ? 'disabled' : ''} aria-pressed="${ds === lo || ds === hi}" aria-label="${ds}">${d}</button>`;
  }
  return `<div class="trp-month">
    <div class="trp-mhead">${nav(-1, showPrev)}<span class="trp-mtitle">${title}</span>${nav(1, showNext)}</div>
    <div class="trp-grid">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => `<span class="trp-dow">${d}</span>`).join('')}${cells}</div>
  </div>`;
}

function drawTrackCalendar() {
  const el = document.getElementById('trp'); if (!el || !_trp) return;
  const t = _trp, second = addMonths(t.view, 1);
  el.innerHTML = `
    <div class="trp-body">
      <div class="trp-presets" role="listbox" aria-label="Quick ranges">${TR_PRESETS.map(([k, l]) => `<button type="button" class="trp-preset ${t.preset === k ? 'is-active' : ''}" data-preset="${k}" role="option" aria-selected="${t.preset === k}">${l}</button>`).join('')}</div>
      <div class="trp-months">${trpMonth(TR_MIN_ISO.slice(0, 8) + '01', false, false)}${TR_MIN_ISO.slice(0, 7) !== TODAY_ISO.slice(0, 7) ? trpMonth(TODAY_ISO.slice(0, 8) + '01', false, false) : ''}</div>
    </div>
    <div class="trp-foot">
      <label class="trp-switch-l"><span>Show detailed track</span><button type="button" class="trp-switch" role="switch" aria-checked="${t.detailed}" data-trp-detailed></button><span class="trp-switch-v">${t.detailed ? 'On' : 'Off'}</span></label>
      <div class="trp-range" aria-live="polite">${t.pending ? 'Select an end date' : `${histFmt(t.start)} – ${histFmt(t.end)}`}<span class="trp-limit">Limited to the last 30 days</span></div>
      <div class="trp-acts"><button type="button" class="trp-btn trp-btn--sec" data-trp-cancel>Cancel</button><button type="button" class="trp-btn trp-btn--pri" data-trp-apply ${t.pending ? 'disabled' : ''}>Apply</button></div>
    </div>`;
  el.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
    const p = TR_PRESETS.find(x => x[0] === b.dataset.preset); t.preset = p[0]; t.pending = false;
    if (p[2]) { const [a, z] = p[2](); t.start = a; t.end = z; const ze = fromIso(z); t.view = iso(new Date(Date.UTC(ze.getUTCFullYear(), ze.getUTCMonth() - 1, 1))); }
    drawTrackCalendar();
  });
  el.querySelectorAll('[data-trp-nav]').forEach(b => b.onclick = () => { t.view = addMonths(t.view, +b.dataset.trpNav); drawTrackCalendar(); });
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const d = b.dataset.day; t.preset = 'custom';
    if (!t.pending) { t.start = d; t.end = d; t.pending = true; t.hover = d; }
    else { [t.start, t.end] = [t.start, d].sort(); t.pending = false; t.hover = null; }
    drawTrackCalendar();
    el.querySelector(`[data-day="${d}"]`)?.focus();
  });
  el.querySelector('[data-trp-detailed]').onclick = () => { t.detailed = !t.detailed; drawTrackCalendar(); };
  el.querySelector('[data-trp-cancel]').onclick = () => closeTrackCalendar();
  el.querySelector('[data-trp-apply]').onclick = () => {
    state.trackRange = { start:t.start, end:t.end, preset:t.preset === 'custom' ? null : t.preset, detailed:t.detailed };
    state.timelinePos = 1;
    closeTrackCalendar();
    render();
  };
  placeTrackCalendar();
}

function wireTimeline() {
  const slider = document.getElementById('timeline-slider');
  const fill   = document.getElementById('timeline-fill');
  const thumb  = document.getElementById('timeline-thumb');
  const tsEl   = document.getElementById('timeline-timestamp');
  if (!slider || !fill || !thumb) return;

  const startMs = new Date(state.trackRange.start + 'T00:00:00Z').getTime();
  const endMs   = new Date(state.trackRange.end + 'T23:59:59Z').getTime();
  const histCal = document.getElementById('hist-cal-btn');
  if (histCal) histCal.onclick = e => { e.stopPropagation(); if (document.getElementById('trp')) { closeTrackCalendar(); return; } openTrackCalendar(histCal); };

  function interpolateRoute(t) {
    const route = window._vesselRoute;
    if (!route) return null;
    t = Math.max(0, Math.min(1, t));
    const total = route.length - 1;
    const pos   = t * total;
    const idx   = Math.floor(pos);
    const frac  = pos - idx;
    const a = route[Math.min(idx, route.length - 1)];
    const b = route[Math.min(idx + 1, route.length - 1)];
    return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
  }

  function formatTs(t) {
    const d = new Date(startMs + t * (endMs - startMs));
    return d.toUTCString().replace('GMT', 'GMT');
  }

  const updatePos = (pct) => {
    state.timelinePos = Math.max(0, Math.min(1, pct));
    fill.style.width  = (state.timelinePos * 100) + '%';
    thumb.style.left  = (state.timelinePos * 100) + '%';
    if (tsEl) tsEl.textContent = formatTs(state.timelinePos);
    slider.setAttribute('aria-valuenow', Math.round(state.timelinePos * 100));
    slider.setAttribute('aria-valuetext', formatTs(state.timelinePos));
    const pb = document.getElementById('timeline-prev'), nb = document.getElementById('timeline-next');
    if (pb) pb.disabled = state.timelinePos <= 0;
    if (nb) nb.disabled = state.timelinePos >= 1;
    // Move vessel marker
    if (window._vesselMarker) {
      const pos = interpolateRoute(state.timelinePos);
      if (pos) {
        window._vesselMarker.setLatLng(pos);
        const r = window._vesselRoute, n = r.length - 1, i = Math.min(n - 1, Math.floor(state.timelinePos * n));
        const a = r[i], b = r[i + 1], lat = (a[0] + b[0]) / 2 * Math.PI / 180;
        const brg = Math.atan2((b[1] - a[1]) * Math.cos(lat), b[0] - a[0]) * 180 / Math.PI;
        const el = window._vesselMarker.getElement()?.querySelector('.vd-vessel');
        if (el) el.style.transform = `rotate(${brg}deg)`;
      }
    }
  };

  updatePos(state.timelinePos);

  const STEP = Math.min(1, 3600000 / Math.max(1, endMs - startMs)); // 1 hour
  const step = dir => updatePos(Math.round((state.timelinePos + dir * STEP) / STEP) * STEP);
  const hold = (btn, dir) => {
    if (!btn) return;
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.onpointerdown = e => { e.preventDefault(); step(dir); t1 = setTimeout(() => { t2 = setInterval(() => step(dir), 90); }, 400); };
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
    btn.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(dir); } };
  };
  hold(document.getElementById('timeline-prev'), -1);
  hold(document.getElementById('timeline-next'), 1);
  slider.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); step(1); }
    else if (e.key === 'Home') { e.preventDefault(); updatePos(0); }
    else if (e.key === 'End') { e.preventDefault(); updatePos(1); }
  });
  updatePos(state.timelinePos);

  const onDrag = (clientX) => {
    const rect = slider.getBoundingClientRect();
    updatePos((clientX - rect.left) / rect.width);
  };

  slider.addEventListener('mousedown', (e) => {
    onDrag(e.clientX);
    const onMove = (e) => onDrag(e.clientX);
    const onUp   = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Touch support
  slider.addEventListener('touchstart', (e) => {
    onDrag(e.touches[0].clientX);
    const onMove = (e) => onDrag(e.touches[0].clientX);
    const onEnd  = () => { slider.removeEventListener('touchmove', onMove); slider.removeEventListener('touchend', onEnd); };
    slider.addEventListener('touchmove', onMove);
    slider.addEventListener('touchend', onEnd);
  }, { passive: true });
}

  return {
    html: () => HistoricalEventsCard() + VesselTrackingCard(),
    init() {
      wireHistList();
      document.querySelectorAll('[data-bottom-right-tab]').forEach(b => b.addEventListener('click', () => {
        if (state.brTab === b.dataset.bottomRightTab) return; state.brTab = b.dataset.bottomRightTab; window.render();
      }));
      setTimeout(initMap, 50);
      setTimeout(wireTimeline, 100);
    },
    teardown() { if (map) { map.remove(); map = null; } },
  };
})();

window.render = function render() {
  if (map) { map.remove(); map = null; }
  VD_TRACK.teardown();
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();

  // Tabs
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    const v = b.getAttribute('data-tab');
    if (state.tab === v) return;
    state.tab = v;
    const group = b.closest('.ds-tabs');
    group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === b)));
    positionTabPills();
    setTimeout(render, 200);
  });

  // Chart toggle
  const ct = document.getElementById('chart-toggle');
  if (ct) ct.onclick = () => { state.chartType = state.chartType === 'bar' ? 'donut' : 'bar'; render(); };

  // Details show/hide toggle
  const dt = document.getElementById('details-toggle');
  if (dt) dt.onclick = () => { state.showDetails = !state.showDetails; render(); };

  // Sortable table headers (Port Calls / Region tabs)
  document.querySelectorAll('[data-sort-grp]').forEach(b => b.onclick = () => {
    const grp = b.dataset.sortGrp, key = b.dataset.sortKey, s = state.sort[grp];
    if (s.key === key) s.dir *= -1; else { s.key = key; s.dir = 1; }
    render();
  });

  // Event search — live filter without full re-render (keeps focus)
  const si = document.getElementById('event-search');
  if (si) {
    si.oninput = () => {
      state.search = si.value;
      const q = si.value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll('[data-event-row]').forEach(row => {
        const match = !q || row.getAttribute('data-search').includes(q);
        row.style.display = match ? '' : 'none';
        if (match) shown++;
      });
      const cnt = document.getElementById('events-count');
      if (cnt) cnt.textContent = `${shown} total items`;
    };
  }
  const pp = document.getElementById('per-page');
  if (pp) pp.onchange = () => { state.perPage = parseInt(pp.value); };

  requestAnimationFrame(positionTabPills);
  window.addEventListener('resize', positionTabPills, { passive:true });
  setTimeout(initMap, 60);
  VD_TRACK.init();
};
window.render();
</script>
</body>
</html>
