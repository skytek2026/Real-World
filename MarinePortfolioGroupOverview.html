<script>
const SC = window.sharedChrome;
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* Which group: ?group= in the link first (shareable), then the one picked on the Marine Dashboard. */
function selectedGroup() {
  const fromUrl = new URLSearchParams(location.search).get('group');
  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('selectedPortfolioGroup') || 'null'); } catch (e) {}
  if (fromUrl) return stored && stored.name === fromUrl ? stored : { name: fromUrl };
  return stored;
}

/* ── Risk Score card (copied from MarinePortfolioDetails.html) ── */
let mpWithSanctions = false;
let mpWithTrends = true;
const RS_FACTORS = [
  { name:'AIS Coverage',      score:0,  impact:0    },
  { name:'Days Loitering',     score:33, impact:0.50 },
  { name:'Distance Sailed',    score:50, impact:0.75 },
  { name:'Major Incidents',    score:0,  impact:0    },
  { name:'Minor Incidents',    score:0,  impact:0    },
  { name:'Overall Compliance', score:0,  impact:0    },
  { name:'PSC Deficiencies',   score:44, impact:6.62 },
];

function mpAnimateRiskPie() {
  const wrap = document.querySelector('.mp-rs-2026');
  if (!wrap || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const gauge = wrap.closest('.co-rs-gauge');
  const segs = [...wrap.querySelectorAll('.rs-seg')];
  const finals = segs.map(s => s.getAttribute('stroke-dasharray'));
  segs.forEach(s => { const C = (+s.getAttribute('r')) * 2 * Math.PI; s.style.transition = 'none'; s.setAttribute('stroke-dasharray', '0 ' + C.toFixed(3)); });
  if (gauge) { gauge.style.transition = 'none'; gauge.style.borderColor = mpWithSanctions ? '#e5e7eb' : '#dc2626'; }
  wrap.getBoundingClientRect();
  requestAnimationFrame(() => {
    segs.forEach((s, i) => { s.style.transition = 'stroke-dasharray .75s cubic-bezier(.22,1,.36,1) ' + (i * 60) + 'ms'; s.setAttribute('stroke-dasharray', finals[i]); });
    if (gauge) { gauge.style.transition = 'border-color .5s ease'; gauge.style.borderColor = mpWithSanctions ? '#dc2626' : '#e5e7eb'; }
  });
  const center = wrap.querySelector('.mp-rs-center');
  if (center) center.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'scale(1.06)', offset: .7 }, { opacity: 1, transform: 'scale(1)' }], { duration: 500, easing: 'ease-out' });
}

function PanelRiskBreakdown() {
    const rsScore = mpWithSanctions ? 100 : 58, rs2025 = 32, rs2024 = 6, rs2023 = 4;
    const rsDelta25   = rsScore - rs2025;   // current (main gauge) vs 2025
    const rsDelta2025 = rs2025  - rs2024;   // 2025 card vs 2024
    const rsDelta24   = rs2024  - rs2023;   // 2024 card vs 2023
    const rsPct = Math.round(Math.abs(rsDelta25) / rs2025 * 100);
    const risk = rsScore <= 25
      ? { label:'GOOD', c:'#16a34a', glow:'#16a34a', pillBg:'#dcfce7', pillTxt:'#15803d' }
      : rsScore <= 50
      ? { label:'AVERAGE RISK', c:'#d97706', glow:'#fef3c7', pillBg:'#fef3c7', pillTxt:'#b45309' }
      : { label:'BELOW AVERAGE', c:'#dc2626', glow:'#fee2e2', pillBg:'#fee2e2', pillTxt:'#dc2626' };
    // Year score → band colour (matches the gauge bands: green ≤25, orange ≤50, red >50)
    const yearColor = s => s <= 25 ? '#16a34a' : s <= 50 ? '#d97706' : '#dc2626';
    const yearPill  = s => s <= 25 ? { bg:'#dcfce7', txt:'#15803d' } : s <= 50 ? { bg:'#fef3c7', txt:'#b45309' } : { bg:'#fee2e2', txt:'#dc2626' };
    // Gauge geometry: 270° arc, start=135° (7:30 o'clock), sweep clockwise
    const CX=100, CY=108, R=80, RO=95, SW=11;
    const toRad = d => d * Math.PI / 180;
    const pt = (a, r) => [+(CX + r*Math.cos(toRad(a))).toFixed(2), +(CY + r*Math.sin(toRad(a))).toFixed(2)];
    const [sx,sy]   = pt(135, R);   // arc track start
    const [ex,ey]   = pt(45,  R);   // arc track end (135+270=405≡45°)
    const [sox,soy] = pt(135, RO);  // outer dot ring start
    const [eox,eoy] = pt(45,  RO);  // outer dot ring end
    // Smooth gradient gauge: 54 fine arc segments, each with interpolated color
    const GAUGE_MAX = 100, GAUGE_START = 135, GAUGE_SWEEP_DEG = 270;
    const gAngle = s => GAUGE_START + (Math.min(s, GAUGE_MAX) / GAUGE_MAX) * GAUGE_SWEEP_DEG;
    const arcD = (a1, a2, r) => {
      const [x1,y1] = pt(a1, r), [x2,y2] = pt(a2, r);
      const sw = ((a2 - a1) % 360 + 360) % 360;
      return `M ${x1},${y1} A ${r},${r} 0 ${sw > 180 ? 1 : 0},1 ${x2},${y2}`;
    };
    // Banded segment color: green ≤25, orange ≤50, red >50
    const gaugeColor = s => (s <= 25 ? '#16a34a' : s <= 50 ? '#d97706' : '#dc2626');
    const whiteCasing = `<path d="${arcD(gAngle(0), gAngle(GAUGE_MAX), R)}" fill="none" stroke="#ffffff" stroke-width="${SW}" stroke-linecap="butt"/>`;
    // Continuous band arcs — divider only between the main bands (at 25 & 50)
    const BANDS = mpWithSanctions ? [[0,100,'#dc2626']] : [[0,25,'#16a34a'],[25,50,'#d97706'],[50,100,'#dc2626']];
    const BAND_GAP = 1.4; // degrees of separation between main bands
    const segPaths = BANDS.map(([bs, be, col], bi) => {
      const aStart = gAngle(bs) + (bi > 0 ? BAND_GAP / 2 : 0);
      const aEnd   = gAngle(be) - (bi < BANDS.length - 1 ? BAND_GAP / 2 : 0);
      const fillEnd = Math.max(bs, Math.min(rsScore, be));
      const aFill = gAngle(fillEnd);
      let out = '';
      if (fillEnd > bs) out += `<path d="${arcD(aStart, Math.min(aFill, aEnd), R)}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-linecap="butt"/>`;
      if (fillEnd < be) out += `<path d="${arcD(Math.max(aFill, aStart), aEnd, R)}" fill="none" stroke="#e5e7eb" stroke-width="${SW}" stroke-linecap="butt"/>`;
      return out;
    }).join('');
    const glowColor = rsScore <= 25 ? '#16a34a' : rsScore <= 50 ? '#d97706' : '#fee2e2';
    const fillTipA = gAngle(Math.min(rsScore, GAUGE_MAX));
    const fillTipB = gAngle(Math.max(0, Math.min(rsScore, GAUGE_MAX) - GAUGE_MAX * 0.08));
    const glowPath = rsScore > 0 ? `<path d="${arcD(fillTipB, fillTipA, R)}" fill="none" stroke="${glowColor}" stroke-width="${SW + 8}" stroke-linecap="round" opacity="0.3"/>` : '';
    const rsFactorRows = RS_FACTORS.map(r => `<tr><td>${r.name}</td><td>${r.score}</td><td style="color:${r.impact>0?'#d97706':'#9ca3af'}">${r.impact>0?r.impact.toFixed(2):'0'}</td></tr>`).join('');
    const rsInfoIcon = (title, align='c') => `<span class="rs-info"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><div class="rs-tip ${align}"><div class="rs-tip-h">${title}</div><table class="rs-tip-tbl"><thead><tr><th>Risk Factor</th><th>Score</th><th>Impact</th></tr></thead><tbody>${rsFactorRows}</tbody></table></div></span>`;
    const RS_BANDS = [
      { k:'good', label:'Good',          range:'0 → 25',    c:'#16a34a' },
      { k:'avg',  label:'Average',       range:'25+ → 50',  c:'#d97706' },
      { k:'bad',  label:'Below average', range:'50+ → 100', c:'#dc2626' },
    ];
    const RS_DIST = {
      2026: mpWithSanctions ? { good:0, avg:0, bad:21 } : { good:3, avg:6, bad:12 },
      2025: { good:5, avg:11, bad:5 },
      2024: { good:18, avg:2, bad:1 },
    };
    const deltaPill = (d, extra='') => { const up = d >= 0, p = yearPill(up ? 60 : 10);
      return `<div style="background:#eff6ff;color:#2d7ffb;border:1px solid #bfdbfe;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="${up ? 'M12 19V5M5 12l7-7 7 7' : 'M12 5v14M5 12l7 7 7-7'}"/></svg>${up ? '+' : '−'} ${Math.abs(d)}${extra}</div>`; };
    const donut = (year, score, max, sw, numPx) => {
      const dist = RS_DIST[year], total = RS_BANDS.reduce((t, b) => t + dist[b.k], 0);
      const r = 50 - sw / 2, C = 2 * Math.PI * r, live = RS_BANDS.filter(b => dist[b.k] > 0), gap = live.length > 1 ? 0.9 : 0;
      let off = 0;
      const segs = live.map(b => { const n = dist[b.k], len = n / total * C, pct = Math.round(n / total * 100);
        const el = `<circle class="rs-seg" cx="50" cy="50" r="${r}" fill="none" stroke="${b.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(0, len - gap).toFixed(3)} ${(C - Math.max(0, len - gap)).toFixed(3)}" stroke-dashoffset="${(-off).toFixed(3)}" data-rs-tip="${b.label} (${pct}%): Num. Assets: ${n}" data-rs-c="${b.c}"><title>${year} · ${b.label} (${pct}%): ${n} assets</title></circle>`;
        off += len; return el; }).join('');
      return `<div class="${year === 2026 ? 'mp-rs-2026' : ''}" style="position:relative;width:100%;max-width:${max}px;aspect-ratio:1;">
        <svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible;transform:rotate(-90deg);" role="img" aria-label="${year} average risk score ${score}; ${RS_BANDS.map(b => b.label + ' ' + dist[b.k]).join(', ')} assets">${segs}</svg>

          ${year === 2026 && mpWithSanctions ? `<span style="font-size:${Math.round(numPx * 0.38)}px;font-weight:800;color:#111827;line-height:1;">Sanctioned</span>` : `<span style="font-size:${numPx}px;font-weight:800;color:#111827;line-height:1;font-variant-numeric:tabular-nums;">${score}</span>
          ${year === 2026 ? '' : `<span style="font-size:${Math.max(10, Math.round(numPx / 3.4))}px;color:#6b7280;margin-top:2px;">Avg Score</span>`}`}
        </div>
      </div>`;
    };
    const yearPillTag = y => `<span style="background:#6b7280;color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:999px;">${y}</span>`;
    let body = `

      <div class="co-rs-toggles" style="display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap;">
        <button data-mp-trends class="co-rs-trend" role="switch" aria-checked="${mpWithTrends}" style="white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:7px;background:transparent;border:0;cursor:pointer;font-size:10.5px;font-weight:600;color:#475569;font-family:inherit;padding:0;">
          With Trends
          <span style="position:relative;height:18px;width:32px;border-radius:999px;background:${mpWithTrends?'var(--brand-600,#2d7ffb)':'#cbd5e1'};transition:background .15s;display:inline-block;flex-shrink:0;">
            <span style="position:absolute;top:2px;${mpWithTrends?'left:16px':'left:2px'};height:14px;width:14px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s;"></span>
          </span>
        </button>
      </div>
      <div class="co-rs-grid" style="display:grid;grid-template-columns:${mpWithTrends ? 'repeat(auto-fit,minmax(180px,1fr))' : '1fr'};gap:8px;">
        <div class="co-rs-gauge" style="position:relative;background:#f9fafb;border:1px solid ${mpWithSanctions ? '#dc2626' : '#e5e7eb'};border-radius:12px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;">
        <button data-mp-sanctions class="co-rs-sanc" style="align-self:flex-end;max-width:100%;white-space:normal;text-align:right;line-height:1.2;display:flex;align-items:center;gap:7px;background:transparent;border:0;cursor:pointer;font-size:10.5px;font-weight:600;color:#475569;font-family:inherit;padding:0;">
          With Sanctions
          <span style="position:relative;height:18px;width:32px;border-radius:999px;background:${mpWithSanctions?'#dc2626':'#cbd5e1'};transition:background .15s;display:inline-block;flex-shrink:0;">
            <span style="position:absolute;top:2px;${mpWithSanctions?'left:16px':'left:2px'};height:14px;width:14px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s;"></span>
          </span>
        </button>
          <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">${yearPillTag(2026)}<div style="display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#6b7280;line-height:1.4;white-space:nowrap;"><span>Risk Score</span>${rsInfoIcon('Risk score as at Jan 1st 2026: ' + rsScore)}</div></div>
          ${donut(2026, rsScore, 170, 8, 44)}
          ${deltaPill(rsDelta25)}
        </div>
        ${mpWithTrends ? `
        <div class="co-rs-years" style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:center;align-content:center;">
          ${[[2025, rs2025, rsDelta2025, 'c'], [2024, rs2024, rsDelta24, 'r']].map(([y, v, d, al]) => `

        ${RS_BANDS.map(b => `<span style="display:inline-flex;align-items:center;gap:6px;white-space:nowrap;"><span style="width:10px;height:10px;border-radius:2px;background:${b.c};flex-shrink:0;"></span>${b.label}<span style="color:#64748b;">[${b.range}]</span></span>`).join('')}

function positionTabPills() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
      requestAnimationFrame(() => pill.classList.remove('is-init'));
    });
  });
}

/* Lucide glyph at any size */
function icon(name) {
  const d = window.lucide && lucide.icons && lucide.icons[name];
  if (!d) return '';
  const [tag, attrs, kids] = d;
  const a = o => Object.entries(o).map(([k, v]) => `${k}="${v}"`).join(' ');
  return `<${tag} ${a(attrs)} aria-hidden="true">${(kids || []).map(([t, ca]) => `<${t} ${a(ca)}/>`).join('')}</${tag}>`;
}
const toNum = v => typeof v === 'number' ? v : (v ? parseFloat(String(v).replace(/[^0-9.]/g, '')) : NaN);

/* Group Details. Uses the group's own data where the dashboards provide it (policies, active
   policies, risk, compliance); the remaining fields are prototype placeholders, seeded from the
   group name so each group always shows the same values. */
function groupDetails(g) {
  let seed = 0; for (const ch of (g.name || 'group')) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const between = (lo, hi) => lo + rnd() * (hi - lo);

  const total = Number.isFinite(toNum(g.policies)) ? Math.round(toNum(g.policies)) : Math.round(between(150, 6000));
  const active = Number.isFinite(toNum(g.policiesActive)) ? Math.round(toNum(g.policiesActive)) : Math.max(0, total - Math.round(total * between(0, 0.04)));
  const risk = Number.isFinite(toNum(g.risk)) ? toNum(g.risk) : Math.round(between(12, 62));
  const st = String(g.status || '').toLowerCase();
  const compliance = st === 'ok' ? 'Ok' : st === 'warning' ? 'Warning' : st === 'sanctioned' || st === 'non-compliant' ? 'Sanctioned'
                   : (r => r < 0.6 ? 'Ok' : r < 0.9 ? 'Warning' : 'Sanctioned')(rnd());
  const POOL = [['pa','Panama'],['lr','Liberia'],['mh','Marshall Islands'],['mt','Malta'],['sg','Singapore'],['gr','Greece'],['bs','Bahamas'],['cy','Cyprus'],['no','Norway'],['hk','Hong Kong'],['gb','United Kingdom'],['nl','Netherlands'],['cn','China'],['jp','Japan'],['ae','United Arab Emirates'],['tr','Turkey']];
  const nCountries = Math.round(between(4, 16));
  const countries = POOL.slice().sort(() => rnd() - 0.5).slice(0, nCountries);
  return {
    name: g.name || 'Portfolio group',
    total, active,
    casualties: Math.round(total * between(0.004, 0.018)),
    risk,
    age: between(7, 19).toFixed(1),
    gt: Math.round(total * between(9000, 38000)),
    inspections: between(1.4, 4.6).toFixed(1),
    compliance,
    countries
  };
}

function riskColour(n) { return n <= 25 ? '#16a34a' : n <= 50 ? '#d97706' : '#dc2626'; }   // Good / Average / Below average bands

function GroupDetailsCard(d) {
  const badge = { Ok:'pgo-badge--ok', Warning:'pgo-badge--warn', Sanctioned:'pgo-badge--bad' }[d.compliance];
  const flags = d.countries.slice(0, 4).map(([cc, n]) => `<img src="flags/${cc}.svg" alt="${esc(n)}" title="${esc(n)}" loading="lazy">`).join('');
  const rows = [
    ['Tag',           'Name',                         esc(d.name)],
    ['FileText',      'Total Number of Policies',     d.total.toLocaleString()],
    ['CircleCheck',   'Number of Active Policies',    d.active.toLocaleString()],
    ['TriangleAlert', 'Total Casualties',             d.casualties.toLocaleString()],
    ['Gauge',         'Average Risk Score',           `<span style="color:${riskColour(d.risk)}">${d.risk}</span>`],
    ['Calendar',      'Average Portfolio Age',        `${d.age} years`],
    ['Anchor',        'Total Gross Tonnage',          `${d.gt.toLocaleString()} GT`],
    ['Clipboard',     'Average Inspections',          d.inspections],
    ['ShieldCheck',   'Overall Sanctions Compliance', `<span class="pgo-badge ${badge}"><i></i>${d.compliance}</span>`],
    ['Globe',         'Monitored Countries',          `<span class="pgo-flags">${flags}<span>${d.countries.length} <span class="pgo-more">${d.countries.length === 1 ? 'country' : 'countries'}</span></span></span>`],
  ];
  return `
  <section class="pgo-card" aria-labelledby="pgo-details-h">
    <div class="pgo-card-h"><h2 id="pgo-details-h">Group Details</h2></div>
    <dl class="pgo-fields">
      ${rows.map(([ico, label, val]) => `<div class="pgo-row"><dt>${icon(ico)}${label}:</dt><dd>${val}</dd></div>`).join('')}
    </dl>
    <div class="pgo-foot">
      <button type="button" class="pgo-ghost" id="pgo-download">${icon('Download')}<span>Download report</span></button>
    </div>
  </section>`;
}

/* Totals: a metric strip; add more { label, value } entries to show more metrics side by side. */
function TotalsCard() {
  const metrics = [
    { label: 'Our Aggregated Exposure', value: '$60.2B' },
  ];
  return `
  <section class="pgo-card pgo-card--fit" aria-labelledby="pgo-totals-h">
    <div class="pgo-card-h"><h2 id="pgo-totals-h">Totals</h2></div>
    <div class="pgo-strip">
      ${metrics.map(m => `<div class="pgo-metric"><div class="pgo-metric-l">${esc(m.label)}</div><div class="pgo-metric-v">${esc(m.value)}</div></div>`).join('')}
    </div>
  </section>`;
}

function downloadReport(d) {
  const rows = [
    ['Group Details', ''],
    ['Name', d.name],
    ['Total Number of Policies', d.total],
    ['Number of Active Policies', d.active],
    ['Total Casualties', d.casualties],
    ['Average Risk Score', d.risk],
    ['Average Portfolio Age (years)', d.age],
    ['Total Gross Tonnage (GT)', d.gt],
    ['Average Inspections', d.inspections],
    ['Overall Sanctions Compliance', d.compliance],
    ['Monitored Countries', `${d.countries.length}: ${d.countries.map(c => c[1]).join(', ')}`],
    ['Generated', new Date().toISOString().slice(0, 10)],
  ];
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `${d.name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'portfolio-group'}-group-details.csv` });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function Main() {
  const g = selectedGroup() || {};
  const name = g.name || 'Portfolio group';
  const details = groupDetails(g);
  window.__pgoDetails = details;
  document.title = `${name} — Portfolio Group Overview — Real World`;
  return `
  <div class="scroll-thin" style="flex:1;overflow-y:auto;padding:16px">
    <div style="max-width:1280px;margin:0 auto">

      <div class="pgo-grid">
        ${GroupDetailsCard(details)}
        ${TotalsCard()}
        ${PanelRiskBreakdown()}
      </div>
      <div style="margin-top:12px">
        ${PolicySection()}
      </div>
    </div>
  </div>`;
}

window.render = function () {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main class="flex-1 min-h-0 overflow-hidden flex flex-col bg-slate-100">${Main()}</main>
    </div>
    ${SC.TweaksPanel()}`;
  SC.wireChrome();
  const dl = document.getElementById('pgo-download');
  if (dl) dl.addEventListener('click', () => downloadReport(window.__pgoDetails));

  /* Risk Score card: segment hover tooltip + toggles (same as Marine Portfolio Details) */
  if (!window._rsTipWired) { window._rsTipWired = true;
    const tip = document.createElement('div'); tip.className = 'rs-dtip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
    document.addEventListener('mousemove', e => { const seg = e.target.closest && e.target.closest('[data-rs-tip]');
      if (!seg) { tip.style.display = 'none'; return; }
      tip.innerHTML = '<i style="background:' + seg.dataset.rsC + '"></i>' + seg.dataset.rsTip; tip.style.display = 'flex';
      const w = tip.offsetWidth, x = Math.min(e.clientX + 14, innerWidth - w - 8); tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px'; });
  }
  document.querySelectorAll('[data-mp-trends]').forEach(b => b.onclick = () => { mpWithTrends = !mpWithTrends; window.render(); });
  document.querySelectorAll('[data-mp-sanctions]').forEach(b => b.onclick = () => { mpWithSanctions = !mpWithSanctions; window.render(); mpAnimateRiskPie(); });

  /* Policy / Asset / Map card */
  positionTabPills();
  (function syncPolCardHeight() {
    const pc = document.getElementById('pol-card');
    if (pc) { window.__polCardH = pc.offsetHeight; return; }
    const c = document.getElementById('ad-card') || document.getElementById('pm-card');
    if (c && window.__polCardH && window.innerWidth > 860) { c.style.height = window.__polCardH + 'px'; c.classList.add('pol-fixed'); }
  })();
  wireAssetDetails();
  wirePortfolioMap();
  const pvwSel = document.getElementById('pvw-select');
  if (pvwSel) pvwSel.onchange = () => { policyView = pvwSel.value; window.render(); };
  document.querySelectorAll('[data-pvw]').forEach(btn => {
    btn.onclick = () => {
      policyView = btn.dataset.pvw;
      const group = btn.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === btn)));
        positionTabPills();
        setTimeout(() => window.render(), 220);
      } else { window.render(); }
    };
  });
  if (!window.__pcardWired) {
    window.__pcardWired = true;
    document.addEventListener('click', (e) => {
      const t = e.target.closest('.pcard-toggle');
      if (!t) return;
      const card = t.closest('.pcard');
      const open = card.classList.toggle('open');
      t.setAttribute('aria-expanded', String(open));
      t.querySelector('.pcard-toggle-txt').textContent = open ? 'Show less' : 'Show more';
    });
  }
  const pag = document.querySelector('#pol-card .ds-pagination-wrap');
  if (pag) dsWirePagination(pag, { onPage: (p) => { policyPage = p; window.render(); } });
};
window.addEventListener('resize', positionTabPills, { passive: true });
window.render();
</script>
