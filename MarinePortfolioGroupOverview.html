<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portfolio Group Overview — Marine — Real World</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af'},ink:{900:'#0f172a',800:'#1e293b',700:'#334155',600:'#475569',500:'#64748b',400:'#94a3b8',300:'#cbd5e1',200:'#e2e8f0',100:'#f1f5f9',50:'#f8fafc'}}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--brand-600,#2563eb);text-decoration:none}a:hover{color:var(--brand-700,#1d4ed8);text-decoration:underline}
a:focus-visible{outline:2px solid var(--brand-400,#60a5fa);outline-offset:2px;border-radius:3px}
.pgo-back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.pgo-back svg{width:13px;height:13px}
.pgo-eyebrow{font-size:12px;font-weight:600;color:#64748b}
.pgo-title{font-family:'Exo',sans-serif;font-weight:700;font-size:26px;line-height:1.2;color:#0f172a;margin-top:2px;overflow-wrap:anywhere}
.pgo-empty{border:1.5px dashed #cbd5e1;border-radius:12px;padding:40px 20px;text-align:center}
.pgo-empty-ico{width:44px;height:44px;margin:0 auto;border-radius:10px;display:grid;place-items:center;background:var(--brand-50,#eff6ff);color:var(--brand-600,#2563eb)}
.pgo-empty-ico svg{width:22px;height:22px}
.pgo-empty h2{font-size:15px;font-weight:600;color:#0f172a;margin-top:12px}
.pgo-empty p{font-size:13.5px;color:#64748b;margin-top:4px;max-width:46ch;margin-left:auto;margin-right:auto;line-height:1.5}
html[data-theme="dark"] .pgo-title,html[data-theme="dark"] .pgo-empty h2{color:#e7ecf4}
html[data-theme="dark"] .pgo-eyebrow,html[data-theme="dark"] .pgo-empty p{color:#93a0b4}
html[data-theme="dark"] .pgo-empty{border-color:#34435c}
html[data-theme="dark"] .pgo-empty-ico{background:color-mix(in srgb,var(--brand-500,#3b82f6) 18%,transparent);color:var(--brand-300,#93c5fd)}
html[data-theme="dark"] a{color:var(--brand-300,#93c5fd)}
</style>
</head>
<body class="bg-slate-100 text-slate-900">
<div id="app" class="h-screen w-full flex overflow-hidden"></div>
<script>
window.PAGE = { id:'marine', title:'Marine', crumb:'Portfolio Group Overview' };
window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "comfortable",
  "accent": "sky",
  "sidebarExpanded": false,
  "showSparklines": true
}/*EDITMODE-END*/;
</script>
<script src="shared/lucide-local.js"></script>
<script src="shared/chrome.js?v=13"></script>
<script>
const SC = window.sharedChrome;
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

/* Which group: ?group= in the link first (shareable), then the one picked on the Marine Dashboard. */
function selectedGroup() {
  const fromUrl = new URLSearchParams(location.search).get('group');
  let stored = null;
  try { stored = JSON.parse(sessionStorage.getItem('selectedPortfolioGroup') || 'null'); } catch (e) {}
  if (fromUrl) return stored && stored.name === fromUrl ? stored : { name: fromUrl };
  return stored;
}

function Main() {
  const g = selectedGroup();
  const name = g && g.name ? g.name : 'Portfolio group';
  document.title = `${name} — Portfolio Group Overview — Real World`;
  return `
  <div class="scroll-thin" style="flex:1;overflow-y:auto;padding:16px">
    <div style="max-width:1280px;margin:0 auto">
      <a class="pgo-back" href="MarineDashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Marine dashboard
      </a>

      <section class="bg-white rounded-xl border border-ink-200 shadow-sm" style="margin-top:12px;padding:20px 22px" aria-labelledby="pgo-title">
        <div class="pgo-eyebrow">Portfolio group</div>
        <h1 id="pgo-title" class="pgo-title">${esc(name)}</h1>
      </section>

      <!-- Page content goes here (to be defined). -->
      <section class="bg-white rounded-xl border border-ink-200 shadow-sm" style="margin-top:12px;padding:16px" aria-label="Portfolio group content">
        <div class="pgo-empty">
          <div class="pgo-empty-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          </div>
          <h2>Overview content coming soon</h2>
          <p>This page will show an overview of the ${esc(name)} portfolio group. Its content hasn’t been defined yet.</p>
        </div>
      </section>
    </div>
  </div>`;
}

window.render = function () {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main class="flex-1 min-h-0 overflow-hidden flex flex-col bg-slate-100">${Main()}</main>
    </div>
    ${SC.TweaksPanel()}`;
  SC.wireChrome();
};
window.render();
</script>
</body>
</html>
