<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  html{scrollbar-width:thin;scrollbar-color:var(--brand-400,#51a2fc) #f3f4f6}
  #app *,.scroll-thin,.ds-scroll{scrollbar-width:thin;scrollbar-color:var(--brand-400,#51a2fc) #f3f4f6}
  html::-webkit-scrollbar,body::-webkit-scrollbar,#app *::-webkit-scrollbar,.scroll-thin::-webkit-scrollbar{width:6px;height:6px}
  html::-webkit-scrollbar-track,body::-webkit-scrollbar-track,#app *::-webkit-scrollbar-track,.scroll-thin::-webkit-scrollbar-track{background:#f3f4f6}
  html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb,#app *::-webkit-scrollbar-thumb,.scroll-thin::-webkit-scrollbar-thumb{background:var(--brand-400,#51a2fc);border-radius:999px}
  html::-webkit-scrollbar-thumb:hover,body::-webkit-scrollbar-thumb:hover,#app *::-webkit-scrollbar-thumb:hover,.scroll-thin::-webkit-scrollbar-thumb:hover{background:var(--brand-600,#2d7ffb)}
  /* Card */
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;box-shadow:0 2px 4px 0 rgb(15 23 42 / 0.08), 0 1px 2px 0 rgb(15 23 42 / 0.06)}
  /* Card footer — DS pattern: subtle bar + text-link actions */
  .card-foot{display:flex;align-items:center;min-height:36px;padding:0 14px;border-top:1px solid #f1f5f9;background:#f8fafc;margin-top:auto}
  .foot-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:#2563eb;background:transparent;border:0;cursor:pointer;font-family:inherit;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
  .foot-link:hover{color:#1d4ed8}
  .cd-card-foot{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid #ECEEF2;background:#F9FAFB;margin-top:auto;border-bottom-left-radius:inherit;border-bottom-right-radius:inherit}
  .cd-ghost{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 5px;border-radius:6px;background:transparent;border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--brand-600,#2d7ffb);transition:background .15s,color .15s;white-space:nowrap}
  .cd-ghost:hover{background:#f3f4f6;color:var(--brand-700,#1d4ed8)}
  .cd-ghost:focus-visible{outline:2px solid #60a5fa;outline-offset:1px}
  .cd-ghost svg{width:14px;height:14px;flex-shrink:0}
  .cd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 10px;font:inherit;font-size:12px;font-weight:500;color:#1e293b;background:#fff;border:1px solid #e2e8f0;border-radius:6px;box-shadow:0 1px 2px 0 rgb(15 23 42/.05);cursor:pointer;white-space:nowrap}
  .cd-btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .cd-btn:active{background:#f1f5f9}
  .cd-btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgb(45 127 251/.25)}
  .cd-btn svg{width:14px;height:14px;flex-shrink:0}
  /* Field rows in Company Details card */
  .field-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;gap:16px}
  .field-row:last-of-type{border-bottom:0}
  .field-label{font-size:12.5px;color:#94a3b8;display:flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap}
  .field-label svg{color:var(--brand-600,#2d7ffb);stroke:currentColor;flex-shrink:0}
  .field-label svg [stroke]:not([stroke="none"]){stroke:currentColor}
  .field-value{font-size:13px;font-weight:600;color:#0f172a;text-align:right}
  /* Buttons */
  .btn-outline{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1.5px solid #2563eb;border-radius:8px;background:#fff;color:#2563eb;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
  .btn-outline:hover{background:#eff6ff}
  .btn-gray{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1.5px solid #e2e8f0;border-radius:8px;background:#fff;color:#334155;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
  .btn-gray:hover{background:#f8fafc}
  /* Compliance badge */
  .comp-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;display:inline-block;white-space:nowrap}
  .cb-compliant{background:#f0fdf4;color:#16a34a}
  .cb-minor{background:#fffbeb;color:#d97706}
  .cb-noncompliant{background:#fef2f2;color:#dc2626}
  /* Assets table */
  .at-tbl{width:100%;border-collapse:collapse;min-width:540px}
  .at-tbl th{padding:9px 14px;font-size:11px;font-weight:600;color:var(--text-muted,#6B7280);text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:1px solid var(--border-default,#E5E7EB);white-space:nowrap;background:var(--slate-50,#F9FAFB)}
  .at-tbl td{padding:11px 14px;font-size:13px;color:#334155;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .at-tbl tr:last-child td{border-bottom:0}
  .at-tbl tbody tr:hover td{background:var(--brand-50,#eff6ff)}
  .at-tbl td:first-child{font-weight:700;color:#0f172a}
  /* Search */
  .search-wrap{position:relative;display:inline-flex;align-items:center}
  .search-wrap input{height:32px;padding:0 10px 0 30px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;color:#334155;font-family:inherit;outline:none;width:200px;transition:border-color .15s,box-shadow .15s}
  .search-wrap input:focus{border-color:var(--brand-500,#60a5fa);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-600,#2d7ffb) 18%,transparent)}
  .at-link{color:var(--brand-600,#2d7ffb);font-weight:700;text-decoration:none;cursor:pointer}
  .at-link:hover{color:var(--brand-700,#1d4ed8);text-decoration:underline;text-underline-offset:2px}
  #asset-filter:focus{border-color:var(--brand-500,#60a5fa);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-600,#2d7ffb) 18%,transparent)}
  .search-icon{position:absolute;left:9px;color:#94a3b8;display:flex;pointer-events:none}
  /* Pagination */
  .pgbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#334155;cursor:pointer;transition:background .1s}
  .pgbtn:hover:not([disabled]){background:#f1f5f9}.pgbtn[disabled]{opacity:.4;cursor:not-allowed}
  /* Responsive top row */
  .top-row-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
  .top-row-grid > .card{max-height:480px}
  .cd-content > *{flex-shrink:0}
  .cd-content{position:relative}
  .ds-page-btn{position:relative}
  @media(max-width:1023px){.top-row-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:639px){.top-row-grid{grid-template-columns:1fr}}
  /* Asset header bar wraps on mobile */
  .asset-hdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #e2e8f0}
  .asset-hdr-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
  @media(max-width:599px){
    .asset-hdr-controls{margin-left:0;width:100%}
    .search-wrap,.search-wrap input{width:100%}
    .asset-hdr-controls select{flex:1}
  }
  /* Pagination row */
  .pg-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid #e2e8f0}
  /* Risk Score info popups */
  .rs-tip{position:absolute;top:calc(100% + 9px);width:188px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.18);padding:9px 10px;opacity:0;visibility:hidden;transition:opacity .12s;z-index:40;}
  .rs-info{position:relative;display:inline-flex;align-items:center;justify-content:center;color:#94a3b8;cursor:pointer;margin-top:1px;}
  .rs-info:hover{color:#2563eb;}
  .rs-info:hover .rs-tip{opacity:1;visibility:visible;}
  .rs-tip.c{left:50%;transform:translateX(-50%);}
  .rs-tip.l{left:-6px;}
  .rs-tip.r{right:-6px;}
  .rs-tip::after{content:'';position:absolute;bottom:100%;width:9px;height:9px;background:#fff;border-left:1px solid #e5e7eb;border-top:1px solid #e5e7eb;transform:translateY(50%) rotate(45deg);}
  .rs-tip.c::after{left:50%;margin-left:-4.5px;}
  .rs-tip.l::after{left:14px;}
  .rs-tip.r::after{right:14px;}
  .rs-tip-h{font-size:10.5px;font-weight:800;color:#111827;margin-bottom:6px;}
  .rs-tip-tbl{width:100%;border-collapse:collapse;font-size:10px;}
  .rs-tip-tbl th{padding:2px 3px;font-size:9px;font-weight:700;color:#6b7280;text-align:right;border-bottom:1px solid #f1f5f9;}
  .rs-tip-tbl th:first-child{text-align:left;}
  .rs-tip-tbl td{padding:2.5px 3px;color:#374151;text-align:right;}
  .rs-tip-tbl td:first-child{text-align:left;color:#111827;}
</style>
</head>

function riskColor(r) {
  if (r < 40) return '#16a34a';
  if (r < 75) return '#d97706';
  return '#dc2626';
}

function complianceCls(c) {
  if (c === 'Compliant')     return 'cb-compliant';
  if (c === 'Minor Issues')  return 'cb-minor';
  return 'cb-noncompliant';
}

function typeDisplay(t) {
  const ico   = { Marine:IC.ship, Property:IC.building, Aviation:IC.plane, Offshore:IC.offshore }[t] || IC.building;
  return `<span style="display:inline-flex;align-items:center;gap:6px;color:#334155"><span style="color:var(--brand-600,#2d7ffb);display:inline-flex">${ico}</span>${t}</span>`;
}

/* ── Donut chart SVG ─────────────────────────────────────────────────────── */
function DonutChart(risk) {
  const r    = 56;
  const circ = 2 * Math.PI * r;       // ≈ 351.86
  const fill = (risk / 100) * circ;
  const gap  = circ - fill;
  const off  = circ * 0.25;           // start at 12 o'clock
  const col  = riskColor(risk);
  return `
  <svg viewBox="0 0 160 160" width="148" height="148" style="display:block;margin:0 auto;overflow:visible">
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="15"/>
    <circle cx="80" cy="80" r="${r}" fill="none" stroke="${col}" stroke-width="15"
      stroke-dasharray="${fill.toFixed(2)} ${gap.toFixed(2)}"
      stroke-dashoffset="${off.toFixed(2)}"
      stroke-linecap="round"/>
    <text x="80" y="74" text-anchor="middle" font-size="10.5" fill="#94a3b8"
      font-family="Inter,sans-serif" font-weight="500">Avg. Risk:</text>
    <text x="80" y="98" text-anchor="middle" font-size="30" fill="#0f172a"
      font-family="Inter,sans-serif" font-weight="700">${risk}</text>
  </svg>`;
}

/* ── Card: Risk Breakdown ────────────────────────────────────────────────── */
function CardRiskBreakdown() {
    const factors = [
    { name:'Sanctions Exposure',     score:0,  impact:0    },
    { name:'Beneficial Ownership',   score:18, impact:0.85 },
    { name:'AIS Coverage',           score:22, impact:1.10 },
    { name:'PSC Deficiencies',       score:44, impact:6.62 },
    { name:'Major Incidents',        score:0,  impact:0    },
    { name:'Minor Incidents',        score:12, impact:0.40 },
    { name:'Overall Compliance',     score:0,  impact:0    },
  ];
  const rsScore = coWithSanctions ? 100 : avgRisk, rs2025 = Math.max(0,Math.round(avgRisk*0.78)), rs2024 = Math.max(0,Math.round(avgRisk*0.55)), rs2023 = Math.max(0,Math.round(avgRisk*0.4));
    const rsDelta25   = rsScore - rs2025;   // current (main gauge) vs 2025
    const rsDelta2025 = rs2025  - rs2024;   // 2025 card vs 2024
    const rsDelta24   = rs2024  - rs2023;   // 2024 card vs 2023
    const rsPct = Math.round(Math.abs(rsDelta25) / rs2025 * 100);
    const risk = rsScore <= 25
      ? { label:'GOOD', c:'#16a34a', glow:'#16a34a', pillBg:'#dcfce7', pillTxt:'#15803d' }
      : rsScore <= 50
      ? { label:'AVERAGE RISK', c:'#d97706', glow:'#fef3c7', pillBg:'#fef3c7', pillTxt:'#b45309' }
      : { label:'BELOW AVERAGE', c:'#dc2626', glow:'#fee2e2', pillBg:'#fee2e2', pillTxt:'#dc2626' };
    // Year score → band colour (matches the gauge bands: green ≤25, orange ≤50, red >50)
    const yearColor = s => s <= 25 ? '#16a34a' : s <= 50 ? '#d97706' : '#dc2626';
    const yearPill  = s => s <= 25 ? { bg:'#dcfce7', txt:'#15803d' } : s <= 50 ? { bg:'#fef3c7', txt:'#b45309' } : { bg:'#fee2e2', txt:'#dc2626' };
    // Gauge geometry: 270° arc, start=135° (7:30 o'clock), sweep clockwise
    const CX=100, CY=108, R=80, RO=95, SW=11;
    const toRad = d => d * Math.PI / 180;
    const pt = (a, r) => [+(CX + r*Math.cos(toRad(a))).toFixed(2), +(CY + r*Math.sin(toRad(a))).toFixed(2)];
    const [sx,sy]   = pt(135, R);   // arc track start
    const [ex,ey]   = pt(45,  R);   // arc track end (135+270=405≡45°)
    const [sox,soy] = pt(135, RO);  // outer dot ring start
    const [eox,eoy] = pt(45,  RO);  // outer dot ring end
    // Smooth gradient gauge: 54 fine arc segments, each with interpolated color
    const GAUGE_MAX = 100, GAUGE_START = 135, GAUGE_SWEEP_DEG = 270;
    const gAngle = s => GAUGE_START + (Math.min(s, GAUGE_MAX) / GAUGE_MAX) * GAUGE_SWEEP_DEG;
    const arcD = (a1, a2, r) => {
      const [x1,y1] = pt(a1, r), [x2,y2] = pt(a2, r);
      const sw = ((a2 - a1) % 360 + 360) % 360;
      return `M ${x1},${y1} A ${r},${r} 0 ${sw > 180 ? 1 : 0},1 ${x2},${y2}`;
    };
    // Banded segment color: green ≤25, orange ≤50, red >50
    const gaugeColor = s => (s <= 25 ? '#16a34a' : s <= 50 ? '#d97706' : '#dc2626');
    const whiteCasing = `<path d="${arcD(gAngle(0), gAngle(GAUGE_MAX), R)}" fill="none" stroke="#ffffff" stroke-width="${SW}" stroke-linecap="butt"/>`;
    // Continuous band arcs — divider only between the main bands (at 25 & 50)
    const BANDS = coWithSanctions ? [[0,100,'#dc2626']] : [[0,25,'#16a34a'],[25,50,'#d97706'],[50,100,'#dc2626']];
    const BAND_GAP = 1.4; // degrees of separation between main bands
    const segPaths = BANDS.map(([bs, be, col], bi) => {
      const aStart = gAngle(bs) + (bi > 0 ? BAND_GAP / 2 : 0);
      const aEnd   = gAngle(be) - (bi < BANDS.length - 1 ? BAND_GAP / 2 : 0);
      const fillEnd = Math.max(bs, Math.min(rsScore, be));
      const aFill = gAngle(fillEnd);
      let out = '';
      if (fillEnd > bs) out += `<path d="${arcD(aStart, Math.min(aFill, aEnd), R)}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-linecap="butt"/>`;
      if (fillEnd < be) out += `<path d="${arcD(Math.max(aFill, aStart), aEnd, R)}" fill="none" stroke="#e5e7eb" stroke-width="${SW}" stroke-linecap="butt"/>`;
      return out;
    }).join('');
    const glowColor = rsScore <= 25 ? '#16a34a' : rsScore <= 50 ? '#d97706' : '#fee2e2';
    const fillTipA = gAngle(Math.min(rsScore, GAUGE_MAX));
    const fillTipB = gAngle(Math.max(0, Math.min(rsScore, GAUGE_MAX) - GAUGE_MAX * 0.08));
    const glowPath = rsScore > 0 ? `<path d="${arcD(fillTipB, fillTipA, R)}" fill="none" stroke="${glowColor}" stroke-width="${SW + 8}" stroke-linecap="round" opacity="0.3"/>` : '';
    const rsFactorRows = factors.map(r => `<tr><td>${r.name}</td><td>${r.score}</td><td style="color:${r.impact>0?'#d97706':'#9ca3af'}">${r.impact>0?r.impact.toFixed(2):'0'}</td></tr>`).join('');
    const rsInfoIcon = (title, align='c') => `<span class="rs-info"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><div class="rs-tip ${align}"><div class="rs-tip-h">${title}</div><table class="rs-tip-tbl"><thead><tr><th>Risk Factor</th><th>Score</th><th>Impact</th></tr></thead><tbody>${rsFactorRows}</tbody></table></div></span>`;
    let body = `
    <div style="padding:10px 12px;flex:1;overflow:visible;display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;">
        <button data-co-sanctions style="display:flex;align-items:center;gap:7px;background:transparent;border:0;cursor:pointer;font-size:10.5px;font-weight:600;color:#475569;font-family:inherit;padding:0;">
          With Sanctions
          <span style="position:relative;height:18px;width:32px;border-radius:999px;background:${coWithSanctions?'#dc2626':'#cbd5e1'};transition:background .15s;display:inline-block;flex-shrink:0;">
            <span style="position:absolute;top:2px;${coWithSanctions?'left:16px':'left:2px'};height:14px;width:14px;border-radius:999px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s;"></span>
          </span>
        </button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">
        <!-- Gauge -->
        <div style="position:relative;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:8px;display:flex;flex-direction:column;align-items:center;"><div style="position:absolute;top:6px;right:6px;z-index:5;">${rsInfoIcon('Current · Risk Score ' + rsScore)}</div>
          <div style="position:relative;width:100%;max-width:188px;">
            <svg viewBox="0 0 200 192" style="width:100%;height:auto;overflow:visible;" preserveAspectRatio="xMidYMid meet">
              <defs>
                <radialGradient id="rsGaugeGlowCo" cx="50%" cy="55%" r="42%">
                  <stop offset="0%" stop-color="${risk.glow}" stop-opacity="0.55"/>
                  <stop offset="100%" stop-color="${risk.glow}" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <!-- Soft glow behind fill -->
              <ellipse cx="100" cy="108" rx="70" ry="60" fill="url(#rsGaugeGlowCo)"/>
              <!-- Glow at fill tip -->
              ${glowPath}
              <!-- White casing behind segments for crisp separators -->
              ${whiteCasing}
              <!-- Banded fill segments (grey when unfilled) -->
              ${segPaths}
              <!-- Score number -->
              <text x="100" y="122" text-anchor="middle" font-size="52" font-weight="800" fill="#111827" font-family="Inter,sans-serif">${rsScore}</text>
            </svg>
          </div>
          <div style="background:transparent;border:0;border-radius:8px;padding:2px 10px;text-align:center;width:100%;">
            <div style="display:flex;align-items:center;justify-content:center;gap:3px;color:${risk.c};font-weight:700;font-size:13px;">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              +${rsDelta25} (+${rsPct}%)
            </div>
          </div>
        </div>
        <!-- Year comparisons -->
        <div style="background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:8px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px;align-items:start;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <span style="background:#6b7280;color:#fff;font-size:10px;font-weight:700;padding:3px 12px;border-radius:999px;">2025</span>
            <div style="display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#6b7280;line-height:1.4;">Avg. Risk Score ${rsInfoIcon('2025 · Avg. Risk Score ' + rs2025, 'l')}</div>
            <div style="position:relative;width:60px;height:60px;border-radius:50%;background:conic-gradient(${yearColor(rs2025)} ${rs2025*3.6}deg, #e5e7eb 0deg);display:flex;align-items:center;justify-content:center;">
              <div style="position:absolute;width:44px;height:44px;background:#f9fafb;border-radius:50%;"></div>
              <span style="position:relative;font-size:20px;font-weight:800;color:#111827;line-height:1;">${rs2025}</span>
            </div>
            <div style="background:${yearPill(rs2025).bg};color:${yearPill(rs2025).txt};border:1px solid color-mix(in srgb, ${yearPill(rs2025).txt} 30%, transparent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;display:flex;align-items:center;gap:3px;white-space:nowrap;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              + ${rsDelta2025}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
            <span style="background:#6b7280;color:#fff;font-size:10px;font-weight:700;padding:3px 12px;border-radius:999px;">2024</span>
            <div style="display:flex;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#6b7280;line-height:1.4;">Avg. Risk Score ${rsInfoIcon('2024 · Avg. Risk Score ' + rs2024, 'r')}</div>
            <div style="position:relative;width:60px;height:60px;border-radius:50%;background:conic-gradient(${yearColor(rs2024)} ${rs2024*3.6}deg, #e5e7eb 0deg);display:flex;align-items:center;justify-content:center;">
              <div style="position:absolute;width:44px;height:44px;background:#f9fafb;border-radius:50%;"></div>
              <span style="position:relative;font-size:20px;font-weight:800;color:#111827;line-height:1;">${rs2024}</span>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  return `
  <div class="card flex flex-col" style="min-height:0;overflow:visible">
    <div style="padding:10px 14px;border-bottom:1px solid #f1f5f9"><span style="font-size:14px;font-weight:700;color:#0f172a">Risk Breakdown</span></div>
    ${body}
  </div>`;
}

function CardRiskAssociations() {

          <tr>
            <td style="font-weight:600;color:#0f172a">${r.rel}</td>
            <td>${r.type === 'Individual' ? `<span style="font-weight:700;color:#0f172a">${r.entity}</span>` : `<a href="#" class="at-link" onclick="event.preventDefault()">${r.entity}</a>`}</td>
            <td style="font-weight:400;color:#334155">${r.type}</td>
            <td style="font-weight:400;color:#475569">${r.evidence}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ── Card: Assets ────────────────────────────────────────────────────────── */
function CardAssets() {
  let rows = [...ALL_ASSETS];
  if (assetQuery)         rows = rows.filter(a => a.name.toLowerCase().includes(assetQuery.toLowerCase()) || a.type.toLowerCase().includes(assetQuery.toLowerCase()));
  if (assetFilter !== 'all') rows = rows.filter(a => a.type === assetFilter);
  const total      = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / assetPerPage));
  if (assetPage > totalPages) assetPage = totalPages;
  const start    = (assetPage - 1) * assetPerPage;
  const pageRows = rows.slice(start, start + assetPerPage);
  const types    = [...new Set(ALL_ASSETS.map(a => a.type))];

  return `
  <div class="card flex flex-col">
    <div class="asset-hdr">
      <div style="display:flex;align-items:center">
        <span style="font-size:14px;font-weight:700;color:#0f172a">Assets</span>
      </div>
      <div class="asset-hdr-controls">
        <div class="search-wrap">
          <span class="search-icon">${IC.search}</span>
          <input id="asset-search" type="text" placeholder="Search assets..." value="${assetQuery.replace(/"/g,'&quot;')}" />
        </div>
        <div style="position:relative">
          <select id="asset-filter" style="appearance:none;-webkit-appearance:none;height:32px;padding:0 28px 0 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;color:#334155;background:#fff;cursor:pointer;font-family:inherit;outline:none;font-weight:600">
            <option value="all" ${assetFilter==='all'?'selected':''}>All Assets</option>
            ${types.map(t=>`<option value="${t}" ${assetFilter===t?'selected':''}>${t}</option>`).join('')}
          </select>
          <span style="position:absolute;right:7px;top:50%;transform:translateY(-50%);pointer-events:none;color:#64748b;display:flex">${IC.chevDown}</span>
        </div>
      </div>
    </div>
    <div class="overflow-x-auto scroll-thin">
      <table class="at-tbl">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>IMO</th>
            <th>MMSI</th>
            <th>Risk Score</th>
            <th>Compliance</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          ${pageRows.length === 0
            ? `<tr><td colspan="7" style="text-align:center;padding:48px;color:#94a3b8;font-size:13px">No assets found.</td></tr>`
            : pageRows.map(a => `
          <tr>
            <td>${(()=>{
              const pageMap = {Marine:'VesselDetails.html', Property:'PropertyDetails.html', Aviation:'AircraftDetails.html', Offshore:'AssetOffshoreDetails.html'};
              const href = pageMap[a.type];
              if (!href) return `<span style="font-weight:700;color:#0f172a">${a.name}</span>`;
              const key = {Marine:'selectedVessel', Property:'selectedProperty', Aviation:'selectedAircraft', Offshore:'selectedOffshore'}[a.type];
              const payload = JSON.stringify({name:a.name,type:a.type,risk:a.risk,compliance:a.compliance,value:a.value,company:co.name}).replace(/'/g,"\\'");
              return `<a href="${href}" class="at-link" onclick="sessionStorage.setItem('${key}','${payload}');return true;">${a.name}</a>`;
            })()}</td>
            <td>${typeDisplay(a.type)}</td>
            <td style="font-variant-numeric:tabular-nums;${a.imo === 'N/A' ? 'color:#64748b' : 'color:#334155'}">${a.imo}</td>
            <td style="font-variant-numeric:tabular-nums;${a.mmsi === 'N/A' ? 'color:#64748b' : 'color:#334155'}">${a.mmsi}</td>
            <td style="font-weight:700;color:${riskColor(a.risk)}">${a.risk}</td>
            <td><span class="comp-badge ${complianceCls(a.compliance)}">${a.compliance}</span></td>
            <td style="font-weight:600">${a.value}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    ${dsPagination({
      page: assetPage,
      totalPages,
      totalItems: total,
      perPage: assetPerPage,
      perPageOptions: [5, 10, 20],
      label: 'assets',
    })}
  </div>`;
}

/* ── Content ─────────────────────────────────────────────────────────────── */
function Content() {
  return `
  <div class="cd-content flex-1 overflow-y-auto scroll-thin px-4 lg:px-6 py-4" style="display:flex;flex-direction:column;gap:16px">
    <div class="top-row-grid">
      ${CardCompanyDetails()}
      ${CardRiskBreakdown()}
    </div>
    ${CardRiskAssociations()}
    ${CardAssets()}
  </div>`;
}

/* ── Wire ────────────────────────────────────────────────────────────────── */
function wireInteractions() {
  const assetSearch = document.getElementById('asset-search');
  if (assetSearch) {
    assetSearch.oninput = () => { assetQuery = assetSearch.value; assetPage = 1; rc(); };
    assetSearch.onfocus = () => { assetSearch.style.borderColor='#93c5fd'; assetSearch.style.boxShadow='0 0 0 3px rgba(59,130,246,.12)'; };
    assetSearch.onblur  = () => { assetSearch.style.borderColor='#e2e8f0';  assetSearch.style.boxShadow=''; };
  }
  const filterSel = document.getElementById('asset-filter');
  if (filterSel) filterSel.onchange = () => { assetFilter = filterSel.value; assetPage = 1; rc(); };
  document.querySelectorAll('[data-co-sanctions]').forEach(b => b.onclick = () => { coWithSanctions = !coWithSanctions; rc(); });
  /* Pagination (DS-compliant) */
  dsWirePagination(document.querySelector('.ds-pagination-wrap'), {
    onPage:    (p) => { assetPage = p; rc(); },
    onPerPage: (n) => { assetPerPage = n; assetPage = 1; rc(); },
  });
}

let _main = null;
// Structural path selector relative to _main (survives innerHTML rebuild when markup shape is unchanged)
function sel(el) {
  const parts = [];
  for (let n = el; n && n !== _main; n = n.parentElement) {
    const idx = [...n.parentElement.children].indexOf(n) + 1;
    parts.unshift(`:scope > :nth-child(${idx})`.replace(':scope > ', ''));
  }
  return parts.length ? ':scope > ' + parts.join(' > ') : null;
}
function rc() {
  if (!_main) return;
  // Preserve scroll positions (page + inner scrollers) and focus across the full re-render
  const scrollers = [];
  for (let el = _main; el; el = el.parentElement) if (el.scrollTop || el.scrollLeft) scrollers.push([el, el.scrollTop, el.scrollLeft]);
  const docTop = window.scrollY;
  const inner = [..._main.querySelectorAll('*')].map((el, i) => [i, el]).filter(([, el]) => el.scrollTop || el.scrollLeft).map(([i, el]) => [el.id ? '#' + el.id : null, sel(el), el.scrollTop, el.scrollLeft]);
  const fid = document.activeElement && _main.contains(document.activeElement) ? document.activeElement.id : null;
  _main.innerHTML = Content();
  wireInteractions();
  scrollers.forEach(([el, t, l]) => { el.scrollTop = t; el.scrollLeft = l; });
  if (window.scrollY !== docTop) window.scrollTo(0, docTop);
  inner.forEach(([idSel, pathSel, t, l]) => { const el = (idSel && _main.querySelector(idSel)) || (pathSel && _main.querySelector(pathSel)); if (el) { el.scrollTop = t; el.scrollLeft = l; } });
  if (fid) document.getElementById(fid)?.focus({ preventScroll: true });
}

window.__goCompare = function() {
  try {
    const slug = co.name ? co.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.com' : '—';
    const c = {
      name: co.name || 'Company', type: co.type || '—', country: co.country || '—',
      flag: co.flag || '', code: co.code || co.reg || '—', fleet: co.fleet || 0,
      fleetVal: co.fleetVal || '—', risk: (co.avgRisk !== undefined ? co.avgRisk : 55),
      hq: co.hq || '—', established: co.est || '—',
      countryControl: co.countryControl || co.country || '—', countryDomicile: co.country || '—',
      website: co.website || slug, compliance: co.sanctioned ? 'Sanctioned' : 'Not Sanctioned',
    };
    sessionStorage.setItem('compareCompany', JSON.stringify(c));
    sessionStorage.setItem('reportsTab', 'comp');
  } catch(e){}
  window.location.href = 'Reports.html';
};

window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main id="cd-main" class="flex-1 min-h-0 overflow-hidden flex flex-col bg-slate-100"></main>
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  _main = document.getElementById('cd-main');
  rc();
};

window.render();
</script>
