<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>News — Real World</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',200:'#b8ddf5',300:'#93c5fd',400:'#60a5fa',500:'#1a92d1',600:'#2563eb',700:'#1d4ed8',800:'#1e40af'},ink:{900:'#111827',800:'#1f2937',700:'#374151',600:'#4b5563',500:'#6b7280',400:'#9ca3af',300:'#d1d5db',200:'#e5e7eb',100:'#f3f4f6',50:'#f9fafb'}}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;color:#111827;overflow:hidden;overscroll-behavior:none}
  .scroll-thin::-webkit-scrollbar{width:6px;height:6px}
  .scroll-thin::-webkit-scrollbar-thumb{background:var(--brand-400,#1a92d1);border-radius:999px}

  /* Category dropdown (replaces pill tabs) */
  .cat-dd{position:relative;display:inline-flex}
  .cat-btn{height:36px;padding:0 12px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;font:inherit;font-size:14px;font-weight:600;color:#111827;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s;min-width:160px}
  .cat-btn:hover{border-color:#d1d5db}
  .cat-btn[aria-expanded="true"]{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .cat-btn .cat-cur-ico{color:#4b5563;flex-shrink:0;display:inline-flex}
  .cat-btn .cat-cur-label{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-btn .cat-filter-ico{display:none}
  .cat-btn .cat-chev{color:#9ca3af;flex-shrink:0;transition:transform .15s}
  .cat-btn[aria-expanded="true"] .cat-chev{transform:rotate(180deg)}
  .cat-pop{position:absolute;top:calc(100% + 6px);left:0;min-width:200px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px -4px rgba(15,23,42,.12);z-index:30;padding:8px}
  .cat-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#374151;font-weight:500;background:none;border:0;width:100%;text-align:left;font-family:inherit}
  .cat-opt:hover{background:#f9fafb}
  .cat-opt[aria-selected="true"]{background:#eff6ff;color:#1d4ed8}
  .cat-opt .cat-opt-ico{flex-shrink:0;color:#6b7280;display:inline-flex}
  .cat-opt[aria-selected="true"] .cat-opt-ico{color:#2563eb}
  .cat-opt .cat-opt-check{margin-left:auto;color:#2563eb;opacity:0}
  .cat-opt[aria-selected="true"] .cat-opt-check{opacity:1}

  /* Source dropdown */
  .src-btn{height:36px;padding:0 12px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:#374151;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .15s, box-shadow .15s;max-width:100%;min-width:0}
  .src-btn > span:not(.src-dot){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .src-btn:hover{border-color:#d1d5db}
  .src-btn[aria-expanded="true"]{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .src-pop{position:absolute;top:calc(100% + 6px);right:0;width:260px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 8px 24px -4px rgba(15,23,42,.12);z-index:30;padding:8px;max-height:340px;overflow-y:auto}
  .src-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#374151}
  .src-row:hover{background:#f9fafb}
  .src-row input{accent-color:#2563eb}
  .src-foot{display:flex;justify-content:space-between;padding:8px 12px 4px;border-top:1px solid #f3f4f6;margin-top:4px}
  .src-mini{font-size:12px;color:#2563eb;background:none;border:0;cursor:pointer;font-weight:600;font-family:inherit}
  .src-mini:hover{text-decoration:underline}

  /* Source pop — anchored right on small screens so it never overflows viewport */
  @media (max-width:560px){
    .src-pop{right:0;left:auto;width:min(280px, calc(100vw - 24px))}
    .cat-pop{left:0;width:min(240px, calc(100vw - 24px))}
  }

  /* Search */
  .search-wrap{position:relative;flex:1;min-width:160px;max-width:320px}
  .search-input{height:36px;width:100%;padding:0 12px 0 36px;border:1px solid #e5e7eb;border-radius:8px;font:inherit;font-size:14px;background:#fff;color:#111827;outline:none;transition:border-color .15s, box-shadow .15s}
  @media (min-width:720px){.search-wrap{width:260px;flex:none}}
  .search-input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#9ca3af}

  /* News card */
  .news-card{display:flex;flex-direction:column;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;height:100%}
  .news-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px -8px rgba(15,23,42,.12);border-color:#d1d5db}
  .news-thumb{position:relative;aspect-ratio:16/9;background:#f3f4f6;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .news-thumb svg.bg-pattern{position:absolute;inset:0;width:100%;height:100%;opacity:.18}
  .news-thumb .glyph{position:relative;width:64px;height:64px;color:#fff;opacity:.95}
  .news-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;transition:transform .4s ease}
  .news-card:hover .news-photo{transform:scale(1.04)}
  .news-thumb.has-photo svg.bg-pattern,
  .news-thumb.has-photo .glyph{display:none}
  .news-thumb.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.35) 0%,rgba(15,23,42,0) 35%,rgba(15,23,42,0) 100%);z-index:2;pointer-events:none}
  .news-cat{z-index:3}

  /* Hover overlay: 50% black wash + centered right-arrow */
  .news-hover{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease;pointer-events:none}
  .news-card:hover .news-hover{opacity:1}
  .news-hover-arrow{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:999px;background:rgba(255,255,255,.95);color:#111827;transform:scale(.85);transition:transform .2s ease}
  .news-card:hover .news-hover-arrow{transform:scale(1)}
  .news-cat{position:absolute;top:10px;left:10px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.95);backdrop-filter:blur(4px);color:#111827;box-shadow:0 1px 2px rgba(15,23,42,.08)}
  .news-body{padding:16px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .news-title{font-size:14px;font-weight:700;line-height:1.35;color:#111827;text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .news-card:hover .news-title{color:#1d4ed8}
  .news-snippet{font-size:14px;color:#6b7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-meta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid #f3f4f6;font-size:12px;color:#9ca3af}
  .news-source{display:flex;align-items:center;gap:4px;font-weight:600;color:#4b5563}
  .src-dot{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:0}
  .ext-ico{color:#9ca3af;flex-shrink:0}
  .news-card:hover .ext-ico{color:#2563eb}

  /* Two-column grid on all sizes; scale to 3 cols on wide viewports. */
  .news-grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (min-width:720px){.news-grid{gap:16px}}
  @media (min-width:1180px){.news-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (min-width:1180px){.news-grid > .featured{grid-column:span 2}.news-grid > .featured .news-thumb{aspect-ratio:21/9}.news-grid > .featured .news-title{font-size:20px;-webkit-line-clamp:2}.news-grid > .featured .news-snippet{-webkit-line-clamp:3}}

  /* Small-screen card density */
  @media (max-width:560px){
    .news-card{border-radius:12px}
    .news-body{padding:12px 12px 12px;gap:4px}
    .news-title{font-size:14px;-webkit-line-clamp:3;line-height:1.3}
    .news-snippet{display:none}
    .news-meta{padding-top:8px;font-size:12px}
    .news-cat{font-size:12px;padding:2px 8px;top:7px;left:7px}
    .news-thumb .glyph{width:42px;height:42px}
    .src-dot{width:12px;height:12px;font-size:12px}
  }

  /* Page padding scales down on small screens */
  .news-shell{max-width:1400px;margin:0 auto;padding:24px 28px 60px}
  @media (max-width:720px){.news-shell{padding:16px 16px 48px}}

  /* Category color accents */
  .cat-marine   { --c1:#0891b2; --c2:#0e7490 }
  .cat-property { --c1:#9333ea; --c2:#9333ea }
  .cat-aviation { --c1:#2563eb; --c2:#1d4ed8 }
  .cat-offshore { --c1:#16a34a; --c2:#15803d }
  .cat-regulatory{--c1:#ea580c; --c2:#c2410c }
  .news-thumb{background:linear-gradient(135deg,var(--c1),var(--c2))}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#9ca3af;text-align:center}
  .empty svg{margin-bottom:12px}
  .empty h3{font-size:16px;color:#4b5563;font-weight:600;margin-bottom:4px}
  .empty p{font-size:14px;max-width:340px;line-height:1.55}

  /* Toolbar — wraps gracefully on narrow screens */
  .news-toolbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .news-toolbar h1{font-size:24px;font-weight:700;color:#111827;letter-spacing:-0.01em}
  .news-toolbar p{font-size:14px;color:#6b7280}
  .news-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1;justify-content:flex-end;min-width:0}
  @media (max-width:720px){
    .news-toolbar h1{font-size:20px}
    .news-toolbar p{font-size:12px}
    .news-controls{width:100%;justify-content:flex-start}
  }
  /* tablet + phone (and up to 1179px, where the controls no longer fit beside the title):
     search, sources and bookmarks on one row under the title; search takes the spare width */
  @media (max-width:1179px){
    .news-controls{flex:1 1 100%;width:100%;flex-wrap:nowrap;justify-content:flex-start}
    .news-controls .search-wrap{flex:1 1 auto;width:auto;min-width:0;max-width:none}
    .news-controls #src-wrap, .news-controls .bm-open{flex-shrink:0}
  }
  /* phone: Bookmarks as an icon button, count as a corner badge */
  @media (max-width:767px){
    .news-controls .bm-open{position:relative;width:36px;padding:0;justify-content:center}
    .news-controls .bm-open > span:not(.bm-count){display:none}
    .news-controls .bm-open .bm-count{position:absolute;top:-6px;right:-6px;border:2px solid #fff}
    html[data-theme="dark"] .news-controls .bm-open .bm-count{border-color:#0b1220}
  }
  .filter-row{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .chip-tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;font-size:12px;font-weight:600;color:#4b5563}
  .chip-x{cursor:pointer;color:#9ca3af;font-weight:700;line-height:1}
  .chip-x:hover{color:#111827}
  /* Bookmarks */
  .bm-btn{position:absolute;top:8px;right:8px;z-index:5;width:32px;height:32px;border-radius:999px;border:0;background:rgba(255,255,255,.95);color:#374151;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.15);transition:transform .15s,color .15s,background .15s}
  .bm-btn:hover{transform:scale(1.08);color:var(--brand-600,#2563eb)}
  .bm-btn.is-on{background:var(--brand-600,#2563eb);color:#fff}
  .bm-btn:focus-visible{outline:2px solid var(--brand-400,#60a5fa);outline-offset:2px}
  @media (max-width:560px){.bm-btn{width:28px;height:28px;top:6px;right:6px}.bm-btn svg{width:14px;height:14px}}
  .bm-open{height:36px;padding:0 12px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;font:inherit;font-size:14px;font-weight:500;color:#374151;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .bm-open:hover{border-color:var(--brand-300,#93c5fd);color:var(--brand-700,#1d4ed8)}
  .bm-count{min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:var(--brand-600,#2563eb);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  .bm-count[hidden]{display:none}
  .bm-drawer{position:fixed;inset:0;z-index:3000;visibility:hidden}
  .bm-drawer.open{visibility:visible}
  .bm-overlay{position:absolute;inset:0;background:rgba(15,23,42,.38);opacity:0;transition:opacity .25s ease}
  .bm-drawer.open .bm-overlay{opacity:1}
  .bm-panel{position:absolute;top:0;right:0;height:100%;width:400px;max-width:92vw;background:#fff;box-shadow:-10px 0 30px rgba(15,23,42,.16);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .bm-drawer.open .bm-panel{transform:translateX(0)}
  .bm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f3f4f6;font-size:14px;font-weight:700;color:#111827}
  .bm-head > span > svg{color:var(--brand-600,#2563eb)}
  .bm-close{border:0;background:none;cursor:pointer;color:#6b7280;padding:4px;border-radius:8px;display:inline-flex}
  .bm-close:hover{background:#f3f4f6;color:#111827}
  .bm-body{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
  .bm-item{display:flex;align-items:flex-start;gap:8px;padding:12px 8px;border-radius:8px;transition:background .15s}
  .bm-item:hover{background:#f9fafb}
  .bm-link{display:flex;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit}
  .bm-thumb{position:relative;width:72px;height:54px;border-radius:8px;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .bm-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .bm-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bm-cat{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7280}
  .bm-title{font-size:14px;font-weight:600;line-height:1.35;color:#111827;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
  .bm-link:hover .bm-title{color:var(--brand-700,#1d4ed8)}
  .bm-meta{display:flex;align-items:center;gap:4px;font-size:12px;color:#9ca3af}
  .bm-remove{width:32px;height:32px;flex-shrink:0;border:1px solid #e5e7eb;background:#fff;border-radius:8px;color:#6b7280;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
  .bm-remove:hover{color:#dc2626;border-color:#fecaca;background:#fef2f2}
  .bm-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;color:#9ca3af}
  .bm-empty h3{font-size:14px;color:#4b5563;font-weight:600;margin:12px 0 4px}
  .bm-empty p{font-size:14px;line-height:1.5;max-width:260px}
  html { scrollbar-width:thin; scrollbar-color:#1a92d1 #f3f4f6; }
  /* phone: the category dropdown is an icon button on the right; no 'Category' label */
  @media (max-width:767px){
    .filter-row{justify-content:flex-end}
    .filter-row-label{display:none}
    .filter-row .cat-btn{width:36px;min-width:0;padding:0;justify-content:center;gap:0}
    .filter-row .cat-btn .cat-cur-label, .filter-row .cat-btn .cat-chev, .filter-row .cat-btn .cat-cur-ico{display:none}
    .filter-row .cat-btn .cat-filter-ico{display:inline-flex;color:#4b5563}   /* always the filter icon on phones */
    .filter-row .cat-btn.is-filtered{border-color:var(--brand-300,#93c5fd);background:var(--brand-50,#eff6ff)}
    .filter-row .cat-btn.is-filtered .cat-filter-ico{color:var(--brand-600,#1485c5)}
    .filter-row .cat-pop{left:auto;right:0}
    /* beat the chrome's auto-generated dark colours */
    html[data-theme="dark"] .news-main .filter-row .cat-btn.is-filtered, html[data-theme="dark"] .filter-row .cat-dd .cat-btn.is-filtered{border-color:var(--brand-400,#1a92d1) !important;background-color:rgba(81,162,252,.14) !important}
    html[data-theme="dark"] .news-main .filter-row .cat-btn.is-filtered .cat-filter-ico, html[data-theme="dark"] .filter-row .cat-dd .cat-btn.is-filtered .cat-filter-ico{color:var(--brand-400,#1a92d1) !important}
  }
</style>
</head>
<body class="bg-gray-100 text-gray-900">
<div id="app" class="h-full w-full flex overflow-hidden"></div>

<script>
window.PAGE = { id:'news', title:'News', crumb:'Overview' };
window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "compact",
  "accent": "blue",
  "sidebarExpanded": false,
  "showSparklines": true
}/*EDITMODE-END*/;
</script>
<script src="shared/lucide-local.js"></script>
<script src="shared/chrome.js?v=29"></script>
<script src="news-data.js"></script>
<script src="news-page.js?v=10"></script>
</body>
</html>
