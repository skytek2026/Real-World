function positionTabPills() {
  const apply = () => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
      void pill.offsetWidth;
      setTimeout(() => pill.classList.remove('is-init'), 0);
    });
  };
  apply();
  setTimeout(apply, 60);
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(apply);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
}

function complianceBadge(status) {
  const s = (status || '').toLowerCase();
  let dot, text, bg, border;
  if (s === 'sanctioned' || s === 'high risk' || s === 'non-compliant') {
    dot = '#dc2626'; text = '#b91c1c'; bg = '#fef2f2'; border = '#fee2e2';
  } else if (s === 'warning' || s === 'under review' || s === 'flagged' || s === 'medium risk') {
    dot = '#d97706'; text = '#b45309'; bg = '#fffbeb'; border = '#fef3c7';
  } else if (s === 'ok' || s === 'compliant' || s === 'clear' || s === 'low risk') {
    dot = '#16a34a'; text = '#15803d'; bg = '#f0fdf4'; border = '#dcfce7';
  } else {

  }
  return `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold" style="background:${bg};color:${text};border:1px solid ${border};">`
    + `<span class="w-1.5 h-1.5 rounded-full" style="background:${dot};"></span>${status}</span>`;
}

function vdAnimateRiskPie(prev) {
  const C = 289.03, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const arc = document.querySelector('.vd-rs-arc'), num = document.querySelector('.vd-rs-num');
  const gauge = arc && arc.closest('.co-rs-gauge');
  if (!arc || reduce) return;
  const to = +arc.dataset.score, toDash = arc.getAttribute('stroke-dasharray'), toColor = arc.getAttribute('stroke');
  arc.style.transition = 'none';
  arc.setAttribute('stroke-dasharray', (Math.min(prev.score,100)/100*C).toFixed(2) + ' ' + C);
  arc.setAttribute('stroke', prev.color);
  if (gauge) { gauge.classList.add('co-rs-gauge--still'); gauge.classList.toggle('co-rs-gauge--sanc', !state.withSanctionsCopy8); }
  arc.getBoundingClientRect();
  requestAnimationFrame(() => {
    arc.style.transition = 'stroke-dasharray .7s cubic-bezier(.22,1,.36,1), stroke .5s ease';
    arc.setAttribute('stroke-dasharray', toDash);
    arc.setAttribute('stroke', toColor);
    if (gauge) { gauge.classList.remove('co-rs-gauge--still'); gauge.classList.toggle('co-rs-gauge--sanc', !!state.withSanctionsCopy8); }
  });
  if (num) {
    const t0 = performance.now(), D = 700, from = prev.score;
    const step = now => { const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      num.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    num.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'ease-out' });
  }
}

function stsDrawerEl() {
  let el = document.getElementById('sts-fdrawer');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'sts-fdrawer'; el.className = 'ds-fdrawer'; el.setAttribute('aria-hidden', 'true');
  el.innerHTML = `<div class="ds-fdrawer-scrim" data-sts-act="done"></div><div class="ds-fdrawer-panel" role="dialog" aria-modal="true" aria-label="Ship-To-Ship filters"><div class="ds-fdrawer-head">Filters<button type="button" class="ds-fdrawer-close" data-sts-act="done" aria-label="Close filters"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div id="sts-fdrawer-inner" style="display:flex;flex-direction:column;flex:1;min-height:0"></div></div>`;
  document.body.appendChild(el);
  const upd = () => { render(); document.getElementById('sts-fdrawer-inner').innerHTML = stsDrawerBody(); };

    upd();

    const c = e.target;
    if (c.dataset.stsF) state.stsF = { ...state.stsF, [c.dataset.stsF]: c.checked };

  return el;
}

const HIST_PER = 3;

function trpMonth(firstIso, showPrev, showNext) {

  const lead = f.getUTCDay(), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const t = _trp, lo = t.pending ? [t.start, t.hover || t.start].sort()[0] : t.start, hi = t.pending ? [t.start, t.hover || t.start].sort()[1] : t.end;

function drawTrackCalendar() {

function wireTimeline() {
  const slider = document.getElementById('timeline-slider');
  const fill   = document.getElementById('timeline-fill');
  const thumb  = document.getElementById('timeline-thumb');
  const tsEl   = document.getElementById('timeline-timestamp');
  if (!slider || !fill || !thumb) return;

  const startMs = new Date(state.trackRange.start + 'T00:00:00Z').getTime();
  const endMs   = new Date(state.trackRange.end + 'T23:59:59Z').getTime();
  const histCal = document.getElementById('hist-cal-btn');
  if (histCal) histCal.onclick = e => { e.stopPropagation(); if (document.getElementById('trp')) { closeTrackCalendar(); return; } openTrackCalendar(histCal); };

  function interpolateRoute(t) {
    const route = window._vesselRoute;
    if (!route) return null;
    t = Math.max(0, Math.min(1, t));
    const total = route.length - 1;
    const pos   = t * total;
    const idx   = Math.floor(pos);
    const frac  = pos - idx;
    const a = route[Math.min(idx, route.length - 1)];
    const b = route[Math.min(idx + 1, route.length - 1)];
    return [a[0] + (b[0] - a[0]) * frac, a[1] + (b[1] - a[1]) * frac];
  }

  function formatTs(t) {
    const d = new Date(startMs + t * (endMs - startMs));
    return d.toUTCString().replace('GMT', 'GMT');
  }

  const updatePos = (pct) => {
    state.timelinePos = Math.max(0, Math.min(1, pct));
    fill.style.width  = (state.timelinePos * 100) + '%';
    thumb.style.left  = (state.timelinePos * 100) + '%';
    if (tsEl) tsEl.textContent = formatTs(state.timelinePos);
    slider.setAttribute('aria-valuenow', Math.round(state.timelinePos * 100));
    slider.setAttribute('aria-valuetext', formatTs(state.timelinePos));
    const pb = document.getElementById('timeline-prev'), nb = document.getElementById('timeline-next');
    if (pb) pb.disabled = state.timelinePos <= 0;
    if (nb) nb.disabled = state.timelinePos >= 1;
    // Move vessel marker
    if (window._vesselMarker) {
      const pos = interpolateRoute(state.timelinePos);
      if (pos) {
        window._vesselMarker.setLatLng(pos);
        const r = window._vesselRoute, n = r.length - 1, i = Math.min(n - 1, Math.floor(state.timelinePos * n));
        const a = r[i], b = r[i + 1], lat = (a[0] + b[0]) / 2 * Math.PI / 180;
        const brg = Math.atan2((b[1] - a[1]) * Math.cos(lat), b[0] - a[0]) * 180 / Math.PI;
        const el = window._vesselMarker.getElement()?.querySelector('.vd-vessel');
        if (el) el.style.transform = `rotate(${brg}deg)`;
      }
    }
  };

  updatePos(state.timelinePos);

  const STEP = Math.min(1, 3600000 / Math.max(1, endMs - startMs)); // 1 hour
  const step = dir => updatePos(Math.round((state.timelinePos + dir * STEP) / STEP) * STEP);
  const hold = (btn, dir) => {
    if (!btn) return;
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    btn.onpointerdown = e => { e.preventDefault(); step(dir); t1 = setTimeout(() => { t2 = setInterval(() => step(dir), 90); }, 400); };
    ['pointerup','pointerleave','pointercancel'].forEach(ev => btn.addEventListener(ev, stop));
    btn.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); step(dir); } };
  };
  hold(document.getElementById('timeline-prev'), -1);
  hold(document.getElementById('timeline-next'), 1);
  slider.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); step(1); }
    else if (e.key === 'Home') { e.preventDefault(); updatePos(0); }
    else if (e.key === 'End') { e.preventDefault(); updatePos(1); }
  });
  updatePos(state.timelinePos);

  const onDrag = (clientX) => {
    const rect = slider.getBoundingClientRect();
    updatePos((clientX - rect.left) / rect.width);
  };

  slider.addEventListener('mousedown', (e) => {
    onDrag(e.clientX);
    const onMove = (e) => onDrag(e.clientX);
    const onUp   = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Touch support
  slider.addEventListener('touchstart', (e) => {
    onDrag(e.touches[0].clientX);
    const onMove = (e) => onDrag(e.touches[0].clientX);
    const onEnd  = () => { slider.removeEventListener('touchmove', onMove); slider.removeEventListener('touchend', onEnd); };
    slider.addEventListener('touchmove', onMove);
    slider.addEventListener('touchend', onEnd);
  }, { passive: true });
}

      render();
      const m = document.querySelector('[data-assoc-filter-menu]');
      if (m) m.classList.remove('hidden');
    };
  });
  wireTab('data-bottom-left-tab', 'bottomLeftTab');
  const sectionTabSel = document.getElementById('section-tab-mobile-sel');
  if (sectionTabSel) sectionTabSel.onchange = () => { state.sectionTab = sectionTabSel.value; render(); };
  const bottomLeftTabSel = document.getElementById('bottom-left-tab-mobile-sel');
  if (bottomLeftTabSel) bottomLeftTabSel.onchange = () => { state.bottomLeftTab = bottomLeftTabSel.value; render(); };
  document.querySelectorAll('[data-sts-open]').forEach(b => b.onclick = ev => { ev.stopPropagation(); state.stsOpen = state.stsOpen === b.dataset.stsOpen ? null : b.dataset.stsOpen; render(); });
  document.querySelectorAll('[data-sts-facet]').forEach(m => m.onclick = ev => ev.stopPropagation());
  document.querySelectorAll('[data-sts-f]').forEach(c => c.onchange = () => { state.stsF = { ...state.stsF, [c.dataset.stsF]: c.checked }; render(); });
  document.querySelectorAll('[data-sts-dist]').forEach(r => r.onchange = () => { state.stsF = { ...state.stsF, dist: r.dataset.stsDist }; render(); });
  document.querySelectorAll('[data-bottom-right-tab]').forEach(b => b.addEventListener('click', () => { if (state.brTab === b.dataset.bottomRightTab) return; state.brTab = b.dataset.bottomRightTab; render(); }));
  const stsFilterBtn = document.getElementById('sts-filter-btn');
  if (stsFilterBtn) stsFilterBtn.onclick = ev => { ev.stopPropagation(); stsDrawerOpen(); };
  const stsReset = document.getElementById('sts-reset');
  if (stsReset) stsReset.onclick = () => { state.stsF = { ports:false, clusters:false, chains:false, dist:'' }; state.stsOpen = null; render(); };
  if (!window.__stsDocWired) { window.__stsDocWired = true;
    document.addEventListener('click', () => { if (state.stsOpen) { state.stsOpen = null; render(); } });
    document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && state.stsOpen) { state.stsOpen = null; render(); } });
  }
  document.querySelectorAll('[data-sc-toggle]').forEach(b => b.onclick = () => {
    const i = +b.dataset.scToggle;
    state.scExpanded.has(i) ? state.scExpanded.delete(i) : state.scExpanded.add(i);
    render();
    // Table and phone cards both carry this toggle; return focus to the one that is showing.
    [...document.querySelectorAll(`[data-sc-toggle="${i}"]`)].find(el => el.offsetParent !== null)?.focus();
  });
  if (!window.__defectsWired) { window.__defectsWired = true;
    document.addEventListener('click', ev => {
      const a = ev.target.closest('.defects-link'); if (!a) return;
      ev.preventDefault();
      const r = INSPECTIONS.find(x => x.date === a.dataset.defects); if (!r || !window.InspectionDefectsModal) return;
      InspectionDefectsModal.open({
        vessel: VESSEL.name, vesselHref: '#',
        date: r.date, followup: false, authorisation: r.psc || '—',
        port: r.port, country: r.country, detained: r.detained.replace(' Days', ''),
        defects: (INSPECTION_DEFECTS[r.date] || []).map(i => DEFECT_CATALOG[i]),
      });
    });
  }
  wireHistList();
  const envSw = document.getElementById('env-enabled-sw');
  if (envSw) envSw.onclick = () => { state.envEnabled = !state.envEnabled; render(); document.getElementById('env-enabled-sw')?.focus(); };
  const envSel = document.getElementById('env-period-sel');
  if (envSel) envSel.onchange = () => { state.envPeriod = envSel.value; render(); };
  // Casualty expand/collapse
  document.querySelectorAll('[data-casualty]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty'));
      if (state.casualtyExpanded.has(i)) state.casualtyExpanded.delete(i);
      else state.casualtyExpanded.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy'));
      if (state.casualtyExpandedCopy.has(i)) state.casualtyExpandedCopy.delete(i);
      else state.casualtyExpandedCopy.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy2]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy2'));
      if (state.casualtyExpandedCopy2.has(i)) state.casualtyExpandedCopy2.delete(i);
      else state.casualtyExpandedCopy2.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy3]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy3'));
      if (state.casualtyExpandedCopy3.has(i)) state.casualtyExpandedCopy3.delete(i);
      else state.casualtyExpandedCopy3.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy4]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy4'));
      if (state.casualtyExpandedCopy4.has(i)) state.casualtyExpandedCopy4.delete(i);
      else state.casualtyExpandedCopy4.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-sort-copy5]').forEach(btn => {
    btn.onclick = () => {
      const col = btn.getAttribute('data-casualty-sort-copy5');
      const s = state.casualtySortCopy5;
      if (s.col === col) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
      else { s.col = col; s.dir = col === 'date' ? 'desc' : 'asc'; }
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy5]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy5'));
      if (state.casualtyExpandedCopy5.has(i)) state.casualtyExpandedCopy5.delete(i);
      else state.casualtyExpandedCopy5.add(i);
      render();
    };
  });
  document.querySelectorAll('[data-casualty-copy6]').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute('data-casualty-copy6'));
      if (state.casualtyExpandedCopy6.has(i)) state.casualtyExpandedCopy6.delete(i);
      else state.casualtyExpandedCopy6.add(i);
      render();
    };
  });
  requestAnimationFrame(positionTabPills);
  window.addEventListener('resize', positionTabPills, { passive: true });
  // Inject icons after chrome loads
  if (window.I) {
    document.querySelectorAll('[data-icon]').forEach(el => {
      const iconName = el.getAttribute('data-icon');
      if (window.I[iconName]) {
        el.innerHTML = window.I[iconName];
      }
    });
  }
  setTimeout(initMap, 50);
  setTimeout(wireTimeline, 100);
};
window.render();
</script>
<style id="__om-edit-overrides">
  [data-top-tab="Vessel Details"] > .ds-tab-label { font-size: 12px !important; }
  [data-top-tab="Company Details"] > .ds-tab-label { font-size: 12px !important; }
  [data-top-right-tab="Casualty Data"] > .ds-tab-label { font-size: 12px !important; }
  [data-top-right-tab="Risk Score"] > .ds-tab-label { font-size: 12px !important; }
</style>
</body>
</html>
