  .ds-th-sort{width:100%;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted,#6B7280);padding:9px 12px;background:transparent;border:0;cursor:pointer;text-align:left;white-space:nowrap;transition:color .12s ease,background .12s ease}

  .acard { padding: 14px 16px; border-bottom: 1px solid #eef2f7; display: flex; flex-direction: column; gap: 12px; }

  .acard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .acard-id { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .acard-title { font-size: 16px; font-weight: 700; line-height: 1.25; word-break: break-word; }

  .acard-sub-txt { color: #64748b; }
  .acard-dot { color: #cbd5e1; }

  .filter-btn.edit-cols { font-weight: 600; color: #0f172a; border-color: #cbd5e1; }

  .filter-menu-act { flex: 1; padding: 5px 8px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; font-size: 11.5px; font-weight: 600; color: #475569; cursor: pointer; }
  .filter-menu-act:hover { background: #f8fafc; border-color: #93c5fd; color: var(--brand-700, #1d4ed8); }

  .filter-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 7px 10px; border: 0; border-radius: 6px; background: transparent; font-size: 12.5px; font-weight: 500; color: #334155; cursor: pointer; white-space: nowrap; }

  /* --- Filter drawer --- */
  .filter-drawer { position: fixed; inset: 0; z-index: 300; visibility: hidden; }
  .filter-drawer.open { visibility: visible; }
  .filter-drawer .drawer-overlay { position: absolute; inset: 0; background: rgba(15,23,42,.38); opacity: 0; transition: opacity .25s ease; }
  .filter-drawer.open .drawer-overlay { opacity: 1; }
  .filter-drawer .drawer-panel { position: absolute; top: 0; right: 0; height: 100%; width: 360px; max-width: 92vw; background: #fff; box-shadow: -10px 0 30px rgba(15,23,42,.16); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }

  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eef2f7; font-size: 15px; font-weight: 700; color: #0f172a; }
  .drawer-close { border: 0; background: none; cursor: pointer; color: #64748b; padding: 5px; border-radius: 7px; display: inline-flex; }
  .drawer-close:hover { background: #f1f5f9; color: #0f172a; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 4px 18px 12px; display: flex; flex-direction: column; }
  .drawer-section { padding: 16px 0; border-bottom: 1px solid #f1f5f9; flex: 0 0 auto; transition: padding .2s ease; }
  .drawer-section:not(.open) { padding: 11px 0; }

  .drawer-acc-body { display: none; padding-top: 12px; }

  .fdrop-item{padding:8px 12px;font-size:12px;color:#334155;cursor:pointer;display:flex;align-items:center;gap:8px}.fdrop-item:hover{background:#f8fafc}.fdrop-item.fsel{color:var(--brand-600,#2563eb);font-weight:600;background:#eff6ff}
  /* Pagination / action */
  .pgbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#334155;cursor:pointer;transition:background .1s}
  .pgbtn:hover:not([disabled]){background:#f1f5f9}.pgbtn[disabled]{opacity:.4;cursor:not-allowed}
  .actbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#94a3b8;cursor:pointer;transition:background .1s,color .1s,border-color .1s}
  .actbtn:hover{background:#f1f5f9;color:#334155;border-color:#cbd5e1}
</style>

function sortIcon(col) {
  return window.dsSortInd(ST.sortCol === col, ST.sortDir === 'asc');
}

function typeBadge(type) {
  const key = {'Shipping Company':'shipping','Investment Company':'investment','Energy Company':'energy','Conglomerate':'conglomerate'}[type] || 'shipping';
  return `<span class="tbadge tb-${key}">${type}</span>`;
}

function activeDot() {
  return `<span style="width:6px;height:6px;border-radius:50%;background:var(--brand-600,#2563eb);display:inline-block;margin-left:2px;vertical-align:middle;flex-shrink:0"></span>`;
}

const FLEET_B = [['lt20','1 – 20',0,20],['20to50','21 – 50',21,50],['50to100','51 – 100',51,100],['gt100','100+',101,1e9]];
const EST_B   = [['pre1970','Before 1970',0,1969],['1970to1990','1970 – 1990',1970,1990],['1990to2010','1991 – 2010',1991,2010],['post2010','After 2010',2011,9999]];
const CO_FILTERS = [
  { key:'type',    label:'Company Type', opts:() => COMPANY_TYPES.map(t => [t, t]) },
  { key:'country', label:'Country',      opts:() => COUNTRIES.map(c => [c, c]) },
  { key:'status',  label:'Status',       opts:() => [['Active','Active'],['Inactive','Inactive']] },
  { key:'fleet',   label:'Assets',   opts:() => FLEET_B.map(b => [b[0], b[1]]) },
  { key:'est',     label:'Established',  opts:() => EST_B.map(b => [b[0], b[1]]) },
];
const coFilterActive = k => ST.f[k] !== null;
const coAnyFilter = () => Object.keys(ST.f).some(coFilterActive);

/* ── Filtering & sorting ──────────────────────────────────────────────────── */
function getFiltered() {
  let rows = [...COMPANIES];
  const q = ST.query.trim().toLowerCase();
  if (q) rows = rows.filter(c =>
    c.name.toLowerCase().includes(q) || c.hq.toLowerCase().includes(q) || c.reg.toLowerCase().includes(q)
  );
  const F = ST.f;
  if (F.type)    rows = rows.filter(c => F.type.has(c.type));
  if (F.country) rows = rows.filter(c => F.country.has(c.country));
  if (F.status)  rows = rows.filter(c => F.status.has(c.status));
  if (F.fleet)   rows = rows.filter(c => FLEET_B.some(b => F.fleet.has(b[0]) && c.fleet >= b[2] && c.fleet <= b[3]));
  if (F.est)     rows = rows.filter(c => EST_B.some(b => F.est.has(b[0]) && c.est >= b[2] && c.est <= b[3]));
  if (ST.sortCol) {
    const numCols = new Set(['fleet','est','employees']);
    rows.sort((a, b) => {
      let va = ST.sortCol === 'fleetVal' ? a.fleetM : a[ST.sortCol];
      let vb = ST.sortCol === 'fleetVal' ? b.fleetM : b[ST.sortCol];
      if (!numCols.has(ST.sortCol) && ST.sortCol !== 'fleetVal') { va = String(va).toLowerCase(); vb = String(vb).toLowerCase(); }
      return (va < vb ? -1 : va > vb ? 1 : 0) * (ST.sortDir === 'asc' ? 1 : -1);
    });
  }
  return rows;
}

          </div>
          <button class="filter-btn edit-cols${hasFilter ? ' has-filter' : ''}" id="co-filter-btn" title="Filter" aria-label="Filter" aria-haspopup="dialog" style="height:34px;padding:0 10px;flex-shrink:0">${SVG.filter}</button>

              <th scope="col" class="ds-th--sortable${ST.sortCol === 'country' ? ' ds-th--active' : ''}" data-sort="country" aria-sort="${ST.sortCol === 'country' ? (ST.sortDir === 'asc' ? 'ascending' : 'descending') : 'none'}" style="min-width:145px"><button type="button" class="ds-th-sort"><span>Country</span>${sortIcon('country')}</button></th>

window.__coCompare = function(i) {
  const co = COMPANIES[i]; if (!co) return;
  try {
    const slug = co.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '.com';
    sessionStorage.setItem('compareCompany', JSON.stringify({
      name: co.name, type: co.type || '—', country: co.country || '—', flag: co.flag || '', code: co.reg || '—',
      fleet: co.fleet || 0, fleetVal: co.fleetVal || '—', risk: co.avgRisk !== undefined ? co.avgRisk : 55,
      hq: co.hq || '—', established: co.est || '—', countryControl: co.country || '—', countryDomicile: co.country || '—',
      website: co.website || slug, compliance: co.sanctioned ? 'Sanctioned' : 'Not Sanctioned',
    }));
    sessionStorage.setItem('reportsTab', 'comp');
  } catch (e) {}
  window.location.href = 'Reports.html';
};

/* ── Wire interactions ────────────────────────────────────────────────────── */
let _coMain = null;
let _outsideClickBound = false;

/* ── Filter drawer ── */
let coDrawerOpen = 0;
function coDrawerSections() {
  return CO_FILTERS.map((f, i) => {
    const set = ST.f[f.key], active = set !== null, isNone = set && set.size === 0;
    const items = f.opts().map(([v, l]) => `<label class="filter-menu-item"><input type="checkbox" class="co-cb" data-fk="${f.key}" value="${v}" ${set === null || set.has(v) ? 'checked' : ''}><span>${l}</span></label>`).join('');
    const open = i === coDrawerOpen;
    return `<div class="drawer-section${open ? ' open' : ''}"><button type="button" class="drawer-acc-head" aria-expanded="${open}"><span class="drawer-sec-title">${f.label}${active ? ' <span class="drawer-dot"></span>' : ''}</span><svg class="drawer-acc-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg></button><div class="drawer-acc-body"><div class="filter-menu-head"><button class="filter-menu-act" data-fk="${f.key}" data-fm-act="all"${active ? '' : ' disabled'}>Reset</button><button class="filter-menu-act" data-fk="${f.key}" data-fm-act="none"${isNone ? ' disabled' : ''}>Unselect all</button></div><div class="filter-menu-list scroll-thin">${items}</div></div></div>`;
  }).join('');
}
function ensureCoDrawer() {
  if (document.getElementById('filter-drawer')) return;
  const d = document.createElement('div');
  d.id = 'filter-drawer'; d.className = 'filter-drawer'; d.setAttribute('aria-hidden', 'true');
  d.innerHTML = `<div class="drawer-overlay" id="drawer-overlay"></div><aside class="drawer-panel" role="dialog" aria-label="Filters"><div class="drawer-head"><span>Filters</span><button class="drawer-close" id="drawer-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="drawer-body scroll-thin" id="drawer-body"></div><div class="drawer-foot"><button class="filter-btn reset" id="drawer-reset">Reset all</button><button class="filter-btn edit-cols" id="drawer-done">Done</button></div></aside>`;
  document.body.appendChild(d);
  d.querySelector('#drawer-close').onclick = closeCoDrawer;
  d.querySelector('#drawer-overlay').onclick = closeCoDrawer;
  d.querySelector('#drawer-done').onclick = closeCoDrawer;
  d.querySelector('#drawer-reset').onclick = () => { Object.keys(ST.f).forEach(k => ST.f[k] = null); coApply(); };
}
function paintCoDrawer() {
  const body = document.getElementById('drawer-body'); if (!body) return;
  const st = body.scrollTop;
  body.innerHTML = coDrawerSections();
  body.scrollTop = st;
  document.getElementById('drawer-reset').disabled = !coAnyFilter();
  body.querySelectorAll('.drawer-acc-head').forEach((h, i) => h.onclick = () => { coDrawerOpen = coDrawerOpen === i ? -1 : i; paintCoDrawer(); });
  body.querySelectorAll('.co-cb').forEach(cb => cb.onchange = () => {
    const k = cb.dataset.fk, all = CO_FILTERS.find(f => f.key === k).opts().map(o => o[0]);
    const set = ST.f[k] === null ? new Set(all) : new Set(ST.f[k]);
    cb.checked ? set.add(cb.value) : set.delete(cb.value);
    ST.f[k] = set.size >= all.length ? null : set;
    coApply();
  });
  body.querySelectorAll('.filter-menu-act').forEach(b => b.onclick = () => { ST.f[b.dataset.fk] = b.dataset.fmAct === 'all' ? null : new Set(); coApply(); });
}
function coApply() { ST.page = 1; rc(); paintCoDrawer(); }
function openCoDrawer() {
  ensureCoDrawer(); coDrawerOpen = 0; paintCoDrawer();
  const d = document.getElementById('filter-drawer');
  d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
  setTimeout(() => d.querySelector('.drawer-acc-head')?.focus(), 50);
}
function closeCoDrawer() {
  const d = document.getElementById('filter-drawer');
  if (d && d.classList.contains('open')) { d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); document.getElementById('co-filter-btn')?.focus(); }
}

function rc() {
  if (!_coMain) return;
  const hadFocus = document.activeElement && document.activeElement.id === 'co-search';
  const selS = hadFocus ? document.activeElement.selectionStart : null;
  const selE = hadFocus ? document.activeElement.selectionEnd : null;
  _coMain.innerHTML = renderPage();
  wireCompanies();
  if (hadFocus) {
    const el = document.getElementById('co-search');
    if (el) { el.focus(); try { el.setSelectionRange(selS, selE); } catch(e) {} }
  }
}

function wireCompanies() {
  /* Search */
  const si = document.getElementById('co-search');
  if (si) {
    si.addEventListener('input', e => { ST.query = e.target.value; ST.page = 1; rc(); });
    si.addEventListener('focus', e => { e.target.style.borderColor = 'var(--brand-300,#93c5fd)'; e.target.style.boxShadow = '0 0 0 3px color-mix(in srgb, var(--brand-500,#3b82f6) 14%, transparent)'; });
    si.addEventListener('blur',  e => { e.target.style.borderColor = '#e2e8f0'; e.target.style.boxShadow = ''; });
  }

  /* Column sort */
  document.querySelectorAll('.co-tbl th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const c = th.dataset.sort;
      if (ST.sortCol === c) ST.sortDir = ST.sortDir === 'asc' ? 'desc' : 'asc';
      else { ST.sortCol = c; ST.sortDir = 'asc'; }
      ST.page = 1; rc();
    });
  });

  const fb = document.getElementById('co-filter-btn');
  if (fb) fb.addEventListener('click', e => { e.stopPropagation(); openCoDrawer(); });

  /* Per page */
  const pp = document.getElementById('per-page');
  if (pp) pp.addEventListener('change', () => { ST.perPage = parseInt(pp.value); ST.page = 1; rc(); });

  /* Pagination (DS-compliant) */
  dsWirePagination(document.querySelector('.ds-pagination-wrap'), {
    onPage:    (p) => { ST.page = p; rc(); },
    onPerPage: (n) => { ST.perPage = n; ST.page = 1; rc(); },
  });

  /* Outside click closes dropdowns */
  if (!_outsideClickBound) {
    _outsideClickBound = true;
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCoDrawer(); });
  }
}

/* ── Main render ──────────────────────────────────────────────────────────── */
window.render = function() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main id="co-main" class="flex-1 min-h-0 overflow-hidden flex flex-col bg-slate-100"></main>
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  _coMain = document.getElementById('co-main');
  rc();
};

window.render();
</script>
</body>
</html>
