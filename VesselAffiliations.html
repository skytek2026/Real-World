let state = { affilTab: 'Owner' };

function tabs(items, active, attr) {
  return `
  <div class="ds-tabs" data-tab-group="${attr}">
    <span class="ds-tab-pill is-init" data-tab-pill></span>
    ${items.map(t => `
      <button ${attr}="${t.k}" aria-selected="${t.k===active}" class="ds-tab" style="font-size:12px; padding:7px 14px;">
        <span class="ds-tab-label">${t.dot}${t.k}</span>
      </button>`).join('')}
  </div>`;
}

function positionTabPills() {
  const apply = () => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      const w = aRect.width + 'px';
      const x = `translateX(${aRect.left - gRect.left}px)`;
      const settled = pill.dataset.placed === '1';
      if (!settled) pill.classList.add('is-init');
      pill.style.width = w;
      pill.style.transform = x;
      if (!settled) {
        void pill.offsetWidth;
        pill.dataset.placed = '1';
        const release = () => pill.classList.remove('is-init');
        setTimeout(release, 0);
        if (typeof requestAnimationFrame === 'function') requestAnimationFrame(release);
      }
    });
  };
  apply();
  requestAnimationFrame(apply);
  setTimeout(apply, 60);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(apply);
}

function OwnershipCard() {
  const items = AFFIL_ENTITIES.map(e => {
    const dot = e.tone === 'ok' ? '#16a34a' : e.tone === 'bad' ? '#dc2626' : e.tone === 'warn' ? '#ea580c' : '';

      ? `<span class="w-2 h-2 rounded-full shrink-0" style="background:${dot}"></span>`

          const sanctionedCount = (e.fleet || []).filter(v => v.sanctioned).length;
          const hits = e.hits ? `

                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-xs font-bold text-ink-900">${hit.source}</span>
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-red-50 text-red-700 border border-red-200">${hit.state}</span>
                  <span class="text-[11px] text-ink-600">${hit.added}</span>
                </div>
                <div class="mt-1 text-xs text-ink-700">${hit.text}</div>
              </div>`).join('')}
            </div>` : '';
          const fleet = e.fleet ? `
            <div class="mt-4 text-xs font-bold text-ink-900">Other vessels managed by this company <span class="font-semibold text-ink-500">(${e.fleet.length})</span> <span class="font-semibold text-red-600">· ${sanctionedCount} sanctioned</span></div>
            <div class="mt-2 overflow-x-auto rounded-md border border-ink-200 bg-white">
              <table class="w-full text-xs min-w-[680px]">
                <thead class="bg-ink-50">
                  <tr>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wider text-ink-500">Vessel</th>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wider text-ink-500">IMO</th>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wider text-ink-500">Type</th>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wider text-ink-500">Flag</th>
                    <th class="px-3 py-2 text-left text-[11px] font-bold uppercase tracking-wider text-ink-500">Status</th>
                  </tr>
                </thead>
                <tbody>
                  ${e.fleet.map(v => `
                  <tr class="border-b border-ink-100 last:border-0 hover:bg-brand-50">
                    <td class="px-3 py-2"><a href="VesselDetails.html" class="font-semibold text-brand-600 hover:underline">${v.name}</a></td>
                    <td class="px-3 py-2 font-mono text-ink-700">${v.imo}</td>
                    <td class="px-3 py-2 text-ink-700">${v.type}</td>
                    <td class="px-3 py-2 text-ink-700">${v.flag}</td>
                    <td class="px-3 py-2">${v.sanctioned
                      ? `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-red-50 text-red-700 border border-red-200"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Sanctioned</span>`
                      : `<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-green-50 text-green-700 border border-green-200"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>Clear</span>`}</td>
                  </tr>`).join('')}
                </tbody>
              </table>
            </div>` : '';
          return `
          <div class="mt-3">
            <div class="text-xs text-ink-500">${e.k}</div>
            <div class="mt-0.5 text-base font-bold text-ink-900">${e.name}</div>
            <div class="mt-1.5 flex items-center gap-2 text-sm font-semibold" style="color:${c.fg}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="9"/><path d="${c.icon}"/></svg>
              ${e.status}
            </div>
            <div class="mt-1.5 text-xs text-ink-600">${e.detail}</div>
            ${hits}
            ${fleet}
          </div>`;
        })()}
      </div>
  </div>`;
}

function Content() {
  return `
  <main class="flex-1 min-w-0 overflow-y-auto scroll-thin p-4">
    <div class="mb-3">
      ${(() => {
        const fromPortfolio = new URLSearchParams(location.search).get('from') === 'portfolio';
        const href = fromPortfolio ? 'MarinePortfolioAffiliations.html' : 'VesselDetails.html';
        const label = fromPortfolio ? 'BACK TO PORTFOLIO AFFILIATIONS' : 'BACK TO VESSEL';
        return `
      <a href="${href}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-600 hover:text-brand-700 tracking-micro">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        ${label}
      </a>`;
      })()}
    </div>
    ${KeyFindingsCard()}
    ${OwnershipCard()}
  </main>`;
}

window.render = function render() {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  positionTabPills();
  document.querySelectorAll('[data-affil-tab]').forEach(b => {
    b.onclick = () => {
      if (state.affilTab === b.getAttribute('data-affil-tab')) return;
      state.affilTab = b.getAttribute('data-affil-tab');
      const group = b.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === b)));
        const pill = group.querySelector('[data-tab-pill]');
        if (pill) pill.classList.remove('is-init');
        positionTabPills();
        setTimeout(render, 200);
        return;
      }
      render();
    };
  });
};
render();
</script>
</body>
</html>
