<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Individual Vessel Underwriting Report — Real World</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans:['Inter','ui-sans-serif','system-ui','sans-serif'], display:['Exo','Inter','sans-serif'] },
    colors: {
      brand: {50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2d7ffb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},
      ink:   {900:'#0f172a',800:'#1e293b',700:'#334155',600:'#475569',500:'#64748b',400:'#94a3b8',300:'#cbd5e1',200:'#e2e8f0',100:'#f1f5f9',50:'#f8fafc'},
    },
  }}};
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,.font-display{font-family:'Exo','Inter',sans-serif;letter-spacing:-.005em}
  a{color:var(--brand-600,#2d7ffb);text-decoration:none}
  a:hover{color:#1d4ed8;text-decoration:underline}
  .scroll-thin::-webkit-scrollbar{width:6px;height:6px}
  .scroll-thin::-webkit-scrollbar-track{background:transparent}
  .scroll-thin::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:999px}
  .scroll-thin::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  .tracking-micro{letter-spacing:.04em}
  .num{font-variant-numeric:tabular-nums}

  /* ── Desk + A4 page cards ─────────────────────────────────── */
  .desk{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 16px 60px}
  .page{position:relative;width:794px;min-height:1123px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 4px 18px rgba(15,23,42,.10);padding:34px 46px 52px;display:flex;flex-direction:column;gap:15px;flex-shrink:0}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding-bottom:12px;border-bottom:2px solid var(--brand-600,#2d7ffb)}
  .page-head .ph-title{font-family:'Exo','Inter',sans-serif;font-size:12px;font-weight:700;color:#0f172a;letter-spacing:.06em;text-transform:uppercase}
  .page-head .ph-meta{font-size:10.5px;color:#94a3b8;letter-spacing:.04em}
  .page-foot{position:absolute;left:46px;right:46px;bottom:20px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#94a3b8;border-top:1px solid #f1f5f9;padding-top:8px}
  .sec{display:flex;flex-direction:column;gap:8px}
  .sec-title{display:flex;align-items:center;gap:9px;font-family:'Exo','Inter',sans-serif;font-size:14px;font-weight:700;color:#0f172a}
  .sec-title svg{color:var(--brand-600,#2d7ffb);flex-shrink:0}
  .sec-note{font-size:11px;color:#64748b;line-height:1.55;text-wrap:pretty}

  /* Cover */
  .cover-mark{display:inline-flex;align-items:center;gap:9px;font-family:'Exo','Inter',sans-serif;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--brand-600,#2d7ffb);text-transform:uppercase}
  .cover-title{font-family:'Exo','Inter',sans-serif;font-size:28px;font-weight:800;color:#0f172a;line-height:1.12;letter-spacing:-.015em}
  .cover-sub{font-size:13px;color:#475569;line-height:1.6;max-width:520px;text-wrap:pretty}
  .cover-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
  .cover-meta div{padding:8px 13px;border-bottom:1px solid #f1f5f9}
  .cover-meta div:nth-child(odd){border-right:1px solid #f1f5f9}
  .cover-meta div:nth-last-child(-n+2){border-bottom:0}
  .cover-meta .k{font-size:9.5px;font-weight:600;color:#94a3b8;letter-spacing:.07em;text-transform:uppercase}
  .cover-meta .v{font-size:12.5px;font-weight:600;color:#0f172a;margin-top:2px}

  /* KPI stats */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 11px 9px;display:flex;flex-direction:column;gap:3px}
  .kpi .k{font-size:9.5px;font-weight:600;color:#64748b;letter-spacing:.06em;text-transform:uppercase;line-height:1.3}
  .kpi .v{font-family:'Exo','Inter',sans-serif;font-size:22px;font-weight:700;color:#0f172a;line-height:1.05}
  .kpi .d{font-size:10.5px;color:#64748b}
  .kpi.accent{background:var(--brand-50,#eff6ff);border-color:var(--brand-200,#bfdbfe)}
  .kpi.accent .v{color:var(--brand-700,#1d4ed8)}
  .delta-up{color:#b91c1c;font-weight:600}
  .delta-down{color:#15803d;font-weight:600}

  /* Distribution */
  .dist{display:grid;grid-template-columns:1fr 232px;gap:20px;align-items:end}
  .dist-chart{display:flex;align-items:flex-end;gap:14px;height:190px;padding:0 4px;border-bottom:1px solid #e2e8f0}
  .dist-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
  .dist-bar{width:100%;max-width:56px;border-radius:6px 6px 0 0}
  .dist-val{font-size:11px;font-weight:700;color:#0f172a}
  .dist-x{display:flex;gap:14px;padding:7px 4px 0}
  .dist-x span{flex:1;text-align:center;font-size:9.5px;font-weight:600;color:#64748b;letter-spacing:.03em}
  .legend{display:flex;flex-direction:column;gap:7px}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:11px;color:#334155}
  .legend-row .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .legend-row .lv{margin-left:auto;font-weight:700;color:#0f172a}

  /* Tables */
  .rt{width:100%;border-collapse:collapse;font-size:11.5px}
  .rt th{text-align:left;padding:8px 10px;font-size:9.5px;font-weight:600;color:#6B7280;letter-spacing:.05em;text-transform:uppercase;background:#f9fafb;border-bottom:1px solid #e5e7eb;white-space:nowrap}
  .rt td{padding:7px 10px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
  .rt tbody tr:last-child td{border-bottom:0}
  .rt td.vn{font-weight:600;color:#0f172a;white-space:nowrap}
  .rt td.r{text-align:right}
  .rt th.r{text-align:right}
  .flagimg{width:19px;height:13px;object-fit:cover;border:1px solid #e2e8f0;border-radius:2px;display:inline-block;vertical-align:-1px}

  /* Score chip */
  .score{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .sc-high{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .sc-med{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .sc-low{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
  .pill-red{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .pill-amber{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .pill-green{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .pill-blue{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
  .pill-slate{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}

  /* Indicator cards */
  .ind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .ind{border:1px solid #e2e8f0;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px}
  .ind .iv{font-family:'Exo','Inter',sans-serif;font-size:21px;font-weight:700;color:#0f172a;line-height:1}
  .ind .ik{min-height:2.7em;font-size:10px;font-weight:600;color:#64748b;letter-spacing:.05em;text-transform:uppercase;line-height:1.35}
  .ind .id{font-size:10.5px;color:#64748b;line-height:1.45}

  /* Bar list (regional concentration / war risk) */
  .bar-list{display:flex;flex-direction:column;gap:9px}
  .bl-row{display:grid;grid-template-columns:150px 1fr 96px;gap:10px;align-items:center;font-size:11.5px}
  .bl-name{color:#0f172a;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bl-track{display:block;height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden}
  .bl-fill{display:block;height:100%;border-radius:999px;background:var(--brand-600,#2d7ffb)}
  .bl-val{text-align:right;color:#334155;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* Change log */
  .chg{display:flex;flex-direction:column;gap:0;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
  .chg-row{display:grid;grid-template-columns:22px 1fr 92px;gap:11px;padding:8px 12px;border-bottom:1px solid #f1f5f9;align-items:start}
  .chg-row:last-child{border-bottom:0}
  .chg-ico{width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chg-t{font-size:12px;font-weight:600;color:#0f172a}
  .chg-d{font-size:10.5px;color:#64748b;line-height:1.5;margin-top:2px;text-wrap:pretty}
  .chg-m{font-size:10.5px;text-align:right;white-space:nowrap;padding-top:2px}

  /* Attention list */
  .att{display:flex;flex-direction:column;gap:9px}
  .att-item{border:1px solid #e2e8f0;border-left:3px solid #b91c1c;border-radius:9px;padding:9px 12px;display:grid;grid-template-columns:1fr auto;gap:9px;align-items:start}
  .att-item.amber{border-left-color:#d97706}
  .att-name{font-size:12.5px;font-weight:700;color:#0f172a}
  .att-meta{font-size:10.5px;color:#64748b;margin-top:2px}
  .att-why{font-size:11px;color:#334155;line-height:1.5;margin-top:5px;text-wrap:pretty}
  .att-act{display:flex;flex-direction:column;align-items:flex-end;gap:5px}

  /* Toolbar (screen only) */
  .doc-toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#fff;border-bottom:1px solid #e2e8f0}
  .doc-toolbar .tb-title{font-family:'Exo','Inter',sans-serif;font-size:13.5px;font-weight:700;color:#0f172a}
  .doc-toolbar .tb-sub{font-size:11.5px;color:#64748b}
  .tb-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
  .tb-btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .tb-btn svg{color:#64748b}


  /* ── IVU-specific ─────────────────────────────────────────── */
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  .spec{display:flex;flex-direction:column}
  .spec-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #f6f8fa}
  .spec-row:last-child{border-bottom:0}
  .spec-k{font-size:10.5px;color:#64748b;white-space:nowrap}
  .spec-v{font-size:11.5px;font-weight:600;color:#0f172a;text-align:right}
  .score-hero{display:grid;grid-template-columns:168px 1fr;gap:20px;align-items:start}
  .score-big{background:var(--brand-50,#eff6ff);border:1px solid var(--brand-200,#bfdbfe);border-radius:12px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
  .score-big .sb-num{font-family:'Exo','Inter',sans-serif;font-size:52px;font-weight:800;line-height:1;color:var(--brand-700,#1d4ed8)}
  .score-big .sb-band{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#b45309}
  .score-big .sb-sub{font-size:10.5px;color:#64748b;margin-top:4px}
  .factor-list{display:flex;flex-direction:column;gap:10px}
  .factor{display:flex;flex-direction:column;gap:4px}
  .factor .f-top{display:flex;align-items:baseline;gap:8px}
  .factor .f-k{font-size:11.5px;font-weight:600;color:#0f172a}
  .factor .f-w{font-size:10px;color:#94a3b8;margin-left:auto}
  .factor .f-v{font-size:11.5px;font-weight:700;color:#0f172a;min-width:22px;text-align:right}
  .factor .f-note{font-size:10.5px;color:#64748b;line-height:1.45}
  .spark-wrap{display:flex;flex-direction:column;gap:5px}
  .chart-wrap{border:1px solid #e2e8f0;border-radius:11px;padding:10px 12px 6px}
  .linechart{display:block;width:100%;height:auto}
  .ax-lbl{font-family:'Inter',sans-serif;font-size:9px;fill:#94a3b8;font-variant-numeric:tabular-nums}
  .pt-lbl{font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;fill:#0f172a;font-variant-numeric:tabular-nums}
  .ax-title{font-family:'Inter',sans-serif;font-size:9px;font-weight:600;fill:#64748b;letter-spacing:.05em;text-transform:uppercase}
  .spark{width:100%;height:150px;overflow:visible}
  .spark-x{display:flex;justify-content:space-between;font-size:9.5px;color:#94a3b8}
  .voy-card{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;align-items:center;border:1px solid #e2e8f0;border-radius:11px;padding:14px}
  .voy-end.r{text-align:right}
  .voy-lbl{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-600,#2d7ffb)}
  .voy-port{font-family:'Exo','Inter',sans-serif;font-size:15px;font-weight:700;color:#0f172a;margin-top:2px}
  .voy-meta{font-size:10px;color:#64748b;margin-top:2px}
  .voy-mid{display:flex;flex-direction:column;gap:7px}
  .voy-track{position:relative;height:3px;background:#e2e8f0;border-radius:999px}
  .voy-done{position:absolute;left:0;top:0;height:3px;background:var(--brand-600,#2d7ffb);border-radius:999px}
  .voy-dot{position:absolute;top:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--brand-600,#2d7ffb)}
  .voy-dot.cur{width:11px;height:11px;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--brand-200,#bfdbfe)}
  .voy-dot.end{background:#0f172a}
  .voy-mid-meta{display:flex;justify-content:space-between;font-size:10.5px;color:#64748b}
  .status-banner{border:1px solid #fde68a;background:#fffbeb;border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:6px}
  .status-banner.green{border-color:#bbf7d0;background:#f0fdf4}
  .status-banner.red{border-color:#fecaca;background:#fef2f2}
  .status-banner .sb-k{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8}
  .status-banner .sb-t{font-family:'Exo','Inter',sans-serif;font-size:17px;font-weight:700;color:#b45309;margin-top:2px}
  .status-banner .sb-d{font-size:11px;color:#475569;line-height:1.55;text-wrap:pretty}
  .pos{display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
  .pos-main{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:14px}
  .pos-coords{font-family:'Exo','Inter',sans-serif;font-size:19px;font-weight:700;color:#0f172a}
  .pos-area{font-size:11px;color:#64748b;margin-top:3px;line-height:1.45}
  .pos-status{display:flex;flex-direction:column;gap:5px;align-items:flex-start;margin-top:9px}
  @media(max-width:900px){.spec-grid{grid-template-columns:1fr}.score-hero{grid-template-columns:1fr}.voy-card{grid-template-columns:1fr}.voy-end.r{text-align:left}.pos{grid-template-columns:1fr}}

  @media(max-width:900px){
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .table-scroll .rt{min-width:640px}
    .table-scroll .rt.compact{min-width:560px}
    .doc-toolbar{flex-direction:column;align-items:stretch;gap:10px}
    .doc-toolbar>div{flex-wrap:wrap}
    .doc-toolbar>div:last-child{justify-content:flex-end}
    .page{width:100%;min-height:0;padding:26px 22px 48px}
    .page-foot{position:static;left:auto;right:auto;bottom:auto;margin-top:8px}
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .dist{grid-template-columns:1fr}
    .ind-grid{grid-template-columns:repeat(2,1fr)}
    .bl-row{grid-template-columns:110px 1fr 78px}
    .cover-meta{grid-template-columns:1fr}
  }
  @media print{
    @page{size:A4;margin:0}
    #sidebar,header.sticky,.doc-toolbar,.no-print{display:none!important}
    html,body{height:auto!important;background:#fff!important}
    #app{display:block!important;height:auto!important;overflow:visible!important}
    main{overflow:visible!important;padding:0!important;background:#fff!important}
    .desk{padding:0;gap:0}
    .page{width:210mm;height:297mm;min-height:0;border:0;border-radius:0;box-shadow:none;padding:12mm 12mm 10mm;overflow:hidden;break-after:page;page-break-after:always}
    .page:last-child{break-after:auto;page-break-after:auto}
    .page-foot{position:absolute;left:12mm;right:12mm;bottom:6mm}
    .table-scroll{overflow:visible!important}
    .table-scroll .rt,.table-scroll .rt.compact{min-width:0!important}
    .kpi,.kpi.accent,.score,.pill,.dist-bar,.bl-fill,.chg-ico,.att-item{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body class="bg-ink-100 text-ink-900" data-density="comfortable">
<div id="app" class="h-screen w-full flex overflow-hidden"></div>

<script>
  window.PAGE = { id:'reports', title:'Reports', crumb:'Individual Vessel Underwriting Report' };
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "density": "compact",
    "accent": "blue",
    "sidebarExpanded": true
  }/*EDITMODE-END*/;
</script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../shared/chrome.js?v=12"></script>
<script src="ivu-report-data.js"></script>
<script src="ivu-report-pages.js"></script>
<script>
const SC = window.sharedChrome;
window.render = function () {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main class="flex-1 overflow-y-auto scroll-thin" style="background:#f1f5f9">
        ${window.ivuReport.Toolbar()}
        <div class="desk">${window.ivuReport.Pages()}</div>
      </main>
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  if (window.lucide && lucide.createIcons) lucide.createIcons();
  const rebase = () => {
    document.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (!h || /^(?:[a-z]+:|\/\/|#|\?|\.\.\/)/i.test(h) || h.startsWith('/')) return;
      a.setAttribute('href', '../' + h);
    });
    document.querySelectorAll('img[src]').forEach(img => {
      const s = img.getAttribute('src');
      if (!s || /^(?:[a-z]+:|\/\/|\.\.\/|data:)/i.test(s) || s.startsWith('/')) return;
      img.setAttribute('src', '../' + s);
    });
  };
  document.querySelectorAll('.page .rt').forEach(t => {
    if (t.parentElement && t.parentElement.classList.contains('table-scroll')) return;
    const w = document.createElement('div');
    w.className = 'table-scroll scroll-thin';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  rebase(); setTimeout(rebase, 0);
  const pb = document.getElementById('rp-print'); if (pb) pb.onclick = () => window.print();
  const db = document.getElementById('rp-pdf');   if (db) db.onclick = () => window.print();
};
window.render();
</script>
</body>
</html>
