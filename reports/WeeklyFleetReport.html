  /* Scrollbars — DS Motion spec: 6px thin bar, brand-blue thumb on light-grey track */
  html,body,.scroll-thin,.ds-scroll,.table-scroll{scrollbar-width:thin;scrollbar-color:#51a2fc #f3f4f6}
  html::-webkit-scrollbar,body::-webkit-scrollbar,.scroll-thin::-webkit-scrollbar,.ds-scroll::-webkit-scrollbar,.table-scroll::-webkit-scrollbar{width:6px;height:6px}
  html::-webkit-scrollbar-track,body::-webkit-scrollbar-track,.scroll-thin::-webkit-scrollbar-track,.ds-scroll::-webkit-scrollbar-track,.table-scroll::-webkit-scrollbar-track{background:#f3f4f6}
  html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb,.scroll-thin::-webkit-scrollbar-thumb,.ds-scroll::-webkit-scrollbar-thumb,.table-scroll::-webkit-scrollbar-thumb{background:#51a2fc;border-radius:999px}
  html::-webkit-scrollbar-thumb:hover,body::-webkit-scrollbar-thumb:hover,.scroll-thin::-webkit-scrollbar-thumb:hover,.ds-scroll::-webkit-scrollbar-thumb:hover,.table-scroll::-webkit-scrollbar-thumb:hover{background:#2d7ffb}
  @media print{html,body,.scroll-thin,.ds-scroll,.table-scroll{scrollbar-width:auto}}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,h5,h6,.font-display{font-family:'Exo','Inter',sans-serif;letter-spacing:-.005em}
  .tracking-micro{letter-spacing:.04em}

  /* Report container — A4-ish doc shell sitting on light grey app bg */
  .report-shell{max-width:1180px;margin:0 auto;padding:18px 22px 60px;display:flex;flex-direction:column;gap:14px}
  .report-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden}

  /* Section headers (compact horizontal heading bar) */
  .sec-head{padding:14px 22px;border-bottom:1px solid #f1f5f9;font-size:13px;font-weight:700;color:#0f172a;letter-spacing:.02em;text-transform:none}
  .sec-body{padding:20px 22px}

  /* Top meta bar */
  .meta-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 22px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
  .meta-item{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#475569}
  .meta-item .lbl{color:#94a3b8;font-weight:500}
  .meta-item .val{color:#0f172a;font-weight:600;font-variant-numeric:tabular-nums}
  .meta-actions{display:flex;align-items:center;gap:8px}
  .meta-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;font-size:12.5px;font-weight:600;color:#334155;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s}
  .meta-btn:hover{background:#f8fafc;border-color:#cbd5e1}
  .meta-btn svg{color:#64748b}

  /* Summary stat cards (light blue boxes) */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:8px}
  .stat-card{background:var(--brand-50,#eff6ff);border:1px solid var(--brand-100,#dbeafe);border-radius:10px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .stat-card .stat-icon{width:58px;height:58px;display:flex;align-items:center;justify-content:center;color:var(--brand-600,#2563eb);background:var(--brand-100,#dbeafe);border-radius:999px;margin-bottom:6px}
  .stat-card .stat-num{font-family:'Exo','Inter',sans-serif;font-size:30px;font-weight:700;color:var(--brand-700,#1d4ed8);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .stat-card .stat-label{font-size:11.5px;font-weight:500;color:#475569}
  @media(max-width:760px){ .stat-grid{grid-template-columns:repeat(2,1fr)} }

  /* Vessel list table */
  .v-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .v-table th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:var(--text-muted,#6B7280);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border-default,#E5E7EB);white-space:nowrap}
  .v-table td{padding:11px 12px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
  .v-table tr:last-child td{border-bottom:0}
  .v-table tr:hover td{background:#f8fafc}
  .v-table td.vname a{color:var(--brand-600,#2563eb);font-weight:700;letter-spacing:.02em;text-decoration:none;font-size:12.5px}
  .v-table td.vname a:hover{text-decoration:underline}
  .v-table .imo{color:#475569;font-variant-numeric:tabular-nums}
  .v-table .alerts-cell{color:#0f172a;font-weight:700;font-variant-numeric:tabular-nums}
  .v-table tr.v-group td{background:#f1f5f9;color:#0f172a;font-weight:700;font-size:11.5px;letter-spacing:.02em;padding:9px 12px;border-bottom:1px solid #e2e8f0;border-top:1px solid #e2e8f0}
  .v-table tr.v-group:first-child td{border-top:0}
  .v-table .flag-cell{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#334155}
  .v-table .flag-img{width:22px;height:16px;object-fit:cover;border:1px solid #e2e8f0;border-radius:2px;flex-shrink:0;display:block}

  /* Alert Type Summary table — header matches system table style */
  .alert-table{width:100%;border-collapse:collapse;font-size:13px}
  .alert-table thead th{text-align:left;padding:10px 16px;font-size:11px;font-weight:600;color:var(--text-muted,#6B7280);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border-default,#E5E7EB);white-space:nowrap}
  .alert-table thead th:last-child{width:220px}
  .alert-table tbody td{padding:12px 16px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .alert-table tbody tr:last-child td{border-bottom:0}
  .alert-table tbody tr:hover td{background:#f8fafc}
  .alert-table .at-name{display:inline-flex;align-items:center;gap:11px;color:#0f172a;font-weight:600;font-size:13px}
  .alert-table .at-name svg{width:19px;height:19px;color:#475569;flex-shrink:0}
  .alert-table .at-name [class^="icon-"]{color:#475569}
  .alert-table .at-desc{margin-top:4px;padding-left:30px;font-size:11.5px;color:#64748b;line-height:1.5;max-width:560px}
  /* Custom masked icon — inherits currentColor so it themes (blue in table, white on navy card) */
  .icon-suspicious{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-suspicious-activity) center/contain no-repeat;mask:var(--icon-alert-suspicious-activity) center/contain no-repeat}
  .icon-port-call{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-sanctioned-port-call) center/contain no-repeat;mask:var(--icon-alert-sanctioned-port-call) center/contain no-repeat}
  .ra-table .notif .ni .icon-port-call{width:17px;height:17px}
  .ra-table .notif .ni .icon-suspicious{width:17px;height:17px}
  .icon-location-sts{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-location-sts) center/contain no-repeat;mask:var(--icon-alert-location-sts) center/contain no-repeat}
  .ra-table .notif .ni .icon-location-sts{width:17px;height:17px}
  .icon-vessel-sts{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-vessel-sts) center/contain no-repeat;mask:var(--icon-alert-vessel-sts) center/contain no-repeat}
  .ra-table .notif .ni .icon-vessel-sts{width:17px;height:17px}
  .icon-loitering{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-loitering) center/contain no-repeat;mask:var(--icon-alert-loitering) center/contain no-repeat}
  .ra-table .notif .ni .icon-loitering{width:17px;height:17px}
  .icon-identity{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-identity-tampering) center/contain no-repeat;mask:var(--icon-alert-identity-tampering) center/contain no-repeat}
  .icon-flag-hopping{display:inline-block;width:23px;height:23px;flex-shrink:0;background-color:currentColor;-webkit-mask:var(--icon-alert-flag-hopping) center/contain no-repeat;mask:var(--icon-alert-flag-hopping) center/contain no-repeat}
  .alert-table .at-count{color:#0f172a;font-weight:600;font-variant-numeric:tabular-nums}
  .alert-table tr.at-flagged td:first-child{border-left:3px solid var(--brand-600,#2563eb)}

  /* Vessel details body */
  .vd-head{display:flex;align-items:flex-start;gap:14px;padding:18px 22px 8px}
  .vd-flag-block{display:flex;align-items:flex-start;gap:14px;flex:1;min-width:0}
  .vd-flag{width:46px;height:32px;border:1px solid #e2e8f0;border-radius:3px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:#f8fafc;flex-shrink:0}
  .vd-flag img{width:100%;height:100%;object-fit:cover;display:block}
  .vd-title{font-family:'Exo','Inter',sans-serif;font-size:18px;font-weight:700;color:var(--brand-600,#2563eb);letter-spacing:.01em;line-height:1.15}
  .vd-sub{font-size:11.5px;color:#64748b;margin-top:3px;line-height:1.5}
  .vd-sub .sep{margin:0 6px;color:#cbd5e1}

  /* Risk gauge block (matches VesselDetails page) */
  .vd-body{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:8px 22px 18px;align-items:flex-start}
  .risk-block{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding-top:2px}
  .risk-label{font-size:10px;font-weight:600;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;text-align:center}
  .gauge-card{background:#f8fafc;border-radius:12px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center}
  .gauge-card svg.gauge-svg{width:100%;max-width:200px;height:auto;overflow:visible}
  .gauge-pill{display:flex;align-items:center;gap:4px;margin-top:-14px;margin-bottom:2px}
  .gauge-pill .pill-lbl{font-size:10px;font-weight:700;letter-spacing:.06em}
  .risk-guide{display:flex;flex-wrap:wrap;gap:8px}
  .rg-card{border-radius:10px;padding:8px 11px;border:1px solid transparent;flex:1 1 0;min-width:0}
  .rg-card .rg-row{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px}
  .rg-card .rg-row > div{flex:0 0 auto;min-width:0}
  .rg-card .rg-ico{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rg-card .rg-name{font-size:11px;font-weight:700;line-height:1.1}
  .rg-card .rg-range{font-size:9.5px;color:#64748b;margin-top:1px}

  /* View map expander */
  .vd-mapfoot{display:flex;justify-content:center;padding:4px 22px 18px}
  .vd-mapbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--brand-200,#bfdbfe);background:var(--brand-50,#eff6ff);color:var(--brand-700,#1d4ed8);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
  .vd-mapbtn:hover{background:var(--brand-100,#dbeafe);border-color:var(--brand-300,#93c5fd)}
  .vd-mapbtn svg.chev{transition:transform .18s}
  .vd-mapbtn[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
  .vd-mapwrap{display:none;padding:0 22px 18px}
  .vd-mapwrap.is-open{display:block}
  .vd-map{position:relative;height:640px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#eef2f7}
  .vd-maptools{position:absolute;top:10px;right:10px;z-index:1000;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .vd-map:fullscreen{height:100%;border-radius:0}
  .vd-map.is-pseudo-fs{position:fixed;inset:0;width:100vw!important;height:100vh!important;z-index:9999;border-radius:0;border:0}
  body.vd-fs-lock{overflow:hidden}
  .vd-map:fullscreen .vd-maptools,.vd-map.is-pseudo-fs .vd-maptools{top:14px;right:14px}
  .vd-mapbtn-ico{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;color:#334155;cursor:pointer;box-shadow:0 1px 3px rgba(15,23,42,.12);padding:0}
  .vd-mapbtn-ico:hover{background:#f8fafc}
  .vd-layers-menu{position:absolute;top:0;right:calc(100% + 8px);z-index:1001;width:160px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(15,23,42,.16);overflow:hidden;padding:4px 0}
  .vd-layers-menu.hidden{display:none}
  .vd-layers-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;font-family:inherit;font-size:12.5px;color:#334155;background:none;border:0;cursor:pointer}
  .vd-layers-menu button:hover{background:#f8fafc}
  .vd-layers-menu button[aria-checked="true"]{font-weight:700;color:#0f172a}
  .vd-layers-menu .ck{color:var(--brand-600,#2563eb);opacity:0}
  .vd-layers-menu button[aria-checked="true"] .ck{opacity:1}
  .vd-maplegend{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;flex-wrap:wrap;gap:14px;align-items:center;max-width:calc(100% - 90px);background:rgba(255,255,255,.94);border:1px solid #e8edf3;border-radius:8px;padding:7px 10px;font-size:11px;color:#475569;box-shadow:0 2px 8px rgba(15,23,42,.1)}
  .vd-maplegend .lg{display:inline-flex;align-items:center;gap:6px}
  .vd-maplegend .sw{width:14px;height:3px;border-radius:2px;background:var(--brand-600,#2563eb)}
  .vd-maplegend .sw.amber{background:repeating-linear-gradient(to right,#f59e0b 0 5px,transparent 5px 9px)}
  .vd-maplegend .sw.dot{width:9px;height:9px;border-radius:999px;background:#16a34a}
  .vd-maplegend .sw.dot.end{background:#dc2626}
  .vd-maplegend .sw.poly{width:14px;height:10px;border-radius:2px;background:rgba(220,38,38,.14);border:1.5px solid #dc2626}
  .vd-maplegend .sw.dot.hra{background:#f59e0b}
  .vd-hra-tip{font-size:11px;font-weight:600;color:#0f172a}
  .vd-hra-tip .k{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8}
  .leaflet-tooltip.vd-hra-label{position:relative;background:#fff;border:1px solid #e2e8f0;border-radius:7px;box-shadow:0 2px 8px rgba(15,23,42,.14);padding:5px 8px;white-space:nowrap}
  .vd-hra-flag{background:#fff;border:1px solid #e2e8f0;border-radius:7px;box-shadow:0 2px 8px rgba(15,23,42,.14);padding:5px 8px;white-space:nowrap;width:auto!important;height:auto!important;z-index:650!important}
  .vd-arrow{color:var(--brand-600,#2563eb);line-height:0;z-index:400}
  .vd-arrow svg{display:block;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95))}
  @media print{ .vd-mapfoot{display:none} }

  /* Property grid */
  .prop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 28px}
  .prop{display:flex;flex-direction:column;gap:3px;min-width:0}
  .prop .pk{font-size:10.5px;font-weight:500;color:#94a3b8;letter-spacing:.01em}
  .prop .pv{font-size:12.5px;font-weight:600;color:#0f172a;line-height:1.4;word-break:break-word}
  .prop .pv.flag-val{display:inline-flex;align-items:center;gap:8px}
  .prop .pv.flag-val .flag-img{width:22px;height:16px;object-fit:cover;border:1px solid #e2e8f0;border-radius:2px;display:block;flex-shrink:0}
  @media(max-width:780px){ .vd-body{grid-template-columns:1fr} .prop-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:520px){ .prop-grid{grid-template-columns:1fr} }

  /* Vessel Details spec table (right of risk gauge) */
  .vd-spec{min-width:0}
  .vd-spec-head{font-size:11px;font-weight:700;color:#0f172a;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;padding-bottom:9px;border-bottom:1px solid #e2e8f0}
  .spec-table{width:100%;border-collapse:collapse;font-size:12.5px}
  .spec-table th{text-align:left;font-weight:500;color:#94a3b8;font-size:10.5px;letter-spacing:.01em;padding:9px 12px 9px 0;vertical-align:top;white-space:nowrap;width:1%}
  .spec-table td{padding:9px 28px 9px 0;color:#0f172a;font-weight:600;vertical-align:top;line-height:1.4;word-break:break-word}
  .spec-table tr{border-bottom:1px solid #f1f5f9}
  .spec-table tr:last-child{border-bottom:0}
  .spec-table td.flagval span{display:inline-flex;align-items:center;gap:8px}
  .spec-table td.flagval .flag-img{width:22px;height:16px;object-fit:cover;border:1px solid #e2e8f0;border-radius:2px;display:block;flex-shrink:0}

  /* Recent activity sub-block */
  .ra-wrap{border-top:1px solid #f1f5f9;padding:14px 22px 18px;background:#fcfdff}
  .ra-title{font-size:12.5px;font-weight:700;color:#0f172a;margin-bottom:10px;letter-spacing:.01em}
  .ra-table{width:100%;border-collapse:collapse;font-size:12px}
  .ra-table th{text-align:left;padding:8px 10px;font-size:10.5px;font-weight:600;color:var(--text-muted,#6B7280);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border-default,#E5E7EB);white-space:nowrap}
  .ra-table td{padding:9px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#334155}
  .ra-table tr:last-child td{border-bottom:0}
  .ra-table .notif{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:#334155;font-weight:500}
  .ra-table .notif .ni{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:#fef3c7;color:#d97706;flex-shrink:0}
  .ra-table .notif .ni svg{width:14px;height:14px}
  .ra-table .notif .ni.blue{background:var(--brand-100,#dbeafe);color:var(--brand-600,#2563eb)}
  .ra-table .notif .ni.red{background:#fee2e2;color:#dc2626}
  .ra-table .notif .ni.amber{background:#fef3c7;color:#d97706}
  .ra-table .date{color:#475569;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px}
  .ra-table .loc-cell{color:#475569;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px}
  .ra-table .dateloc-cell{font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top}
  .ra-table .dateloc-cell .dl-date{color:#475569;font-size:11.5px}
  .ra-table .dateloc-cell .dl-loc{color:#94a3b8;font-size:11px;margin-top:3px}
  .ra-table .port-sub{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:11px;color:#94a3b8;white-space:nowrap}
  .ra-table .port-sub .flag-img{width:16px;height:12px;object-fit:cover;border:1px solid #e2e8f0;border-radius:2px;display:block;flex-shrink:0}
  .ra-table .ra-note{margin-top:5px;display:flex;align-items:flex-start;gap:5px;font-size:11px;font-weight:500;color:#e07d18;line-height:1.45}
  .ra-table .ra-note svg{width:13px;height:13px;flex-shrink:0;margin-top:1px}

  /* HRA activity timelines */
  .hra-wrap{border-top:1px solid #f1f5f9;padding:14px 22px 20px;background:#fff}
  .hra-title{font-size:12.5px;font-weight:700;color:#0f172a;margin-bottom:14px;letter-spacing:.01em}
  .hra-item{display:grid;grid-template-columns:132px 1fr;align-items:stretch;border:1px solid #e8edf3;border-radius:12px;background:#fff;overflow:hidden}
  .hra-item + .hra-item{margin-top:12px}
  .hra-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 10px;border-right:1px solid #eef2f7;background:#fcfdff;text-align:center}
  .hra-side .flag-img{width:38px;height:27px;object-fit:cover;border:1px solid #e2e8f0;border-radius:3px;display:block}
  .hra-side .cn{font-size:13px;font-weight:700;color:#0f172a;line-height:1.25}
  .hra-main{display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px;padding:16px 18px 16px 8px;min-width:0}
  .hra-tl{position:relative;height:64px;min-width:0}
  .hra-seg{position:absolute;bottom:22px;height:3px;border-radius:2px}
  .hra-seg.solid{background:var(--brand-600,#2563eb)}
  .hra-seg.grey{background:#e2e8f0}
  .hra-seg.dash{background:repeating-linear-gradient(to right,#cbd5e1 0 8px,transparent 8px 16px)}
  .hra-node{position:absolute;bottom:22px;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center}
  .hra-node .dot{width:15px;height:15px;border-radius:999px;background:#fff;border:3px solid var(--brand-600,#2563eb);box-shadow:0 0 0 3px #fff}
  .hra-node.exit .dot{border-color:#dc2626}
  .hra-node.open .dot{border-color:#cbd5e1;border-width:2px}
  .hra-node .meta{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
  .hra-node .lbl{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-600,#2563eb);white-space:nowrap}
  .hra-node .lbl svg{width:12px;height:12px;flex-shrink:0}
  .hra-node.exit .lbl{color:#dc2626}
  .hra-node.open .lbl{color:#94a3b8}
  .hra-node .dt{font-size:11.5px;font-weight:500;color:#334155;font-variant-numeric:tabular-nums;white-space:nowrap}
  .hra-node.open .dt{color:#94a3b8}
  .hra-dur{position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#64748b;white-space:nowrap}
  .hra-dur svg{width:13px;height:13px;color:#94a3b8;flex-shrink:0}
  .hra-dur b{font-weight:600;color:var(--brand-700,#1d4ed8);background:var(--brand-50,#eff6ff);border-radius:6px;padding:2px 8px}
  .hra-badge{max-width:170px;font-size:11.5px;font-weight:600;line-height:1.35;border-radius:8px;padding:8px 12px;text-wrap:pretty}
  .hra-badge.done{color:#b45309;background:#fffbeb;border:1px solid #fde68a}
  .hra-badge.info{color:var(--brand-700,#1d4ed8);background:var(--brand-50,#eff6ff);border:1px solid var(--brand-200,#bfdbfe)}
  @media(max-width:640px){ .hra-item{grid-template-columns:1fr} .hra-side{flex-direction:row;justify-content:flex-start;border-right:0;border-bottom:1px solid #eef2f7;padding:10px 14px} .hra-main{grid-template-columns:1fr;padding:14px} .hra-badge{max-width:none} }

  /* Risk Indicator Descriptions (blue card) */
  .rid-card{background:linear-gradient(180deg,var(--brand-800,#1e3a8a) 0%, var(--brand-700,#1e40af) 100%);border-radius:14px;padding:22px 26px;color:#fff;box-shadow:0 1px 3px rgba(15,23,42,.08)}
  .rid-title{font-family:'Exo','Inter',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-200,#bfdbfe);margin-bottom:18px}
  .rid-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 28px}
  .rid-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:6px 4px}
  .rid-item .rid-icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px}
  .rid-item .rid-name{font-family:'Exo','Inter',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin-top:2px}
  .rid-item .rid-desc{font-size:11.5px;color:var(--brand-200,#bfdbfe);line-height:1.5;max-width:260px}
  @media(max-width:760px){ .rid-grid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:480px){ .rid-grid{grid-template-columns:1fr} }

  /* Disclaimers */
  .disc{padding:14px 22px;color:#64748b;font-size:11px;line-height:1.65}
  .disc .disc-title{font-weight:700;color:#0f172a;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
  .disc p{margin-bottom:3px}
  .disc strong{color:#334155;font-weight:600}

  /* Floating vessel navigation — appears once first vessel card is reached */
  .vessel-fnav{position:fixed;right:24px;bottom:28px;display:flex;flex-direction:column;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:5px;box-shadow:0 10px 28px rgba(15,23,42,.16);z-index:40;opacity:0;transform:translateY(10px) scale(.96);pointer-events:none;transition:opacity .22s var(--ease-out,ease),transform .22s var(--ease-out,ease)}
  .vessel-fnav.is-visible{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .vessel-fnav .fnav-btn{width:40px;height:40px;border-radius:999px;border:0;background:transparent;color:#475569;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s}
  .vessel-fnav .fnav-btn:hover{background:var(--brand-50,#eff6ff);color:var(--brand-600,#2563eb)}
  .vessel-fnav .fnav-btn:disabled{opacity:.3;cursor:default}
  .vessel-fnav .fnav-btn:disabled:hover{background:transparent;color:#475569}
  .vessel-fnav .fnav-sep{height:1px;background:#f1f5f9;margin:1px 6px}
  .vessel-fnav .fnav-list{color:var(--brand-600,#2563eb)}
  .vessel-fnav .fnav-list:hover{background:var(--brand-600,#2563eb);color:#fff}
  .vessel-fnav .fnav-btn svg{width:20px;height:20px}

  /* ---- Mobile: stack table rows (label over value) ---- */
  @media (max-width: 720px) {
    .report-shell{padding:12px 12px 56px;gap:12px}
    .sec-head{padding:12px 16px}
    .sec-body{padding:16px}
    .sec-body[style*="padding:0"]{padding:14px !important}
    .rid-card{padding:18px 16px}

    /* Meta bar: full-width action group, buttons stretch but stay inline */
    .meta-actions{width:100%;display:flex;gap:8px}
    .meta-actions .meta-btn{flex:1;justify-content:center}

    .v-table, .alert-table, .ra-table,
    .v-table tbody, .alert-table tbody, .ra-table tbody,
    .v-table tr, .alert-table tr, .ra-table tr,
    .v-table td, .alert-table td, .ra-table td { display:block; width:100%; }
    .v-table thead, .alert-table thead, .ra-table thead { display:none; }

    .v-table tr, .alert-table tr, .ra-table tr {
      border:1px solid #e2e8f0; border-radius:10px; margin:0 0 10px; padding:8px 4px; background:#fff;
    }
    .v-table tr:last-child, .alert-table tr:last-child, .ra-table tr:last-child { margin-bottom:0; }
    .v-table tr:hover td, .alert-table tbody tr:hover td, .ra-table tr:hover td { background:transparent; }

    .v-table td, .alert-table td, .ra-table td {
      border:0; padding:6px 14px;
    }
    .v-table td::before, .alert-table td::before, .ra-table td::before {
      content: attr(data-label); display:block; margin-bottom:3px;
      font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8;
    }
    /* keep the red flag accent on stacked flagged rows */
    .alert-table tr.at-flagged { border-left:3px solid var(--brand-600,#2563eb); }
    .alert-table tr.at-flagged td:first-child { border-left:0; }
    .alert-table .at-desc{padding-left:0}
    /* Alert Type Summary: stacked rows on mobile — type on top, each count its own label-left/value-right row */
    .alert-table tr{display:block}
    .alert-table td{padding:8px 14px;width:100%}
    .alert-table td:first-child{padding-top:12px}
    .alert-table .at-name{flex-wrap:wrap}
    .alert-table .at-desc{max-width:none}
    .alert-table td.at-count{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid #f5f7fa}
    .alert-table .at-count{text-align:right;font-size:14px}
    .alert-table td::before{display:none}

/* Expand each vessel's sanctioned port-call history to a fuller 6-call record.
   Deterministic (seeded by IMO) so the report is stable across renders. */
(function expandPortCalls() {
  const PORTS = ['Bandar Abbas, IR', 'Kharg Island, IR', 'Assaluyeh, IR', 'Bandar-e Mahshahr, IR', 'Sirri Island, IR', 'Nampo, KP', 'Songnim, KP', 'Wonsan, KP', 'Novorossiysk, RU', 'Primorsk, RU', 'Ust-Luga, RU', 'Nakhodka, RU', 'Tartus, SY', 'Banias, SY', 'Latakia, SY', 'Jose Terminal, VE', 'Puerto La Cruz, VE'];
  const pad = n => String(n).padStart(2, '0');
  const fmt = d => `${pad(d.getMonth() + 1)}/${pad(d.getDate())}/${d.getFullYear()}`;
  VESSELS.forEach(v => {
    const d = DETAILS[v.name];
    if (!d) return;
    let seed = parseInt(v.imo, 10) || 7919;
    const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    const existing = d.activity.filter(a => a.label === 'Sanctioned Port Call');
    const cursor = new Date(2024, 6, 1 + Math.floor(rnd() * 40));
    const calls = [];
    for (let i = 0; i < 3; i++) {
      cursor.setDate(cursor.getDate() + 9 + Math.floor(rnd() * 22));
      const arrival = new Date(cursor);
      const stay = 1 + Math.floor(rnd() * 5);
      const departure = new Date(cursor);
      departure.setDate(departure.getDate() + stay);
      cursor.setDate(cursor.getDate() + stay);
      calls.push({
        tone: 'blue', label: 'Sanctioned Port Call',
        date: `${fmt(arrival)} \u2014 ${fmt(departure)}`,
        arrival: `${fmt(arrival)} ${pad(Math.floor(rnd() * 24))}:${pad(Math.floor(rnd() * 6) * 10)} UTC`,
        departure: `${fmt(departure)} ${pad(Math.floor(rnd() * 24))}:${pad(Math.floor(rnd() * 6) * 10)} UTC`,
        port: PORTS[Math.floor(rnd() * PORTS.length)],
        detail: 'Port call detected at sanctioned port location',
      });
    }
    const first = d.activity.findIndex(a => a.label === 'Sanctioned Port Call');
    const rest = d.activity.filter(a => a.label !== 'Sanctioned Port Call');
    const merged = calls.slice(0, 3);
    d.activity = first === -1 ? rest.concat(merged) : rest.slice(0, first).concat(merged, rest.slice(first));
  });
})();

/* ─────────────────────────── Risk donut ─────────────────────────── */
function riskTier(score) {
  if (score <= 25) return { label:'GOOD',          c:'#16a34a', glow:'#86efac' };
  if (score <= 50) return { label:'AVERAGE RISK',  c:'#f97316', glow:'#fed7aa' };
  return                  { label:'BELOW AVERAGE', c:'#ef4444', glow:'#fca5a5' };
}
function RiskGauge(score) {
  const risk = riskTier(score);
  const CX = 100, CY = 108, R = 80, RO = 95, SW = 11;
  const toRad = d => d * Math.PI / 180;
  const pt    = (a, r) => [+(CX + r*Math.cos(toRad(a))).toFixed(2), +(CY + r*Math.sin(toRad(a))).toFixed(2)];
  const [sox, soy] = pt(135, RO);
  const [eox, eoy] = pt(45,  RO);
  const GAUGE_MAX = 100, GAUGE_START = 135, GAUGE_SWEEP = 270;
  const gAngle = s => GAUGE_START + (Math.min(s, GAUGE_MAX) / GAUGE_MAX) * GAUGE_SWEEP;
  const arcD = (a1, a2, r) => {
    const [x1,y1] = pt(a1, r), [x2,y2] = pt(a2, r);
    const sw = ((a2 - a1) % 360 + 360) % 360;
    return `M ${x1},${y1} A ${r},${r} 0 ${sw > 180 ? 1 : 0},1 ${x2},${y2}`;
  };
  const whiteCasing = `<path d="${arcD(gAngle(0), gAngle(GAUGE_MAX), R)}" fill="none" stroke="#ffffff" stroke-width="${SW}" stroke-linecap="butt"/>`;
  const BANDS = [[0,25,'#16a34a'],[25,50,'#d97706'],[50,100,'#dc2626']];
  const BAND_GAP = 1.4;
  const segPaths = BANDS.map(([bs, be, col], bi) => {
    const aStart = gAngle(bs) + (bi > 0 ? BAND_GAP / 2 : 0);
    const aEnd   = gAngle(be) - (bi < BANDS.length - 1 ? BAND_GAP / 2 : 0);
    const fillEnd = Math.max(bs, Math.min(score, be));
    const aFill = gAngle(fillEnd);
    let out = '';
    if (fillEnd > bs) out += `<path d="${arcD(aStart, Math.min(aFill, aEnd), R)}" fill="none" stroke="${col}" stroke-width="${SW}" stroke-linecap="butt"/>`;
    if (fillEnd < be) out += `<path d="${arcD(Math.max(aFill, aStart), aEnd, R)}" fill="none" stroke="#e5e7eb" stroke-width="${SW}" stroke-linecap="butt"/>`;
    return out;
  }).join('');
  const glowColor = score <= 25 ? '#16a34a' : score <= 50 ? '#d97706' : '#fee2e2';
  const fillTipA  = gAngle(Math.min(score, GAUGE_MAX));
  const fillTipB  = gAngle(Math.max(0, Math.min(score, GAUGE_MAX) - GAUGE_MAX * 0.08));
  const glowPath  = score > 0
    ? `<path d="${arcD(fillTipB, fillTipA, R)}" fill="none" stroke="${glowColor}" stroke-width="${SW + 8}" stroke-linecap="round" opacity="0.3"/>`
    : '';
  const gid = 'rsGlow_' + Math.random().toString(36).slice(2, 9);
  return `
  <svg class="gauge-svg" viewBox="0 0 200 192" preserveAspectRatio="xMidYMid meet">
    <defs>
      <radialGradient id="${gid}" cx="50%" cy="55%" r="42%">
        <stop offset="0%" stop-color="${risk.glow}" stop-opacity="0.55"/>
        <stop offset="100%" stop-color="${risk.glow}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse cx="100" cy="108" rx="70" ry="60" fill="url(#${gid})"/>
    ${glowPath}
    ${whiteCasing}
    ${segPaths}
    <text x="100" y="122" text-anchor="middle" font-size="52" font-weight="800" fill="#0f172a" font-family="Inter,sans-serif">${score}</text>
  </svg>`;
}
function RiskGuide(score) {
  const cards = [
    { name:'Good',       range:'0 – 25',   c:'#16a34a', bg:'#f0fdf4', bd:'#bbf7d0', icoBg:'#dcfce7',

}

function listPhrase(arr) {
  if (arr.length <= 1) return arr[0] || '';
  if (arr.length === 2) return arr[0] + ' and ' + arr[1];
  return arr.slice(0, -1).join(', ') + ', and ' + arr[arr.length - 1];
}

function buildSummary() {
  const alertCount  = ALERT_SUMMARY.reduce((s, a) => s + a.count, 0);
  const vesselCount = parseInt(REPORT_META.vesselsCount, 10) || VESSELS.length;

  const topAlertTypes = listPhrase([...ALERT_SUMMARY].sort((a, b) => b.count - a.count).slice(0, 3).map(a => a.label));

  const risks = VESSELS.map(v => DETAILS[v.name] && DETAILS[v.name].risk).filter(x => x != null);
  const avg = risks.reduce((s, r) => s + r, 0) / (risks.length || 1);
  const riskLevel = { 'GOOD': 'low', 'AVERAGE RISK': 'moderate', 'BELOW AVERAGE': 'elevated' }[riskTier(avg).label] || 'moderate';

  const vLink = 'color:var(--brand-600,#2563eb);font-weight:700;text-decoration:none';
  const watch = VESSELS.map((v, i) => ({ name: v.name, idx: i, risk: (DETAILS[v.name] && DETAILS[v.name].risk) || 0 }))
    .filter(o => o.risk > 25);
  const watchList = watch.length
    ? listPhrase(watch.map(o => `<a href="#vessel-card-${o.idx}" style="${vLink}">${o.name}</a>`))
    : 'none';

  const toneCount = { red: 0, amber: 0, blue: 0 };
  VESSELS.forEach(v => ((DETAILS[v.name] && DETAILS[v.name].activity) || [])
    .filter(a => a.label !== 'Sanctioned Port AIS Declared Destination')
    .forEach(a => { toneCount[a.tone] = (toneCount[a.tone] || 0) + 1; }));
  const domTone = Object.entries(toneCount).sort((a, b) => b[1] - a[1])[0][0];
  const dominantSeverity = { red: 'high severity', amber: 'moderate severity', blue: 'informational' }[domTone] || 'moderate severity';

  const b = (x) => `<strong style="color:#0f172a;font-weight:700">${x}</strong>`;
  return {
    p1: `This reporting period identified ${b(alertCount)} alerts across ${b(vesselCount)} vessels. The primary alert categories were ${b(topAlertTypes)}, with overall fleet risk assessed as ${b(riskLevel)}.`,
    p2: `The following vessels require continued monitoring: ${watch.length ? watchList : b('none')}. Most alerts were classified as ${b(dominantSeverity)}, with no critical operational disruptions detected unless otherwise noted.`,
  };
}

function deriveAlertLocation(a) {
  const L = a.label.toLowerCase();
  if (L.includes('compliance')) return '';
  let h = 0;
  const s = a.label + '|' + a.date;
  for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  if (L.includes('port call')) {
    const ports = ['Bandar Abbas, IR', 'Kharg Island, IR', 'Tartus, SY', 'Nampo, KP', 'Bandar-e Mahshahr, IR', 'Banias, SY', 'Jose Terminal, VE', 'Novorossiysk, RU', 'Primorsk, RU', 'Ust-Luga, RU'];
    return ports[h % ports.length];
  }
  // Lat/Long for loitering, suspicious STS, suspicious activity, sanctioned location STS (Persian Gulf / Hormuz band)
  const lat = 24 + (h % 600) / 100;          // 24.000 – 30.000 N
  const lng = 50 + ((h >>> 3) % 900) / 100;  // 50.000 – 59.000 E
  return `${lat.toFixed(3)}°N, ${lng.toFixed(3)}°E`;
}

function ActivityRow(a) {
  const ic = a.tone === 'red' ? 'red' : a.tone === 'blue' ? 'blue' : 'amber';
  const icon = a.tone === 'red'  ? ICO.actSend
            : a.tone === 'blue' ? ICO.actAnchor
            : ICO.actTri;
  // pick more themed icons by label keywords
  let chosen = icon;
  const L = a.label.toLowerCase();
  if      (L.includes('suspicious activity') || L.includes('dark')) chosen = '<span class="icon-suspicious"></span>';
  else if (L.includes('port call'))  chosen = '<span class="icon-port-call"></span>';
  else if (L.includes('loitering'))  chosen = '<span class="icon-loitering"></span>';
  else if (L.includes('location'))   chosen = '<span class="icon-location-sts"></span>';
  else if (L.includes('suspicious')) chosen = '<span class="icon-vessel-sts"></span>';
  else if (L.includes('compliance')) chosen = ICO.actFlag;
  else if (L.includes('declared'))   chosen = ICO.actTri;

  // Contextual warning note: explicit a.note, otherwise auto-added to high-severity (red) rows
  const NOTE_TRI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
  const deriveNote = () => {
    if (L.includes('sts'))                                 return 'Event occurred in a heavy GNSS jamming region (Persian Gulf)';
    if (L.includes('suspicious') || L.includes('dark'))    return 'AIS transmission gap overlaps a known spoofing corridor';
    return 'Counterparty vessel appears on the OFAC SDN list';
  };
  const noteText = a.note || (a.tone === 'red' ? deriveNote() : '');
  const loc = deriveAlertLocation(a);

  return `
  <tr>
    <td class="dateloc-cell" data-label="Date / Location"><div class="dl-date">${a.date}</div>${loc ? `<div class="dl-loc">${loc}</div>` : ''}</td>
    <td data-label="Type"><span class="notif"><span class="ni ${ic}">${chosen}</span>${a.label}</span></td>
    <td data-label="Details">${a.detail}${noteText ? `<div class="ra-note">${NOTE_TRI}<span>${noteText}</span></div>` : ''}</td>
  </tr>`;
}

function PortCallRow(a) {
  const parts = String(a.date).split(/\s*[\u2014\u2013-]\s*(?=\d)/);
  const arrival = a.arrival || (parts[0] || '\u2014').trim();
  const departure = a.departure || (parts[1] || '\u2014').trim();
  const port = a.port || deriveAlertLocation(a) || '\u2014';
  const SANCTIONED = { IR:'Iran', KP:'North Korea', RU:'Russia', SY:'Syria', VE:'Venezuela', CU:'Cuba', BY:'Belarus' };
  const m = port.match(/^(.*),\s*([A-Z]{2})$/);
  const portName = m ? m[1] : port;
  const country = m && SANCTIONED[m[2]];
  const sub = country
    ? `<div class="port-sub">Sanctioned country: ${flagImg(m[2].toLowerCase(), 40, country)}${country}</div>`
    : '';
  return `

    <td class="date" data-label="Departure Date">${departure}</td>
    <td data-label="Port"><span class="notif"><span class="ni blue"><span class="icon-port-call"></span></span>${portName}</span>${sub}</td>
  </tr>`;
}

/* HRA (High Risk Area) transits — deterministic per vessel, seeded by IMO. */
const HRA_AREAS = [
  { name:'Russia', cc:'ru' }, { name:'Iran', cc:'ir' }, { name:'North Korea', cc:'kp' },
  { name:'Syria', cc:'sy' }, { name:'Venezuela', cc:'ve' }, { name:'Gulf of Aden', cc:'ye' },
];
function vesselHRAs(v) {
  let seed = (parseInt(v.imo, 10) || 7919) ^ 0x5f3a;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')} ${String(Math.floor(rnd() * 24)).padStart(2, '0')}:${String(Math.floor(rnd() * 12) * 5).padStart(2, '0')}`;
  const count = 1 + Math.floor(rnd() * 2);
  const out = [];
  const cursor = new Date(2026, 2, 5 + Math.floor(rnd() * 30));
  for (let i = 0; i < count; i++) {
    cursor.setDate(cursor.getDate() + 20 + Math.floor(rnd() * 60));
    const entry = new Date(cursor);
    const days = 3 + Math.floor(rnd() * 12);
    const exit = new Date(cursor);
    exit.setDate(exit.getDate() + days);
    cursor.setDate(cursor.getDate() + days);
    const area = HRA_AREAS[Math.floor(rnd() * HRA_AREAS.length)];
    out.push({ area: area.name, cc: area.cc, entry: iso(entry), exit: iso(exit), days });
  }
  cursor.setDate(cursor.getDate() + 14 + Math.floor(rnd() * 30));
  const priorArea = HRA_AREAS[1 + Math.floor(rnd() * (HRA_AREAS.length - 1))];
  const priorExit = new Date(cursor);
  out.push({ area: priorArea.name, cc: priorArea.cc, entry: null, exit: iso(priorExit), days: 4 + Math.floor(rnd() * 6) });
  cursor.setDate(cursor.getDate() + 10 + Math.floor(rnd() * 20));
  const bothArea = HRA_AREAS[1 + Math.floor(rnd() * (HRA_AREAS.length - 1))];
  out.push({ area: bothArea.name, cc: bothArea.cc, entry: null, exit: null });
  cursor.setDate(cursor.getDate() + 8 + Math.floor(rnd() * 16));
  const openArea = HRA_AREAS[0];
  out.push({ area: openArea.name, cc: openArea.cc, entry: iso(cursor), exit: null });
  return out;
}

function HRATimeline(h) {
  const open  = !h.exit;
  const prior = !h.entry;
  const badge = open && prior ? 'In area at start of week \u00b7 vessel still in HRA'

              : `${h.days} days in area`;
  const head = prior ? 'dash' : 'solid';

  const tail = open ? 'dash' : prior ? 'solid' : 'grey';
  return `

    </div>
  </div>`;

/* Deterministic AIS-style track per vessel through the Strait of Hormuz, seeded from IMO. */
const HORMUZ_ROUTE = [
  [29.35, 48.95], [28.70, 49.90], [27.60, 51.30], [26.95, 53.20], [26.70, 54.60],
  [26.62, 55.55], [26.55, 56.28], [26.10, 56.60], [25.45, 56.90], [24.90, 57.40],
  [24.20, 58.30], [23.55, 59.30], [22.90, 60.40], [22.30, 61.60],
  [21.40, 60.60], [19.80, 58.60], [17.20, 56.20], [15.60, 53.90],
  [15.20, 52.40], [14.70, 50.60], [14.20, 48.80], [13.70, 47.00], [13.20, 45.20],
  [12.70, 44.20], [12.60, 43.40], [13.60, 42.70], [15.20, 41.60],
  [17.00, 40.60], [19.20, 39.30], [21.40, 38.30], [23.60, 37.20], [25.80, 36.10],
  [27.20, 34.60], [28.20, 33.60], [29.40, 32.80],
];
function vesselTrack(idx, imo) {
  let seed = parseInt(imo, 10) || (idx + 1) * 7919;
  const rnd = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const start = Math.floor(rnd() * 2);
  const pts = [];
  const route = HORMUZ_ROUTE.slice(start);
  // straight overland run across Yemen — no jitter, so it reads as an AIS anomaly
  const overland = ([lat, lng]) => lng > 44.6 && lng < 52.6 && lat > 12.9 && lat < 16.0;
  for (let i = 0; i < route.length - 1; i++) {
    const a = route[i], b = route[i + 1];
    for (let s = 0; s < 3; s++) {
      const t = s / 3;
      const inStrait = a[1] > 54.5 && a[1] < 57.2;
      const j = overland(a) && overland(b) ? 0 : inStrait ? 0.035 : 0.10;
      pts.push([
        a[0] + (b[0] - a[0]) * t + (rnd() - 0.5) * j,
        a[1] + (b[1] - a[1]) * t + (rnd() - 0.5) * j,
      ]);
    }
  }
  pts.push(route[route.length - 1].slice());
  return pts;
}

const vesselMaps = {};
const vesselTiles = {};
const VD_TILES = {
  satellite: { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', attr:'Tiles \u00a9 Esri', bg:'#0b1220' },
  street:    { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', attr:'Tiles \u00a9 Esri', bg:'#e5e7eb' },
  dark:      { url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr:'Tiles \u00a9 Esri', bg:'#0b1220' },
  light:     { url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', attr:'Tiles \u00a9 Esri', bg:'#f3f4f6' },
};
function setVesselMapType(idx, type) {
  const map = vesselMaps[idx];
  const cfg = VD_TILES[type];
  if (!map || !cfg) return;
  if (vesselTiles[idx]) map.removeLayer(vesselTiles[idx]);
  vesselTiles[idx] = L.tileLayer(cfg.url, { attribution: cfg.attr, maxZoom: 18 }).addTo(map);
  vesselTiles[idx].bringToBack();
  const el = document.getElementById(`vessel-map-${idx}`);
  if (el) el.style.background = cfg.bg;
  document.querySelectorAll(`[data-map-idx="${idx}"]`).forEach(b => {
    b.setAttribute('aria-checked', String(b.getAttribute('data-map-type') === type));
  });
}
function toggleVesselMap(idx) {
  const btn  = document.querySelector(`[data-map-toggle="${idx}"]`);
  const wrap = document.getElementById(`vessel-map-wrap-${idx}`);
  if (!btn || !wrap) return;
  const open = !wrap.classList.contains('is-open');
  wrap.classList.toggle('is-open', open);
  btn.setAttribute('aria-expanded', String(open));
  btn.querySelector('.lbl').textContent = open ? 'Hide Map' : 'View Map';
  if (!open || typeof L === 'undefined') return;
  const v = VESSELS[idx];
  if (!vesselMaps[idx]) {
    const track = vesselTrack(idx, v && v.imo);
    const map = L.map(`vessel-map-${idx}`, { scrollWheelZoom: false, attributionControl: true });
    vesselMaps[idx] = map;
    map.fitBounds(L.latLngBounds(track).pad(0.25));
    setVesselMapType(idx, 'light');
    const tools = document.querySelector(`#vessel-map-${idx} .vd-maptools`);
    if (tools) {
      L.DomEvent.disableClickPropagation(tools);
      L.DomEvent.disableScrollPropagation(tools);
      const fsBtn = tools.querySelector('[data-fs-btn]');
      const mapEl = document.getElementById(`vessel-map-${idx}`);
      if (fsBtn && mapEl) {
        const ICON_IN  = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
        const ICON_OUT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
        const syncFs = (on) => {
          fsBtn.title = on ? 'Exit fullscreen' : 'Fullscreen';
          fsBtn.innerHTML = on ? ICON_OUT : ICON_IN;
          setTimeout(() => { map.invalidateSize(); drawLeaders(); }, 140);
        };
        const setPseudo = (on) => {
          mapEl.classList.toggle('is-pseudo-fs', on);
          document.body.classList.toggle('vd-fs-lock', on);
          syncFs(on);
        };
        fsBtn.addEventListener('click', (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          if (mapEl.classList.contains('is-pseudo-fs')) return setPseudo(false);
          if (document.fullscreenElement === mapEl) { document.exitFullscreen(); return; }
          if (document.fullscreenEnabled && mapEl.requestFullscreen) {
            const p = mapEl.requestFullscreen();
            if (p && p.catch) p.catch(() => setPseudo(true));
          } else {
            setPseudo(true);
          }
        });
        document.addEventListener('keydown', (ev) => {
          if (ev.key === 'Escape' && mapEl.classList.contains('is-pseudo-fs')) setPseudo(false);
        });
        document.addEventListener('fullscreenchange', () => syncFs(document.fullscreenElement === mapEl));
      }
      const menu = tools.querySelector('.vd-layers-menu');
      tools.querySelector('[data-layers-btn]').addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        document.querySelectorAll('.vd-layers-menu').forEach(m => { if (m !== menu) m.classList.add('hidden'); });
        menu.classList.toggle('hidden');
      });
      tools.querySelectorAll('[data-map-type]').forEach(opt => {        opt.addEventListener('click', (ev) => {
          ev.preventDefault(); ev.stopPropagation();
          setVesselMapType(idx, opt.getAttribute('data-map-type'));
          menu.classList.add('hidden');
        });
      });
    }
    const jamIdx = track.map((p, i) => (p[1] > 44.4 && p[1] < 52.8 && p[0] > 12.8 && p[0] < 16.1) ? i : -1).filter(i => i >= 0);
    if (jamIdx.length > 1) {
      const a = Math.max(0, jamIdx[0] - 1), b = Math.min(track.length - 1, jamIdx[jamIdx.length - 1] + 1);
      L.polyline(track.slice(0, a + 1), { color: '#2563eb', weight: 2, opacity: .9 }).addTo(map);
      L.polyline(track.slice(b), { color: '#2563eb', weight: 2, opacity: .9 }).addTo(map);
      L.polyline(track.slice(a, b + 1), { color: '#f59e0b', weight: 2.5, opacity: .95, dashArray: '8 6' })
        .addTo(map).bindTooltip('Possible GNSS jamming \u2014 reported positions overland (Yemen)');
    } else {
      L.polyline(track, { color: '#2563eb', weight: 2, opacity: .9 }).addTo(map);
    }

    // High Risk Areas: Red Sea + Strait of Hormuz — polygons with timestamped crossings
    const HRA_ZONES = [
      { name: 'Red Sea', poly: [[28.20, 34.10], [27.20, 35.60], [22.00, 38.60], [17.50, 41.00], [13.60, 43.60], [11.40, 44.60], [11.40, 42.10], [14.60, 40.20], [19.60, 37.20], [24.60, 34.60], [27.40, 33.20]], stampBase: [2026, 6, 24, 6, 10] },
      { name: 'Strait of Hormuz', poly: [[27.40, 55.20], [27.40, 57.40], [25.20, 57.80], [24.60, 56.40], [25.60, 54.80]], stampBase: [2026, 6, 12, 21, 45] },
    ];
    const inPoly = (poly, [lat, lng]) => {
      let inside = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const [yi, xi] = poly[i], [yj, xj] = poly[j];
        if ((xi > lng) !== (xj > lng) && lat < (yj - yi) * (lng - xi) / (xj - xi) + yi) inside = !inside;
      }
      return inside;
    };
    const leaders = [];
    HRA_ZONES.forEach(z => {
      L.polygon(z.poly, { color: '#dc2626', weight: 2, dashArray: '6 5', fillColor: '#dc2626', fillOpacity: .12 })
        .addTo(map).bindTooltip(`High Risk Area \u2014 ${z.name}`);
      let entryIdx = -1, exitIdx = -1;
      for (let i = 0; i < track.length; i++) {
        const on = inPoly(z.poly, track[i]);
        if (on && entryIdx === -1) entryIdx = i;
        if (!on && entryIdx !== -1 && exitIdx === -1 && i > entryIdx) exitIdx = i - 1;
      }
      if (entryIdx === -1) return;
      if (exitIdx === -1) exitIdx = track.length - 1;
      const base = new Date(Date.UTC(z.stampBase[0], z.stampBase[1], z.stampBase[2], z.stampBase[3], z.stampBase[4]));
      const stamp = (mins) => {
        const d = new Date(base.getTime() + mins * 60000);
        const p = n => String(n).padStart(2, '0');
        return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
      };
      const legMins = Math.max(1, exitIdx - entryIdx) * 190;
      L.polyline(track.slice(entryIdx, exitIdx + 1), { color: '#dc2626', weight: 2.5, opacity: .95 })
        .addTo(map).bindTooltip(`Transit through High Risk Area \u2014 ${z.name}`);
      L.circleMarker(track[entryIdx], { radius: 6, color: '#fff', weight: 2, fillColor: '#f59e0b', fillOpacity: 1 }).addTo(map);
      L.circleMarker(track[exitIdx], { radius: 6, color: '#fff', weight: 2, fillColor: '#f59e0b', fillOpacity: 1 }).addTo(map);
      leaders.push({ at: track[entryIdx], dx: -46, dy: -34, side: 'right',
        html: `<span class="vd-hra-tip"><span class="k">${z.name} \u2014 entry</span>${stamp(0)}</span>` });
      leaders.push({ at: track[exitIdx], dx: 46, dy: 34, side: 'left',
        html: `<span class="vd-hra-tip"><span class="k">${z.name} \u2014 exit</span>${stamp(legMins)}</span>` });
    });

    /* Leader lines drawn as real map geometry so the line always meets its dot. */
    const leaderLayers = [];
    const drawLeaders = () => {
      leaderLayers.forEach(l => map.removeLayer(l));
      leaderLayers.length = 0;
      leaders.forEach(ld => {
        const p = map.latLngToContainerPoint(L.latLng(ld.at));
        const end = map.containerPointToLatLng(L.point(p.x + ld.dx, p.y + ld.dy));
        const line = L.polyline([ld.at, end], { color: '#f59e0b', weight: 1.5, dashArray: '4 3', interactive: false }).addTo(map);
        const label = L.marker(end, {
          interactive: false,
          icon: L.divIcon({ className: 'vd-hra-flag', html: ld.html, iconSize: null,
            iconAnchor: ld.side === 'right' ? [0, 15] : [1000, 15] }),
        }).addTo(map);
        // measure the rendered box so the anchor sits exactly on the line end
        const el = label.getElement();
        if (el && ld.side === 'left') {
          el.style.marginLeft = `-${el.offsetWidth}px`;
          el.style.marginTop = `-${el.offsetHeight / 2}px`;
        } else if (el) {
          el.style.marginTop = `-${el.offsetHeight / 2}px`;
        }
        leaderLayers.push(line, label);
      });
    };
    map.on('zoomend', drawLeaders);

    // Direction-of-travel arrows along the track
    for (let i = 2; i < track.length - 1; i += 4) {
      const a = track[i], b = track[i + 1];
      const pa = map.project(L.latLng(a), 6), pb = map.project(L.latLng(b), 6);
      const deg = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI;
      L.marker([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], {
        interactive: false,
        icon: L.divIcon({
          className: 'vd-arrow', iconSize: [12, 12], iconAnchor: [6, 6],
          html: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${deg}deg)"><path d="M9 5l7 7-7 7"/></svg>`,
        }),
      }).addTo(map);
    }
    L.circleMarker(track[0], { radius: 5, color: '#fff', weight: 2, fillColor: '#16a34a', fillOpacity: 1 })
      .addTo(map).bindTooltip('Track start');
    L.circleMarker(track[track.length - 1], { radius: 6, color: '#fff', weight: 2, fillColor: '#dc2626', fillOpacity: 1 })
      .addTo(map).bindTooltip(`${v ? v.name : 'Vessel'} — current position`);
    map.fitBounds(L.latLngBounds(track).pad(0.25));
    map.fitBounds(L.latLngBounds(track).pad(0.25));
    drawLeaders();
  }
  setTimeout(() => vesselMaps[idx].invalidateSize(), 60);
}
document.addEventListener('click', (e) => {
  if (e.target.closest && e.target.closest('.vd-maptools')) return;
  document.querySelectorAll('.vd-layers-menu').forEach(m => m.classList.add('hidden'));
  const b = e.target.closest && e.target.closest('[data-map-toggle]');
  if (b) toggleVesselMap(b.getAttribute('data-map-toggle'));
});

function RiskDescCard() {
  return `
  <section class="rid-card">
    <div class="rid-title">Risk Indicator Descriptions</div>
    <div class="rid-grid">
      ${RISK_INDICATORS.map(r => `
        <div class="rid-item">
          <span class="rid-icon">${r.icon}</span>
          <span class="rid-name">${r.name}</span>
          <span class="rid-desc">${r.desc}</span>
        </div>
      `).join('')}
    </div>
  </section>`;
}

function FloatingNav() {
  return `
  <div id="vessel-fnav" class="vessel-fnav no-print" role="navigation" aria-label="Vessel navigation" aria-hidden="true">
    <button class="fnav-btn" data-fnav="up" type="button" title="Previous vessel" aria-label="Previous vessel"><i data-lucide="chevron-up"></i></button>
    <span class="fnav-sep"></span>
    <button class="fnav-btn fnav-list" data-fnav="summary" type="button" title="Back to summary" aria-label="Back to summary"><i data-lucide="list"></i></button>
    <span class="fnav-sep"></span>
    <button class="fnav-btn" data-fnav="down" type="button" title="Next vessel" aria-label="Next vessel"><i data-lucide="chevron-down"></i></button>
  </div>`;
}

function DisclaimerCard() {
  return `
  <section class="report-card disc">
    <div class="disc-title">Disclaimers</div>
    <p>* Sanctioned/dark areas are areas for the distributed analysis of the following countries: Iran, Syria, North Korea, Cuba, Venezuela and Crimea (Russia).</p>
    <p>** Sanctioned countries are Iran, Syria, North Korea, Cuba, Venezuela and Crimea (Russia).</p>
    <p>*** Vessel lists is U.S. OFAC, SDN List, EU list of targets, UN Security Council Confidential list of targets or vessels flying flag of a sanctioned country.</p>
  </section>`;
}

/* ─────────────────────────── Render ─────────────────────────── */
window.render = function () {
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col overflow-hidden">
      ${SC.Topbar()}
      <main class="flex-1 overflow-y-auto scroll-thin" style="background:#f1f5f9">
        <div class="report-shell">
          ${MetaBar()}
          ${SummaryCard()}
          ${AlertTypeSummaryCard()}
          ${VesselsTableCard()}
          ${VESSELS.map(VesselDetailsCard).join('')}
          ${RiskDescCard()}
          ${DisclaimerCard()}
        </div>
      </main>
    </div>
    ${FloatingNav()}
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();

  // Render Lucide icons (summary stat metrics, etc.)
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }

  /* Floating vessel navigation: appears once the first vessel card scrolls
     near the top. Up/Down step between vessel detail cards; the list icon
     jumps back to the Summary card. */
  (function setupVesselNav() {
    const main = document.querySelector('main');
    const fnav = document.getElementById('vessel-fnav');
    if (!main || !fnav) return;
    const cards = Array.from(document.querySelectorAll('.vessel-detail-card'));
    const summary = document.getElementById('summary-card');
    if (!cards.length) return;
    const THRESHOLD = 140; // px below the scroll-viewport top that counts as "reached"

    const scrollToEl = (el) => {
      const top = main.scrollTop + (el.getBoundingClientRect().top - main.getBoundingClientRect().top) - 16;
      main.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    };
    const currentIndex = () => {
      const mt = main.getBoundingClientRect().top;
      let idx = -1;
      cards.forEach((c, i) => { if (c.getBoundingClientRect().top - mt <= THRESHOLD) idx = i; });
      return idx;
    };

    const upBtn   = fnav.querySelector('[data-fnav="up"]');
    const downBtn = fnav.querySelector('[data-fnav="down"]');
    const sumBtn  = fnav.querySelector('[data-fnav="summary"]');

    if (upBtn)   upBtn.onclick   = () => { const i = currentIndex(); scrollToEl(cards[Math.max(0, i - 1)]); };
    if (downBtn) downBtn.onclick = () => { const i = currentIndex(); if (i < cards.length - 1) scrollToEl(cards[i + 1]); };
    if (sumBtn)  sumBtn.onclick  = () => { if (summary) scrollToEl(summary); };

    const update = () => {
      const mt = main.getBoundingClientRect().top;
      const firstTop = cards[0].getBoundingClientRect().top - mt;
      const visible = firstTop <= THRESHOLD;
      fnav.classList.toggle('is-visible', visible);
      fnav.setAttribute('aria-hidden', visible ? 'false' : 'true');
      const i = currentIndex();
      if (upBtn)   upBtn.disabled   = i <= 0;
      if (downBtn) downBtn.disabled = i >= cards.length - 1;
    };
    main.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();

  /* Vessel-name links jump to that vessel's detail card within the scroll container */
  (function setupVesselLinks() {
    const main = document.querySelector('main');
    if (!main) return;
    document.querySelectorAll('.v-table a[href^="#vessel-card-"]').forEach(a => {
      a.addEventListener('click', (e) => {
        const el = document.getElementById(a.getAttribute('href').slice(1));
        if (!el) return;
        e.preventDefault();
        const top = main.scrollTop + (el.getBoundingClientRect().top - main.getBoundingClientRect().top) - 16;
        main.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      });
    });
  })();

  /* Chrome was authored for pages at the project root. We're one folder
     down, so retarget every relative link/image in the shell to '../'.
     Scope is the whole document because wireChrome() relocates the
     notification + user popovers out of <header> into <body> to escape
     the sticky stacking context. Run twice (now + next tick) in case
     anything in the chrome lazily re-renders. */
  const rebase = () => {
    document.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (!h || /^(?:[a-z]+:|\/\/|#|\?|\.\.\/)/i.test(h) || h.startsWith('/')) return;
      a.setAttribute('href', '../' + h);
    });
    document.querySelectorAll('img[src]').forEach(img => {
      const s = img.getAttribute('src');
      if (!s || /^(?:[a-z]+:|\/\/|\.\.\/|data:)/i.test(s) || s.startsWith('/')) return;
      img.setAttribute('src', '../' + s);
    });
  };
  rebase();
  setTimeout(rebase, 0);

  // Print + download wiring
  const printBtn = document.getElementById('print-btn');
  if (printBtn) printBtn.addEventListener('click', () => window.print());
  const dlBtn = document.getElementById('dl-btn');
  if (dlBtn) dlBtn.addEventListener('click', () => window.print()); // demo: print-to-PDF

  // Re-stamp page title with report period
  document.title = `Weekly Fleet Monitoring Report (${REPORT_META.periodFrom} – ${REPORT_META.periodTo}) — Real World`;
};

window.render();
</script>
</body>
