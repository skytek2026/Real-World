function filter(q) {

(async () => {
  try {
    const r = await fetch(`https://api.github.com/repos/${DATA.repo}/git/trees/${DATA.branch}?recursive=1`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) return;
    const j = await r.json(); if (j.truncated) return;
    const live = new Set(j.tree.filter(t => t.type === 'blob').map(t => t.path));
    const known = new Set(DATA.allPaths);
    const added = [...live].filter(p => !known.has(p)).sort();
    const removed = [...known].filter(p => !live.has(p)).sort();
    if (!added.length && !removed.length) return;
    const list = (arr) => `<ul>${arr.slice(0, 12).map(p => `<li><code>${esc(p)}</code></li>`).join('')}${arr.length > 12 ? `<li>and ${arr.length - 12} more</li>` : ''}</ul>`;
    const box = document.getElementById('drift');
    box.innerHTML = `<strong>This map is out of date.</strong> Files have changed on GitHub since it was built on ${esc(fmtDate(DATA.generated.slice(0, 10)))}.` +
      (added.length ? `<div style="margin-top:8px">Added (${added.length}):</div>${list(added)}` : '') +
      (removed.length ? `<div style="margin-top:8px">Removed (${removed.length}):</div>${list(removed)}` : '') +
      `<div style="margin-top:8px">Rebuild it with <code>python3 tools/build_system_map.py</code>.</div>`;
    box.classList.remove('hide');
  } catch (e) { /* offline or blocked: nothing to report */ }
})();
</script>
<style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
