<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  .text-ink-900 { color:#0f172a; }
  .text-ink-800 { color:#1e293b; }
  .text-ink-700 { color:#334155; }
  .text-ink-600 { color:#475569; }
  .text-ink-500 { color:#64748b; }
  .text-ink-400 { color:#94a3b8; }
  .text-ink-300 { color:#cbd5e1; }
  .text-ink-200 { color:#e2e8f0; }
  .text-ink-100 { color:#f1f5f9; }
  .bg-ink-100 { background:#f1f5f9; }
  .bg-ink-50 { background:#f8fafc; }
  .bg-ink-900 { background:#0f172a; }
  .border-ink-100 { border-color:#f1f5f9; }
  .border-ink-200 { border-color:#e2e8f0; }
  .shadow-card { box-shadow:0 1px 2px rgba(15,23,42,.08), 0 0 0 1px rgba(15,23,42,.02); }
  .text-brand-600 { color:#2563eb; }
  .bg-brand-600 { background:#2563eb; }
  .bg-brand-050 { background:#eff6ff; }
  /* Scrollbars — DS Motion spec: 6px thin bar, brand-blue thumb on light-grey track */
  html { scrollbar-width:thin; scrollbar-color:#51a2fc #f3f4f6; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { width:6px; height:6px; }
  html::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background:#f3f4f6; }
  html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb { background:#51a2fc; border-radius:999px; }
  html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover { background:#2d7ffb; }
  .scroll-thin, .ds-scroll { scrollbar-width:thin; scrollbar-color:#51a2fc #f3f4f6; }
  .scroll-thin::-webkit-scrollbar, .ds-scroll::-webkit-scrollbar { width:6px; height:6px; }
  .scroll-thin::-webkit-scrollbar-track, .ds-scroll::-webkit-scrollbar-track { background:#f3f4f6; }
  .scroll-thin::-webkit-scrollbar-thumb, .ds-scroll::-webkit-scrollbar-thumb { background:#51a2fc; border-radius:999px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover, .ds-scroll::-webkit-scrollbar-thumb:hover { background:#2d7ffb; }
  .tracking-micro { letter-spacing:0.04em; }
  .ring-focus:focus-visible { outline:2px solid #3b82f6; outline-offset:2px; border-radius:8px; }
  [data-density="compact"] .py-density { padding-top:.75rem; padding-bottom:.75rem; }
  [data-density="comfortable"] .py-density { padding-top:1.25rem; padding-bottom:1.25rem; }
  [data-density="compact"] .gap-density { gap:.75rem; }
  [data-density="comfortable"] .gap-density { gap:1rem; }
  /* Pill tabs (Skytek DS — animated pill via shared layout) */
  .ds-tabs { position:relative; display:inline-flex; gap:4px; padding:4px; background:#f1f5f9; border:1px solid #e2e8f0; border-radius:9999px; }
  .ds-tabs.is-stretch { display:flex; }
  .ds-tabs.is-stretch > .ds-tab { flex:1; }
  .ds-tab { position:relative; font:inherit; font-size:13px; font-weight:600; padding:8px 18px; background:transparent; border:0; border-radius:9999px; color:#64748b; cursor:pointer; transition:color 140ms ease; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; text-align:center; }
  .ds-tab:hover { color:#0f172a; }
  .ds-tab[aria-selected="true"], .ds-tab[aria-selected="true"]:hover { color:#fff; }
  .ds-tab-pill { position:absolute; top:4px; left:0; height:calc(100% - 8px); background:#2563eb; border-radius:9999px; box-shadow:0 1px 2px rgba(15,23,42,.12); z-index:0; transform:translateX(0) scaleX(1); transform-origin:left center; transition:transform 320ms cubic-bezier(.34,1.2,.64,1), width 320ms cubic-bezier(.34,1.2,.64,1); pointer-events:none; }
  .ds-tab-pill.is-init { transition:none; }
  .ds-tab-label { position:relative; z-index:1; display:inline-flex; align-items:center; gap:6px; }
  /* Leaflet custom */
  #prop-map { background:#e0ebe9; }
  #prop-map .leaflet-top.leaflet-left { top:56px; left:2px; }
  #prop-map .leaflet-top.leaflet-left .leaflet-bar { margin-left:10px !important; }
  #map-fullscreen.map-btn-fs { width:32px; height:32px; border-radius:8px !important; left:12px !important; top:12px !important; }
  .leaflet-control-zoom, .leaflet-bar { border:1px solid #e2e8f0 !important; box-shadow: 0 1px 2px rgb(15 23 42 / .08) !important; border-radius: 8px !important; overflow:hidden; }
  .leaflet-bar a { background:#fff !important; color:#334155 !important; }
  .leaflet-bar a:hover { background:#f1f5f9 !important; }
  .leaflet-control-zoom a { display:flex !important; align-items:center; justify-content:center; padding:0 !important; }
  .leaflet-control-zoom a svg { width:16px; height:16px; }
  .map-btn { width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:#fff; border:1px solid #e2e8f0; border-radius:8px; color:#334155; box-shadow: 0 1px 2px rgb(15 23 42 / .08); }
  .map-btn:hover { background:#f1f5f9; }
  .map-btn:active { background:#e2e8f0; }
  .marker-icon { position:relative; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border:2px solid #fff; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.28); color:#fff; }
  /* Property hover tooltip — name + category + location (matches Marine/Aviation dashboards) */
  .prop-tip.leaflet-tooltip {
    background:rgba(15,23,42,.93); border:0; border-radius:7px;
    box-shadow:0 3px 10px rgba(0,0,0,.4);
    padding:6px 9px; color:#fff;
    font-family:'Inter',system-ui,sans-serif;
  }
  .prop-tip.leaflet-tooltip-top::before { border-top-color:rgba(15,23,42,.93); }
  .prop-tip .ptip-row { display:flex; align-items:center; gap:6px; }
  .prop-tip .ptip-dot { width:9px; height:9px; border-radius:2px; box-shadow:0 0 0 1px rgba(255,255,255,.25); flex-shrink:0; }
  .prop-tip .ptip-name { font-weight:700; font-size:12px; letter-spacing:.01em; }
  .prop-tip .ptip-sub { display:block; font-size:11px; color:#cbd5e1; margin-top:2px; }
  .prop-tip .ptip-risk { font-weight:700; }
  /* Risk pulse — small red dot on top-right corner of the marker for properties
     flagged with an active weather/risk alert (see Southeast Financial Ctr). */
  .marker-icon .marker-pulse{
    position:absolute; top:-4px; right:-4px;
    width:11px; height:11px; border-radius:50%;
    background:#dc2626; border:2px solid #fff;
    box-shadow:0 0 0 0 rgba(220,38,38,.7);
    animation: marker-pulse 1.6s cubic-bezier(.66,0,0,1) infinite;
  }
  @keyframes marker-pulse{
    0%   { box-shadow:0 0 0 0    rgba(220,38,38,.55); }
    70%  { box-shadow:0 0 0 11px rgba(220,38,38,0);   }
    100% { box-shadow:0 0 0 0    rgba(220,38,38,0);   }
  }
  /* Property map popup */
  .prop-popup .leaflet-popup-content-wrapper { padding:0; border-radius:12px; overflow:hidden; box-shadow:0 10px 30px rgba(15,23,42,.25); }
  .prop-popup .leaflet-popup-content { margin:0; width:280px !important; font-family:'Inter',sans-serif; }
  .prop-popup .leaflet-popup-tip { background:#fff; }
  .prop-popup .leaflet-popup-close-button { color:#fff !important; top:8px !important; right:10px !important; font-size:22px !important; font-weight:300 !important; width:24px !important; height:24px !important; opacity:.85; }
  .prop-popup .leaflet-popup-close-button:hover { background:rgba(255,255,255,.2) !important; color:#fff !important; opacity:1; }
  .pp { background:#fff; color:#0f172a; }
  .pp-header { background:var(--brand-600,#2563eb); color:#fff; padding:12px 14px 10px; display:flex; align-items:flex-start; justify-content:space-between; }
  .pp-title { font-size:14px; font-weight:700; line-height:1.2; }
  .pp-cat { font-size:11px; font-weight:500; opacity:.75; margin-left:6px; }
  .pp-body { padding:4px 0; }
  .pp-row { display:flex; align-items:center; justify-content:space-between; padding:7px 14px; border-bottom:1px solid #f1f5f9; font-size:12.5px; }
  .pp-row:last-child { border-bottom:0; }
  .pp-k { color:#64748b; font-weight:500; }
  .pp-v { font-weight:600; color:#0f172a; text-align:right; }
  .pp-cta { display:block; width:calc(100% - 28px); margin:4px 14px 14px; background:transparent; color:var(--brand-600,#2563eb)!important; border:1px solid transparent; border-radius:var(--radius-md,8px); padding:0 12px; height:32px; line-height:32px; font-weight:500; font-size:13px; cursor:pointer; text-align:center; transition:background .15s; }
  .pp-cta:hover { background:var(--brand-50,#eff6ff); }

  /* DS table-header treatment for list-card column headers */
  .tracking-micro.uppercase.text-ink-500{background:var(--slate-50,#F9FAFB);color:var(--text-muted,#6B7280)}
    /* DS card footer + Tertiary/Ghost buttons (ALL CAPS) — per Skytek DS */
  .ds-card-foot{padding:10px 16px;border-top:1px solid #ECEEF2;background:#F9FAFB;display:flex;justify-content:flex-end;align-items:center;gap:8px;border-bottom-left-radius:inherit;border-bottom-right-radius:inherit;}
  .ds-card-foot--start{justify-content:flex-start;}
  .ds-card-foot--between{justify-content:space-between;}
  .ds-card-foot--center{justify-content:center;}
  .ds-card-foot button{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 5px;border-radius:6px;background:transparent;border:0;cursor:pointer;font-family:inherit;font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase;color:var(--brand-600,#2563eb);transition:background .15s,color .15s;white-space:nowrap;}
  .ds-card-foot button:hover{background:#eef2f7;color:var(--brand-700,#1d4ed8);}
</style>

<style>
/* ── Filter drawer: Skytek Design System .ds-fdrawer (07h · Filter drawer), copied from the org DS styles.css ── */
.ds-fdrawer {
  --z-drawer:1080; --fdrawer-width:360px; --fdrawer-max-width:92vw; --fdrawer-scrim:rgba(15,23,42,.38); --fdrawer-shadow:-10px 0 30px rgba(15,23,42,.16);
  --fdrawer-pad-x:18px; --fdrawer-head-pad:16px 20px; --fdrawer-slide:300ms; --fdrawer-slide-ease:cubic-bezier(.4,0,.2,1); --fdrawer-scrim-motion:250ms;
  --fdrawer-acc-motion:220ms; --fdrawer-list-max:210px; --motion-fast:140ms; --motion-base:200ms; --ease-out:cubic-bezier(.16,1,.3,1);
  --radius-sm:4px; --radius-pill:9999px; --font-display:"Exo","Inter",system-ui,sans-serif; --danger-500:#DC2626;
  --bg-surface:#FFFFFF; --bg-muted:#F3F4F6; --bg-sunken:#F9FAFB; --border-default:#E5E7EB; --border-subtle:#ECEEF2;
  --text-primary:#111827; --text-secondary:#4B5563; --text-muted:#6B7280; --shadow-focus:0 0 0 3px rgba(46,134,192,.32);
}
html[data-theme="dark"] .ds-fdrawer {
  --bg-surface:#121A2A; --bg-muted:#1B2536; --bg-sunken:#0B1220; --border-default:#2B3854; --border-subtle:#1F2A3C;
  --text-primary:#F3F4F6; --text-secondary:#9CA3AF; --text-muted:#828C9C; --shadow-focus:0 0 0 3px rgba(142,197,253,.45);
}
@keyframes ds-fdrawer-acc-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
/* ===== Filter drawer =====
   Right-edge sheet holding the full filter set for a data view.
   Distinct from the generic Drawer: narrower, single-open accordion
   sections, and LIVE-APPLY, every change re-queries immediately and
   the result is visible behind the scrim. There is no Apply button.

   Visibility (not display) is toggled so the panel can transition. */
.ds-fdrawer { position: fixed; inset: 0; z-index: var(--z-drawer); visibility: hidden; }
.ds-fdrawer.is-open { visibility: visible; }
.ds-fdrawer-scrim {
  position: absolute; inset: 0;
  background: var(--fdrawer-scrim);
  opacity: 0;
  transition: opacity var(--fdrawer-scrim-motion) var(--ease-out);
}
.ds-fdrawer.is-open .ds-fdrawer-scrim { opacity: 1; }
.ds-fdrawer-panel {
  position: absolute; top: 0; right: 0;
  height: 100%;
  width: var(--fdrawer-width);
  max-width: var(--fdrawer-max-width);
  background: var(--bg-surface);
  box-shadow: var(--fdrawer-shadow);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform var(--fdrawer-slide) var(--fdrawer-slide-ease);
}
.ds-fdrawer.is-open .ds-fdrawer-panel { transform: translateX(0); }
.ds-fdrawer-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--fdrawer-head-pad);
  border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-display);
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  flex: 0 0 auto;
}
.ds-fdrawer-close {
  border: 0; background: none; cursor: pointer;
  color: var(--text-muted); padding: 5px; border-radius: 7px;
  display: inline-flex;
  transition: background var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
}
.ds-fdrawer-close:hover { background: var(--bg-muted); color: var(--text-primary); }
.ds-fdrawer-close:focus-visible { outline: 0; box-shadow: var(--shadow-focus); }
/* Body is the accordion host. The OPEN section grows to fill it, so its
   option list scrolls instead of the whole drawer. */
.ds-fdrawer-body {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto;
  padding: 4px var(--fdrawer-pad-x) 12px;
  display: flex; flex-direction: column;
}
.ds-fdrawer-section {
  padding: 16px 0;
  border-bottom: 1px solid var(--border-subtle);
  flex: 0 0 auto;
  transition: padding var(--motion-base) var(--ease-out);
}
.ds-fdrawer-section:not(.is-open) { padding: 11px 0; }
.ds-fdrawer-section.is-open { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
.ds-fdrawer-section:last-child { border-bottom: 0; }
.ds-fdrawer-acc-head {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: none; border: 0; padding: 0; cursor: pointer;
}
.ds-fdrawer-acc-head:focus-visible { outline: 0; box-shadow: var(--shadow-focus); border-radius: var(--radius-sm); }
.ds-fdrawer-sec-title {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-muted); margin: 0;
  display: flex; align-items: center; gap: 7px;
}
/* Collapsed headers read as brand-blue affordances; the open one goes quiet. */
.ds-fdrawer-section:not(.is-open) .ds-fdrawer-sec-title { color: var(--brand-600); }
.ds-fdrawer-acc-chev { color: var(--brand-600); transition: transform var(--motion-base) var(--ease-out); flex-shrink: 0; }
.ds-fdrawer-section.is-open .ds-fdrawer-acc-chev { transform: rotate(180deg); }
/* Active-filter marker */
.ds-fdrawer-dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--danger-500); display: inline-block; }
.ds-fdrawer-acc-body { display: none; padding-top: 12px; }
.ds-fdrawer-section.is-open .ds-fdrawer-acc-body {
  display: flex; flex-direction: column; flex: 1; min-height: 0;
  animation: ds-fdrawer-acc-in var(--fdrawer-acc-motion) var(--ease-out);
}
/* Section toolbar (Reset / Unselect all) */
.ds-fdrawer-acts { display: flex; gap: 4px; padding: 0 0 8px; }
.ds-fdrawer-act {
  flex: 1; padding: 5px 8px;
  border: 1px solid var(--border-default); border-radius: var(--radius-sm);
  background: var(--bg-surface);
  font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease-out), border-color var(--motion-fast) var(--ease-out), color var(--motion-fast) var(--ease-out);
}
.ds-fdrawer-act:hover { background: var(--bg-sunken); border-color: var(--brand-300); color: var(--brand-700); }
.ds-fdrawer-act:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
/* Option list. Capped when collapsed-ish; the open section lets it fill. */
.ds-fdrawer-list { display: flex; flex-direction: column; max-height: var(--fdrawer-list-max); overflow-y: auto; }
.ds-fdrawer-section.is-open .ds-fdrawer-list { max-height: none; flex: 1 1 0; min-height: 0; }
.ds-fdrawer-item {
  display: flex; align-items: center; gap: 8px; width: 100%;
  text-align: left; padding: 7px 10px;
  border: 0; border-radius: var(--radius-sm); background: transparent;
  font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
  cursor: pointer; white-space: nowrap;
}
.ds-fdrawer-item:hover { background: var(--bg-muted); color: var(--text-primary); }
.ds-fdrawer-item input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--brand-600); cursor: pointer; margin: 0; flex-shrink: 0; }
.ds-fdrawer-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px var(--fdrawer-pad-x);
  border-top: 1px solid var(--border-subtle);
  flex: 0 0 auto;
}
.ds-fdrawer-foot > * { justify-content: center; height: 40px; padding: 0 16px; }
.ds-fdrawer-foot > *:disabled { opacity: 0.45; cursor: default; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .ds-fdrawer-panel, .ds-fdrawer-scrim { transition-duration: 1ms; }
  .ds-fdrawer-section.is-open .ds-fdrawer-acc-body { animation-duration: 1ms; }
}
/* Dashboard additions: option marks + counts, result line, footer buttons (DS secondary / primary) */
.ds-fdrawer-dot[hidden] { display:none; }   /* the DS dot sets display:inline-block, which would beat [hidden] */
.pfd-marker { width:22px; height:22px; box-sizing:border-box; border:1.5px solid #fff; border-radius:5px; display:inline-grid; place-items:center; color:#fff; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,.28); }   /* the map marker (34px, 8px radius, white border) scaled down */
.pfd-marker svg { width:12px; height:12px; }
.mfd-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.mfd-label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.mfd-n { font-size:11.5px; font-weight:600; color:var(--text-muted); font-variant-numeric:tabular-nums; }
.mfd-result { padding:10px var(--fdrawer-pad-x) 0; font-size:12px; color:var(--text-muted); }
.mfd-btn { display:inline-flex; align-items:center; border-radius:6px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
.mfd-btn--secondary { background:var(--bg-surface); border-color:var(--border-default); color:var(--text-primary); }
.mfd-btn--secondary:hover { background:var(--bg-sunken); }
.mfd-btn--primary { background:var(--brand-600,#2d7ffb); color:#fff; }
.mfd-btn--primary:hover { background:var(--brand-700,#1f5fc7); }
.mfd-btn:focus-visible { outline:0; box-shadow:var(--shadow-focus); }
/* active-filter count on the map's Filter button */
#map-filters-btn { position:relative; }
#map-filters-btn.is-active { color:var(--brand-600,#2d7ffb); }
.map-filter-count { position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 4px; border-radius:9999px; background:var(--brand-600,#2d7ffb); color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center; box-shadow:0 0 0 2px #fff; }
html[data-theme="dark"] .map-filter-count { box-shadow:0 0 0 2px #161f2e; }
</style>
</head>

<script>
const SC = window.sharedChrome;
const Ico = SC.I;

/* ----------- STATE ----------- */
let state = {
  portfolioTab: 'Portfolios',
  regionTab: 'Regional Values $',
  weatherTab: 'Property Weather Risk',
  viewMode: 'Map',
  propertyFilter: null, // initialised once PROPERTY_CATEGORIES is declared

/* Property categories — keys must match `cat` on each MAP_MARKERS row.
   Mirrors VESSEL_TYPES on MarineDashboard so the filter menu reads the same. */

/* ----------- HELPERS ----------- */
function tabs(tabs, active, groupAttr) {
  return `
  <div class="ds-tabs is-stretch" data-tab-group="${groupAttr}">
    <span class="ds-tab-pill is-init" data-tab-pill></span>
    ${tabs.map(t => `
      <button ${groupAttr}="${t}" aria-selected="${t===active}" class="ds-tab" style="font-size:12px; padding:6px 12px;">
        <span class="ds-tab-label">${t}</span>
      </button>
    `).join('')}
  </div>`;
}
function positionTabPills() {
  requestAnimationFrame(() => {
    document.querySelectorAll('.ds-tabs').forEach(group => {
      const pill   = group.querySelector('[data-tab-pill]');
      const active = group.querySelector('.ds-tab[aria-selected="true"]');
      if (!pill || !active) return;
      const gRect = group.getBoundingClientRect();
      const aRect = active.getBoundingClientRect();
      if (!aRect.width) return;
      pill.style.width     = aRect.width + 'px';
      pill.style.transform = `translateX(${aRect.left - gRect.left}px)`;
      requestAnimationFrame(() => pill.classList.remove('is-init'));
    });
  });
}

/* ----------- MAP ----------- */
let map = null;
let currentMapType = 'satellite';
let tileLayer = null;

const MAP_TYPES = {
  satellite: { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', bg: '#0b1e2e' },
  street:    { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', bg: '#f8fafc' },
  dark:      { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', bg: '#0b1e2e' },
  light:     { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', bg: '#e0ebe9' },
};

function setMapType(type) {
  if (!map || !MAP_TYPES[type]) return;
  currentMapType = type;
  if (tileLayer) map.removeLayer(tileLayer);
  tileLayer = L.tileLayer(MAP_TYPES[type].url, { attribution: '', subdomains: 'abcd', maxZoom: 19 }).addTo(map);
  document.getElementById('prop-map').style.background = MAP_TYPES[type].bg;
  document.querySelectorAll('[data-map-type]').forEach(b => {
    const isOn = b.dataset.mapType === type;
    const lbl = b.querySelector('[data-label]');
    const chk = b.querySelector('[data-check]');
    if (lbl) lbl.style.fontWeight = isOn ? '700' : '400';
    if (chk) chk.style.opacity = isOn ? '1' : '0';
  });
}

function initMap() {
  const c = document.getElementById('prop-map');
  if (!c) return;
  if (map) {
    if (!document.body.contains(map.getContainer())) {
      map.remove(); map = null; tileLayer = null;
    } else {
      map.invalidateSize();
      return;
    }
  }
  map = L.map(c, {
    center: [30, 0],
    zoom: 2,
    minZoom: 2,
    maxZoom: 6,
    zoomControl: true,
    scrollWheelZoom: true,
  });
  setMapType(currentMapType);

  const buildingIco = `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>`;
  window.__propMarkers = MAP_MARKERS;
  const propLeafletMarkers = []; // parallel array → used by the filter menu
  // Properties with an active weather/risk alert show a pulsing red dot on
  // their map marker. Add new entries here to flag additional properties.
  const ALERT_PROPERTIES = new Set(['Southeast Financial Ctr', '1670 Broadway']);
  MAP_MARKERS.forEach((m, idx) => {
    const cat = PROPERTY_CAT_BY_KEY[m.cat] || PROPERTY_CATEGORIES[0];
    const pulse = ALERT_PROPERTIES.has(m.name) ? `<span class="marker-pulse" title="Active risk alert"></span>` : '';
    const icon = L.divIcon({
      className: '',
      html: `<div class="marker-icon" style="background:${cat.color}">${cat.ico}${pulse}</div>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
    });
    const marker = L.marker([m.lat, m.lng], { icon })
      .bindPopup(buildPropertyPopupHTML(m, idx), { className:'prop-popup', maxWidth:280, minWidth:280, closeButton:true, autoPanPadding:[30,30] })
      .bindTooltip(buildPropertyTooltipHTML(m), { className:'prop-tip', direction:'top', offset:[0,-14], opacity:1 })
      .addTo(map);
    marker._propCat = m.cat;
    marker._portfolio = PORTFOLIOS[idx % PORTFOLIOS.length].name;
    propLeafletMarkers.push(marker);
  });
  window.__propLeafletMarkers = propLeafletMarkers;

  // Custom zoom controls
  const zin = document.querySelector('.leaflet-control-zoom-in');
  const zout = document.querySelector('.leaflet-control-zoom-out');
  if (zin) zin.innerHTML = `<span class="inline-flex items-center justify-center h-full w-full">${Ico.plus}</span>`;
  if (zout) zout.innerHTML = `<span class="inline-flex items-center justify-center h-full w-full">${Ico.minus}</span>`;

  // Fullscreen toggle
  const fsBtn = document.getElementById('map-fullscreen');
  const container = document.getElementById('map-container');
  if (fsBtn && container) {
    fsBtn.onclick = () => {
      const isFs = container.classList.toggle('is-fullscreen');
      fsBtn.innerHTML = isFs ? Ico.minimize : Ico.maximize;
      fsBtn.title = isFs ? 'Exit fullscreen' : 'Toggle fullscreen';
      document.body.style.overflow = isFs ? 'hidden' : '';
      setTimeout(() => map.invalidateSize(), 260);
    };
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && container.classList.contains('is-fullscreen')) fsBtn.onclick();
    });
  }

  // Map type selector
  const layersBtn = document.getElementById('map-layers-btn');
  const layersMenu = document.getElementById('map-layers-menu');
  const filtersBtn  = document.getElementById('map-filters-btn');
  const filtersMenu = null;   // the Filter button opens the filter drawer (no popover menu)
  if (layersBtn && layersMenu) {
    layersBtn.onclick = (e) => { e.stopPropagation(); layersMenu.classList.toggle('hidden'); filtersMenu && filtersMenu.classList.add('hidden'); portfolioMenu && portfolioMenu.classList.add('hidden'); };
    layersMenu.querySelectorAll('[data-map-type]').forEach(opt => {
      opt.onclick = (e) => { e.stopPropagation(); setMapType(opt.dataset.mapType); layersMenu.classList.add('hidden'); };
    });
  }

  // ── Map filter drawer (Skytek DS "Filter drawer", .ds-fdrawer) — same pattern as the Marine Dashboard ──
  // Live apply; one section open at a time; each section is a Set (all = unfiltered, subset, empty = none);
  // footer Reset (all sections) left, Done right.
  const portfolioBtn = null, portfolioMenu = null;
  const fdEsc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const applyPropertyFilter = () => {
    propLeafletMarkers.forEach(m => {
      const show = state.propertyFilter.has(m._propCat) && state.portfolioFilter.has(m._portfolio);
      if (show && !map.hasLayer(m)) m.addTo(map);
      if (!show && map.hasLayer(m)) map.removeLayer(m);
    });
  };
  const FD_SECTIONS = [
    { key:'propertyFilter',  title:'Property Type', field:'_propCat',   items: PROPERTY_CATEGORIES.map(c => ({ v:c.k, cat:c })) },
    { key:'portfolioFilter', title:'Portfolios',    field:'_portfolio', items: PORTFOLIOS.map(p => ({ v:p.name })) },
  ];
  const fdCount = (field, v) => propLeafletMarkers.filter(m => m[field] === v).length;
  const fdIsAll  = s => s.items.every(it => state[s.key].has(it.v));
  const fdIsNone = s => s.items.every(it => !state[s.key].has(it.v));
  const fdActive = () => FD_SECTIONS.filter(s => !fdIsAll(s)).length;
  if (state.fdOpenSection == null) state.fdOpenSection = 0;
  const chev = '<svg class="ds-fdrawer-acc-chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
  function fdSectionHTML(s, i) {
    const open = state.fdOpenSection === i, items = s.items.map(it => {
      const mark = it.cat ? `<span class="pfd-marker" style="background:${it.cat.color}" aria-hidden="true">${it.cat.ico}</span>` : '';
      return `<label class="ds-fdrawer-item"><input type="checkbox" data-fd-sec="${i}" value="${fdEsc(it.v)}" ${state[s.key].has(it.v) ? 'checked' : ''}>${mark}<span class="mfd-label">${fdEsc(it.v)}</span><span class="mfd-n">${fdCount(s.field, it.v)}</span></label>`;
    }).join('');
    return `<div class="ds-fdrawer-section${open ? ' is-open' : ''}" data-fd-section="${i}">
      <button type="button" class="ds-fdrawer-acc-head" data-fd-acc="${i}" aria-expanded="${open}" aria-controls="pfd-sec-${i}">
        <span class="ds-fdrawer-sec-title">${s.title}<span class="ds-fdrawer-dot" data-fd-dot="${i}" ${fdIsAll(s) ? 'hidden' : ''} aria-label="Filtered"></span></span>${chev}
      </button>
      <div class="ds-fdrawer-acc-body" id="pfd-sec-${i}" role="group" aria-label="${s.title}">
        <div class="ds-fdrawer-acts">
          <button type="button" class="ds-fdrawer-act" data-fd-act="reset" data-fd-i="${i}" ${fdIsAll(s) ? 'disabled' : ''}>Reset</button>
          <button type="button" class="ds-fdrawer-act" data-fd-act="none" data-fd-i="${i}" ${fdIsNone(s) ? 'disabled' : ''}>Unselect all</button>
        </div>
        <div class="ds-fdrawer-list scroll-thin">${items}</div>
      </div>
    </div>`;
  }
  function fdSync() {
    const el = document.getElementById('map-fdrawer');
    FD_SECTIONS.forEach((s, i) => {
      if (!el) return;
      el.querySelector(`[data-fd-dot="${i}"]`).hidden = fdIsAll(s);
      el.querySelector(`[data-fd-act="reset"][data-fd-i="${i}"]`).disabled = fdIsAll(s);
      el.querySelector(`[data-fd-act="none"][data-fd-i="${i}"]`).disabled = fdIsNone(s);
      el.querySelectorAll(`input[data-fd-sec="${i}"]`).forEach(cb => { cb.checked = state[s.key].has(cb.value); });
    });
    const n = fdActive();
    if (el) {
      el.querySelector('[data-fd-act="reset-all"]').disabled = n === 0;
      const shown = propLeafletMarkers.filter(m => FD_SECTIONS.every(s => state[s.key].has(m[s.field]))).length;
      el.querySelector('#pfd-result').textContent = `Showing ${shown} of ${propLeafletMarkers.length} properties`;
    }
    const badge = document.getElementById('map-filters-count');
    if (badge) { badge.hidden = n === 0; badge.textContent = n; }
    if (filtersBtn) { filtersBtn.classList.toggle('is-active', n > 0); filtersBtn.setAttribute('aria-label', n ? `Filter properties (${n} active)` : 'Filter properties'); }
  }
  function fdClose() {
    const el = document.getElementById('map-fdrawer'); if (!el || !el.classList.contains('is-open')) return;
    el.classList.remove('is-open'); el.setAttribute('aria-hidden', 'true');
    filtersBtn && filtersBtn.setAttribute('aria-expanded', 'false');
    const main = document.querySelector('main'); if (main) main.style.overflow = '';
    document.removeEventListener('keydown', fdKeys, true);
    filtersBtn && filtersBtn.focus();
  }
  function fdKeys(e) {
    const el = document.getElementById('map-fdrawer'); if (!el) return;
    if (e.key === 'Escape') { e.preventDefault(); fdClose(); return; }
    if (e.key !== 'Tab') return;
    const f = [...el.querySelectorAll('.ds-fdrawer-panel button:not([disabled]), .ds-fdrawer-panel input')].filter(x => x.offsetParent);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
  function fdOpen() {
    document.getElementById('map-fdrawer')?.remove();
    const el = document.createElement('div');
    el.id = 'map-fdrawer'; el.className = 'ds-fdrawer'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<div class="ds-fdrawer-scrim" data-fd-act="done"></div>
      <div class="ds-fdrawer-panel" role="dialog" aria-modal="true" aria-labelledby="pfd-title">
        <div class="ds-fdrawer-head"><span id="pfd-title">Filter properties</span>
          <button type="button" class="ds-fdrawer-close" data-fd-act="done" aria-label="Close filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="mfd-result" id="pfd-result" aria-live="polite"></div>
        <div class="ds-fdrawer-body">${FD_SECTIONS.map(fdSectionHTML).join('')}</div>
        <div class="ds-fdrawer-foot">
          <button type="button" class="mfd-btn mfd-btn--secondary" data-fd-act="reset-all">Reset</button>
          <button type="button" class="mfd-btn mfd-btn--primary" data-fd-act="done">Done</button>
        </div>
      </div>`;
    document.body.appendChild(el);
    el.addEventListener('change', e => {
      const cb = e.target.closest('input[data-fd-sec]'); if (!cb) return;
      const s = FD_SECTIONS[+cb.dataset.fdSec];
      if (cb.checked) state[s.key].add(cb.value); else state[s.key].delete(cb.value);
      applyPropertyFilter(); fdSync();
    });
    el.addEventListener('click', e => {
      const acc = e.target.closest('[data-fd-acc]');
      if (acc) {
        const i = +acc.dataset.fdAcc; state.fdOpenSection = state.fdOpenSection === i ? -1 : i;
        el.querySelectorAll('[data-fd-section]').forEach(sec => {
          const on = +sec.dataset.fdSection === state.fdOpenSection;
          sec.classList.toggle('is-open', on); sec.querySelector('[data-fd-acc]').setAttribute('aria-expanded', String(on));
        });
        return;
      }
      const act = e.target.closest('[data-fd-act]'); if (!act) return;
      const a = act.dataset.fdAct, s = FD_SECTIONS[+act.dataset.fdI];
      if (a === 'done') { fdClose(); return; }
      if (a === 'reset') state[s.key] = new Set(s.items.map(it => it.v));
      if (a === 'none') state[s.key] = new Set();
      if (a === 'reset-all') FD_SECTIONS.forEach(x => { state[x.key] = new Set(x.items.map(it => it.v)); });
      applyPropertyFilter(); fdSync();
    });
    fdSync();
    requestAnimationFrame(() => { el.classList.add('is-open'); el.setAttribute('aria-hidden', 'false'); });
    filtersBtn && filtersBtn.setAttribute('aria-expanded', 'true');
    const main = document.querySelector('main'); if (main) main.style.overflow = 'hidden';
    document.addEventListener('keydown', fdKeys, true);
    setTimeout(() => el.querySelector('.ds-fdrawer-close').focus(), 60);
  }
  if (filtersBtn) filtersBtn.onclick = (e) => { e.stopPropagation(); fdOpen(); };
  applyPropertyFilter(); fdSync();

  // Close map popovers when clicking outside
  document.addEventListener('click', (e) => {
    if (layersMenu  && !layersMenu.contains(e.target)  && e.target !== layersBtn  && !(layersBtn  && layersBtn.contains(e.target)))  layersMenu.classList.add('hidden');
    if (filtersMenu && !filtersMenu.contains(e.target) && e.target !== filtersBtn && !(filtersBtn && filtersBtn.contains(e.target))) filtersMenu.classList.add('hidden');
    if (portfolioMenu && !portfolioMenu.contains(e.target) && e.target !== portfolioBtn && !(portfolioBtn && portfolioBtn.contains(e.target))) portfolioMenu.classList.add('hidden');
  });
  setMapType('satellite');
}

/* ----------- CONTENT ----------- */
function Content() {
  return `
  <div class="px-4 lg:px-6 py-4 space-y-3">
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-3">
      ${PortfolioCard()}
      ${RegionCard()}
      ${WeatherCard()}
    </section>
    <section class="bg-white rounded-xl border border-ink-200 shadow-card overflow-hidden" id="map-container" style="height:calc((100vh - 380px) * 4 / 3); min-height:533px;">
      <div class="p-3 border-b border-ink-100 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="ds-tabs" data-tab-group="data-view">
            <span class="ds-tab-pill is-init" data-tab-pill></span>
            <button data-view="Map"  aria-selected="${state.viewMode==='Map'}"  class="ds-tab" style="font-size:12px;padding:6px 14px;"><span class="ds-tab-label">Map</span></button>
            <button data-view="List" aria-selected="${state.viewMode==='List'}" class="ds-tab" style="font-size:12px;padding:6px 14px;"><span class="ds-tab-label">List</span></button>
          </div>
        </div>
      </div>
      <div class="relative flex-1" style="height:calc(100% - 53px);">
        <div id="prop-map" class="absolute inset-0"></div>
        <button id="map-fullscreen" class="map-btn map-btn-fs absolute z-[400]" title="Toggle fullscreen" style="top:12px; left:12px;">${Ico.maximize}</button>
        <div class="absolute top-3 right-3 z-[400] flex flex-col gap-1 items-end">
          <div class="relative">
            <button id="map-layers-btn" class="map-btn" title="Layers">${Ico.layers}</button>
            <div id="map-layers-menu" class="hidden absolute top-0 right-[calc(100%+8px)] w-[160px] bg-white border border-ink-200 rounded-xl shadow-card overflow-hidden py-1">
              ${[
                { id:'satellite', label:'Satellite' },
                { id:'street',    label:'Street View' },
                { id:'dark',      label:'Dark Mode' },
                { id:'light',     label:'Light Mode' },
              ].map(o => `
                <button data-map-type="${o.id}" class="map-type-opt w-full flex items-center justify-between px-3 py-2 text-sm text-ink-700 hover:bg-ink-50 transition-colors">
                  <span data-label>${o.label}</span>
                  <span class="text-brand-600 opacity-0" data-check>${Ico.check}</span>
                </button>`).join('')}
            </div>
          </div>
          <div class="relative">
            <button id="map-filters-btn" class="map-btn" title="Filter properties" aria-label="Filter properties" aria-haspopup="dialog" aria-controls="map-fdrawer" aria-expanded="false">${Ico.filter}<span id="map-filters-count" class="map-filter-count" hidden></span></button>
          </div>
              <div class="px-3 py-2 bg-ink-50 border-b border-ink-200 text-[11px] font-semibold uppercase tracking-micro text-ink-600">Portfolio</div>
              <div class="overflow-y-auto scroll-thin py-1">
                ${PORTFOLIOS.map(p => `
                  <div class="po-row flex items-center gap-2.5 px-3 py-1.5 cursor-pointer hover:bg-ink-50" data-pfolio="${p.name}">
                    <input type="checkbox" class="po-cb h-4 w-4 rounded border-ink-300 accent-brand-600 pointer-events-none" checked />
                    <span class="text-[13px] text-ink-700 truncate">${p.name}</span>
                  </div>`).join('')}
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>`;
}

/* ----------- RENDER + WIRING ----------- */
window.render = function render() {
  if (map) { map.remove(); map = null; tileLayer = null; }
  document.getElementById('app').innerHTML = `
    ${SC.Sidebar()}
    <div class="flex-1 min-w-0 flex flex-col">
      ${SC.Topbar()}
      ${Content()}
    </div>
    ${SC.TweaksPanel()}
  `;
  SC.wireChrome();
  const wireTab = (attr, stateKey) => {
    document.querySelectorAll(`[${attr}]`).forEach(b => b.onclick = () => {
      const v = b.getAttribute(attr);
      if (state[stateKey] === v) return;
      state[stateKey] = v;
      const group = b.closest('.ds-tabs');
      if (group) {
        group.querySelectorAll('.ds-tab').forEach(t => t.setAttribute('aria-selected', String(t === b)));
        positionTabPills();
        setTimeout(() => render(), 220);
      } else { render(); }
    });
  };
  wireTab('data-portfolio-tab', 'portfolioTab');
  wireTab('data-region-tab',    'regionTab');
  requestAnimationFrame(positionTabPills);
  window.addEventListener('resize', positionTabPills, { passive: true });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { state.viewMode = b.dataset.view; render(); });
  setTimeout(initMap, 50);
};
window.render();
</script>
</body>
</html>
